<script src="../rank.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════ 기본 값 ══════════════════ */
  var TAU = Math.PI * 2;
  var cv = document.getElementById('stage');
  var ctx = cv.getContext('2d', { alpha: false });
  function $(id) { return document.getElementById(id); }

  var W = 390, H = 844, DPR = 1;
  var COLS = 8, MAXROWS = 20;
  var bw = 44, bh = 17, rowH = 21, originX = 10, gapX = 4, gridTop = 86;
  var BR = 4;                 /* 공 반지름 */
  var BSPEED = 640;           /* 공 속도(px/s) */
  var BALLS_PER_VOLLEY = 100;
  var SPAWN_TIME = 0.42;      /* 100개 연사 시간 */
  var padY = 750, dangerY = 700;
  var LAUNCH = { x: 195, y: 750 };

  /* 팔레트: 채움 / 테두리 / 글로우 */
  var PAL = [
    { f: '#0d2a4a', e: '#37e0ff', g: 'rgba(55,224,255,.20)' },
    { f: '#241247', e: '#a07dff', g: 'rgba(160,125,255,.20)' },
    { f: '#0d3220', e: '#7dff9b', g: 'rgba(125,255,155,.18)' },
    { f: '#3a0f24', e: '#ff5a9e', g: 'rgba(255,90,158,.20)' },
    { f: '#3a2a08', e: '#ffc94d', g: 'rgba(255,201,77,.20)' },
    { f: '#082a3a', e: '#4dc3ff', g: 'rgba(77,195,255,.20)' }
  ];

  /* ══════════════════ 상태 ══════════════════ */
  var state = 'title';        /* title | aim | fire | wait | over */
  var grid = [];              /* [row][col] = brick | null */
  var balls = [], parts = [], beams = [], rings = [];
  var score = 0, best = 0, level = 1, combo = 0, comboT = 0, bricksLeft = 0;
  var speedMul = 1, muted = false;
  var aim = { on: false, dx: 0, dy: -1 };
  var fireQ = 0, fireAcc = 0, fireDir = { x: 0, y: -1 }, volleyT = 0, launched = 0;
  var descend = { on: false, t: 0, off: 0 };
  var shake = 0;
  var chalTarget = 0, chalHit = false;
  var lastT = 0, hudDirty = true, hudAcc = 0, banT = null;

  var SPR = { bg: null, ball: null, glow: null, pad: null, dot: {}, br: {} };

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { }
    return null;
  }

  /* ══════════════════ 레이아웃 ══════════════════ */
  function layout() {
    W = Math.max(300, Math.min(window.innerWidth || 390, 560));
    H = Math.max(470, window.innerHeight || 844);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.style.left = Math.max(0, Math.round((window.innerWidth - W) / 2)) + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

    originX = 10; gapX = 4;
    bw = (W - originX * 2 - gapX * (COLS - 1)) / COLS;
    bh = Math.max(15, Math.round(bw * 0.50));
    rowH = bh + 4;
    gridTop = Math.round(96 + safeTop());
    padY = Math.round(H - 96);
    LAUNCH.x = W / 2; LAUNCH.y = padY;
    dangerY = Math.round(padY - 52);
    MAXROWS = Math.max(6, Math.floor((dangerY - gridTop) / rowH));

    /* 그리드 길이 맞추기(회전·리사이즈) */
    if (grid.length !== MAXROWS) {
      var ng = [], r;
      for (r = 0; r < MAXROWS; r++) ng.push(grid[r] || newRow());
      grid = ng;
    }
    var ban = $('banner');
    if (ban) ban.style.top = Math.round(gridTop + (dangerY - gridTop) * 0.45) + 'px';

    SPR.br = {};                 /* 스프라이트 캐시는 크기가 바뀌면 다시 */
    buildBg();
    bakeBall();
    bakeGlow();
    bakePad();
    hudDirty = true;
  }

  function bakeBall() {
    var rad = BR, pad = 5, s = (rad + pad) * 2;
    var c = document.createElement('canvas');
    c.width = c.height = Math.ceil(s * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.30, '#d8f7ff');
    rg.addColorStop(0.48, 'rgba(80,215,255,.85)');
    rg.addColorStop(0.72, 'rgba(40,140,255,.35)');
    rg.addColorStop(1, 'rgba(20,90,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, TAU); g.fill();
    SPR.ball = { c: c, s: s };
  }

  function bakeGlow() {
    var s = 96, c = document.createElement('canvas');
    c.width = c.height = Math.ceil(s * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, 'rgba(120,230,255,.55)');
    rg.addColorStop(0.45, 'rgba(60,180,255,.20)');
    rg.addColorStop(1, 'rgba(20,90,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, TAU); g.fill();
    SPR.glow = { c: c, s: s };
  }

  function bakePad() {
    var s = 96, h = 34, c = document.createElement('canvas');
    c.width = Math.ceil(s * DPR); c.height = Math.ceil(h * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var lg = g.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, '#2a5f8f');
    lg.addColorStop(0.45, '#12324f');
    lg.addColorStop(1, '#0a1a2c');
    g.fillStyle = lg;
    roundRect(g, 4, h * 0.34, s - 8, h * 0.5, 9); g.fill();
    g.strokeStyle = '#59e6ff'; g.lineWidth = 2;
    roundRect(g, 4, h * 0.34, s - 8, h * 0.5, 9); g.stroke();
    g.fillStyle = 'rgba(150,245,255,.9)';
    roundRect(g, s / 2 - 11, h * 0.42, 22, h * 0.16, 4); g.fill();
    SPR.pad = { c: c, s: s, h: h };
  }

  function buildBg() {
    var c = document.createElement('canvas');
    c.width = Math.ceil(W * DPR); c.height = Math.ceil(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var lg = g.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, '#080d20');
    lg.addColorStop(0.45, '#060a18');
    lg.addColorStop(1, '#04060f');
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
    /* 옅은 격자 */
    g.strokeStyle = 'rgba(70,120,220,.075)';
    g.lineWidth = 1;
    var x, y;
    for (x = 0; x <= W; x += 32) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
    for (y = 0; y <= H; y += 32) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
    /* 위·아래 비네트 */
    var vg = g.createLinearGradient(0, 0, 0, 120);
    vg.addColorStop(0, 'rgba(20,60,140,.28)');
    vg.addColorStop(1, 'rgba(20,60,140,0)');
    g.fillStyle = vg; g.fillRect(0, 0, W, 120);
    SPR.bg = c;
  }

  function safeTop() {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
    document.body.appendChild(d);
    var v = parseFloat(getComputedStyle(d).paddingTop) || 0;
    document.body.removeChild(d);
    return v;
  }

  function newRow() { var a = [], i; for (i = 0; i < COLS; i++) a.push(null); return a; }

  function roundRect(g, x, y, w, h, r) {
    if (w < 0) { x += w; w = -w; }
    if (h < 0) { y += h; h = -h; }
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /* ══════════════════ 벽돌 스프라이트 ══════════════════ */
  function brickSprite(colIdx, hp, maxHp, type) {
    var key = colIdx + '|' + hp + '|' + maxHp + '|' + type;
    if (SPR.br[key]) return SPR.br[key];
    var pad = 4, w = bw + pad * 2, h = bh + pad * 2;
    var c = document.createElement('canvas');
    c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    var e = PAL[colIdx % PAL.length];
    var edge = e.e, fill = e.f, glow = e.g;
    if (type === 'lh') { edge = '#5ff4ff'; fill = '#07303a'; glow = 'rgba(95,244,255,.26)'; }
    if (type === 'lv') { edge = '#ff6ad5'; fill = '#340a2c'; glow = 'rgba(255,106,213,.26)'; }
    if (type === 'bomb') { edge = '#ffb23f'; fill = '#3a2405'; glow = 'rgba(255,178,63,.28)'; }

    /* 글로우 링 (그림자 블러 대신 미리 그린 사각 링) */
    g.fillStyle = glow;
    roundRect(g, pad - 3, pad - 3, bw + 6, bh + 6, 8); g.fill();
    g.fillStyle = glow;
    roundRect(g, pad - 1.5, pad - 1.5, bw + 3, bh + 3, 7); g.fill();

    /* 본체 */
    g.fillStyle = fill;
    roundRect(g, pad, pad, bw, bh, 5); g.fill();
    /* 위쪽 하이라이트 */
    g.fillStyle = 'rgba(255,255,255,.14)';
    roundRect(g, pad + 2, pad + 2, bw - 4, Math.max(3, bh * 0.34), 3); g.fill();
    /* 테두리 */
    g.strokeStyle = edge;
    g.lineWidth = 1.7;
    roundRect(g, pad + 0.85, pad + 0.85, bw - 1.7, bh - 1.7, 5); g.stroke();

    /* 남은 체력 눈금 */
    if (maxHp > 1) {
      var n = maxHp, i, segW = (bw - 10) / n;
      for (i = 0; i < n; i++) {
        g.fillStyle = i < hp ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.13)';
        g.fillRect(pad + 5 + i * segW, pad + bh - 4.5, Math.max(2, segW - 1.6), 2);
      }
    }

    /* 특수 아이콘 */
    var cx = pad + bw / 2, cy = pad + bh / 2;
    g.strokeStyle = '#ffffff'; g.lineWidth = 1.6; g.lineCap = 'round';
    if (type === 'lh') {
      g.beginPath(); g.moveTo(cx - 7, cy - 2.5); g.lineTo(cx + 7, cy - 2.5); g.stroke();
      g.beginPath(); g.moveTo(cx - 7, cy + 2.5); g.lineTo(cx + 7, cy + 2.5); g.stroke();
      g.beginPath(); g.moveTo(cx + 4, cy - 5.5); g.lineTo(cx + 7.5, cy - 2.5); g.lineTo(cx + 4, cy + 0.5); g.stroke();
    } else if (type === 'lv') {
      g.beginPath(); g.moveTo(cx - 2.5, cy - 7); g.lineTo(cx - 2.5, cy + 7); g.stroke();
      g.beginPath(); g.moveTo(cx + 2.5, cy - 7); g.lineTo(cx + 2.5, cy + 7); g.stroke();
      g.beginPath(); g.moveTo(cx - 5.5, cy + 4); g.lineTo(cx - 2.5, cy + 7.5); g.lineTo(cx + 0.5, cy + 4); g.stroke();
    } else if (type === 'bomb') {
      g.beginPath(); g.arc(cx, cy + 0.5, 4.4, 0, TAU); g.stroke();
      g.beginPath(); g.moveTo(cx + 2.6, cy - 3.4); g.lineTo(cx + 5.2, cy - 6.2); g.stroke();
      g.fillStyle = '#ffe9a8';
      g.beginPath(); g.arc(cx + 5.6, cy - 6.6, 1.9, 0, TAU); g.fill();
    }

    SPR.br[key] = { c: c, w: w, h: h, pad: pad };
    return SPR.br[key];
  }

  /* ══════════════════ 사운드 (WebAudio 합성) ══════════════════ */
  var AC = null, master = null, noiseBuf = null, lastHitSfx = 0, sfxBudget = 0;

  function initAudio() {
    if (AC) return;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(AC.destination);
      var len = Math.floor(AC.sampleRate * 0.4), i;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    } catch (e) { AC = null; }
  }
  function resumeAudio() { if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { } } }

  function tone(type, f0, f1, dur, vol, delay) {
    if (!AC || muted) return;
    var t = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q, delay) {
    if (!AC || muted || !noiseBuf) return;
    var t = AC.currentTime + (delay || 0);
    var s = AC.createBufferSource(); s.buffer = noiseBuf;
    var bp = AC.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = freq; bp.Q.value = q || 1;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function sfxHit(c) {
    if (!AC || muted) return;
    if (AC.currentTime - lastHitSfx < 0.024) return;
    lastHitSfx = AC.currentTime;
    var f = 330 + Math.min(c, 24) * 34;
    tone('triangle', f, f * 0.82, 0.07, 0.06);
  }
  function sfxBreak(c) {
    if (!AC || muted) return;
    tone('square', 520 + Math.min(c, 20) * 22, 260, 0.075, 0.035);
    noise(0.09, 0.05, 1100 + Math.min(c, 20) * 55, 1.2);
  }
  function sfxLaunch() {
    tone('sawtooth', 180, 620, 0.16, 0.05);
    noise(0.22, 0.035, 1800, 0.8);
  }
  function sfxLaser(v) { tone('sawtooth', 1400, 240, 0.2, 0.075); noise(0.16, 0.045, v ? 2200 : 1500, 2.5); }
  function sfxBomb() { tone('sine', 130, 36, 0.34, 0.11); noise(0.3, 0.075, 420, 0.7); }
  function sfxRecall() { tone('sine', 720, 210, 0.22, 0.05); }
  function sfxLevel() {
    tone('triangle', 523, 523, 0.11, 0.06, 0);
    tone('triangle', 659, 659, 0.11, 0.06, 0.1);
    tone('triangle', 784, 1046, 0.2, 0.07, 0.2);
  }
  function sfxOver() {
    tone('sawtooth', 320, 210, 0.22, 0.06, 0);
    tone('sawtooth', 240, 120, 0.4, 0.07, 0.2);
  }
  function sfxDescend() { tone('sine', 210, 140, 0.12, 0.04); }

  /* ══════════════════ 벽 만들기 ══════════════════ */
  function buildWall() {
    var r, c;
    for (r = 0; r < MAXROWS; r++) grid[r] = newRow();
    bricksLeft = 0;

    var rows = Math.min(8, 5 + Math.floor((level - 1) / 2));
    rows = Math.max(2, Math.min(rows, MAXROWS - 3));
    var baseHp = Math.min(4, 1 + Math.floor((level - 1) / 3));

    for (r = 0; r < rows; r++) {
      for (c = 0; c < COLS; c++) {
        if (r > 0 && Math.random() < 0.05) continue;              /* 가끔 빈 칸 */
        var hp = baseHp + (Math.random() < Math.min(0.45, 0.16 + level * 0.03) ? 1 : 0);
        if (r === 0) hp += 1;                                     /* 맨 윗줄은 단단하게 */
        hp = Math.max(1, Math.min(6, hp));
        grid[r][c] = { hp: hp, maxHp: hp, col: (r * 2 + c) % PAL.length, type: 'n' };
        bricksLeft++;
      }
    }

    /* 특수 블록: 줄을 달리해 하나씩 (가로·세로 레이저 + 폭탄) */
    var sp = Math.min(7, 3 + Math.floor(level / 2)), i, c2, tries;
    var used = {};
    for (i = 0; i < sp; i++) {
      var rr = 1 + (i % Math.max(1, rows - 1));
      var cc = -1;
      for (tries = 0; tries < 10; tries++) {
        var cand = Math.floor(Math.random() * COLS);
        if (grid[rr] && grid[rr][cand] && !used[rr + ':' + cand]) { cc = cand; break; }
      }
      if (cc < 0) {
        for (c2 = 0; c2 < COLS; c2++) {
          if (grid[rr] && grid[rr][c2] && !used[rr + ':' + c2]) { cc = c2; break; }
        }
      }
      if (cc < 0) continue;
      used[rr + ':' + cc] = 1;
      var b = grid[rr][cc];
      b.type = ['lh', 'lv', 'bomb'][i % 3];
      b.hp = 1; b.maxHp = 1;
    }
    hudDirty = true;
  }

  function lowestRow() {
    var r, c;
    for (r = MAXROWS - 1; r >= 0; r--) {
      for (c = 0; c < COLS; c++) if (grid[r] && grid[r][c]) return r;
    }
    return -1;
  }

  function shiftDown() {
    var r;
    for (r = MAXROWS - 1; r >= 1; r--) grid[r] = grid[r - 1];
    grid[0] = newRow();
  }

  /* ══════════════════ 게임 진행 ══════════════════ */
  function startGame() {
    score = 0; level = 1; combo = 0; comboT = 0;
    balls = []; parts = []; beams = []; rings = [];
    fireQ = 0; fireAcc = 0; launched = 0; volleyT = 0;
    descend.on = false; descend.off = 0; shake = 0;
    state = 'aim';
    buildWall();
    $('title').hidden = true;
    $('over').hidden = true;
    $('recall').hidden = true;
    setAimDefault();
    paintHud();
    banner('레벨 1', '');
  }

  function setAimDefault() { aim.dx = 0; aim.dy = -1; aim.on = false; }

  function setAimFrom(x, y) {
    var dx = x - LAUNCH.x, dy = y - LAUNCH.y;
    if (dy > -12) dy = -12;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= len; dy /= len;
    /* 수평 무한 바운스 방지: 최소 상승각 16° */
    var minY = -Math.sin(16 * Math.PI / 180);
    if (dy > minY) {
      dy = minY;
      dx = (dx < 0 ? -1 : 1) * Math.sqrt(Math.max(0, 1 - dy * dy));
    }
    aim.dx = dx; aim.dy = dy;
  }

  function fire() {
    if (state !== 'aim') return;
    state = 'fire';
    fireQ = BALLS_PER_VOLLEY; fireAcc = 0; launched = 0; volleyT = 0;
    fireDir.x = aim.dx; fireDir.y = aim.dy;
    combo = 0; comboT = 0;
    $('recall').hidden = false;
    aim.on = false;
    shake = Math.max(shake, 2.4);
    rings.push({ x: LAUNCH.x, y: LAUNCH.y - 10, t: 0, life: 0.3, r: 8, mr: 44, c: '120,235,255' });
    sfxLaunch();
  }

  function spawnBall() {
    var a = Math.atan2(fireDir.y, fireDir.x) + (Math.random() - 0.5) * 0.17;
    var sp = BSPEED * (0.93 + Math.random() * 0.15);
    balls.push({
      x: LAUNCH.x + (Math.random() - 0.5) * 6,
      y: LAUNCH.y - 12 - Math.random() * 4,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0
    });
  }

  function recallNow() {
    if (state !== 'fire') return;
    fireQ = 0;
    endTurn(true);
  }

  /* 벽 반사 뒤 수평 왕복 방지 */
  function fixAngle(b) {
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || BSPEED;
    var minVy = sp * 0.28;
    if (Math.abs(b.vy) < minVy) {
      b.vy = (b.vy < 0 ? -1 : 1) * minVy;
      var rem = Math.sqrt(Math.max(sp * sp - b.vy * b.vy, 1));
      b.vx = (b.vx < 0 ? -1 : 1) * rem;
    }
  }

  function moveBalls(d) {
    var i, k, b, sp, n, sh, dead;
    for (i = balls.length - 1; i >= 0; i--) {
      b = balls[i];
      sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      n = Math.max(1, Math.ceil(sp * d / 3.4));
      sh = d / n;
      dead = false;
      for (k = 0; k < n; k++) {
        b.x += b.vx * sh; b.y += b.vy * sh;
        if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); fixAngle(b); }
        else if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); fixAngle(b); }
        if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy); fixAngle(b); }
        hitBricks(b);
        if (b.y > padY + 14) { dead = true; break; }
      }
      b.life += d;
      if (dead || b.life > 14) {
        if (dead) rings.push({ x: b.x, y: padY, t: 0, life: 0.22, r: 2, mr: 11, c: '120,235,255' });
        balls.splice(i, 1);
      }
    }
  }

  function hitBricks(b) {
    var r0 = Math.floor((b.y - gridTop - descend.off) / rowH);
    var c0 = Math.floor((b.x - originX) / (bw + gapX));
    var dr, dc, rr, cc, row, br, x, y;
    for (dr = -1; dr <= 1; dr++) {
      rr = r0 + dr;
      if (rr < 0 || rr >= grid.length) continue;
      row = grid[rr];
      if (!row) continue;
      for (dc = -1; dc <= 1; dc++) {
        cc = c0 + dc;
        if (cc < 0 || cc >= COLS) continue;
        br = row[cc];
        if (!br || br.hp <= 0) continue;
        x = originX + cc * (bw + gapX);
        y = gridTop + rr * rowH + descend.off;
        if (resolveHit(b, x, y)) { damage(cc, rr, b); return; }
      }
    }
  }

  function resolveHit(b, x, y) {
    var cx = b.x < x ? x : (b.x > x + bw ? x + bw : b.x);
    var cy = b.y < y ? y : (b.y > y + bh ? y + bh : b.y);
    var dx = b.x - cx, dy = b.y - cy;
    var d2 = dx * dx + dy * dy;
    if (d2 > BR * BR) return false;

    if (d2 < 0.0004) {
      /* 공 중심이 벽돌 안: 가장 얕은 축으로 밀어냄 */
      var l = b.x - x, r = x + bw - b.x, t = b.y - y, bo = y + bh - b.y;
      var m = Math.min(l, r, t, bo);
      if (m === l) { b.x = x - BR; b.vx = -Math.abs(b.vx); }
      else if (m === r) { b.x = x + bw + BR; b.vx = Math.abs(b.vx); }
      else if (m === t) { b.y = y - BR; b.vy = -Math.abs(b.vy); }
      else { b.y = y + bh + BR; b.vy = Math.abs(b.vy); }
    } else {
      var dd = Math.sqrt(d2), nx = dx / dd, ny = dy / dd;
      b.x = cx + nx * (BR + 0.2);
      b.y = cy + ny * (BR + 0.2);
      var dot = b.vx * nx + b.vy * ny;
      if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
    }
    fixAngle(b);
    return true;
  }

  function damage(c, r, b, amount) {
    var br = grid[r] && grid[r][c];
    if (!br || br.hp <= 0) return;
    var dmg = amount || 1;
    br.hp -= dmg;
    score += 2;
    combo++;
    comboT = 1.15;
    burst(b ? b.x : originX + c * (bw + gapX) + bw / 2, b ? b.y : gridTop + r * rowH + descend.off + bh / 2, br.col, 3);
    if (br.hp <= 0) destroyBrick(c, r, br, 0);
    else { sfxHit(combo); addShake(1.3); }
    checkChallenge();
    hudDirty = true;
  }

  function destroyBrick(c, r, br, depth) {
    if (!grid[r] || grid[r][c] !== br) return;
    grid[r][c] = null;
    bricksLeft--;
    var mult = 1 + Math.min(combo, 25) * 0.08;
    score += Math.round((30 + level * 5) * mult);
    var px = originX + c * (bw + gapX) + bw / 2;
    var py = gridTop + r * rowH + descend.off + bh / 2;
    burst(px, py, br.col, 14);
    if (rings.length < 10) rings.push({ x: px, y: py, t: 0, life: 0.24, r: 3, mr: 20, c: '150,220,255' });
    addShake(2.2);
    sfxBreak(combo);

    if (depth < 6) {
      if (br.type === 'lh') fireBeam(r, 'h');
      else if (br.type === 'lv') fireBeam(c, 'v');
      else if (br.type === 'bomb') explode(c, r);
    }
    hudDirty = true;
    checkChallenge();
  }

  function fireBeam(idx, dir) {
    var n = dir === 'h' ? 'row' : 'col';
    beams.push({ dir: dir, idx: idx, t: 0, life: 0.34 });
    if (dir === 'h') sfxLaser(0); else sfxLaser(1);
    addShake(3.4);
    var i, c, r, br;
    if (dir === 'h') {
      for (c = 0; c < COLS; c++) {
        br = grid[idx] && grid[idx][c];
        if (br && br.hp > 0) damage(c, idx, null, 2);
      }
    } else {
      for (r = 0; r < MAXROWS; r++) {
        br = grid[r] && grid[r][idx];
        if (br && br.hp > 0) damage(idx, r, null, 2);
      }
    }
  }

  function explode(c, r) {
    sfxBomb();
    addShake(6);
    var cx = originX + c * (bw + gapX) + bw / 2;
    var cy = gridTop + r * rowH + descend.off + bh / 2;
    rings.push({ x: cx, y: cy, t: 0, life: 0.42, r: 6, mr: 78, c: '255,190,90' });
    burst(cx, cy, 4, 26);
    var dr, dc, rr, cc, br;
    for (dr = -1; dr <= 1; dr++) {
      rr = r + dr;
      if (rr < 0 || rr >= MAXROWS) continue;
      for (dc = -1; dc <= 1; dc++) {
        cc = c + dc;
        if (cc < 0 || cc >= COLS) continue;
        br = grid[rr] && grid[rr][cc];
        if (br && br.hp > 0) damage(cc, rr, null, 2);
      }
    }
  }

  function endTurn(byRecall) {
    if (state !== 'fire') return;
    var i;
    for (i = 0; i < balls.length; i++) {
      rings.push({ x: balls[i].x, y: balls[i].y, t: 0, life: 0.22, r: 2, mr: 12, c: '120,235,255' });
    }
    balls.length = 0;
    fireQ = 0;
    $('recall').hidden = true;
    if (byRecall) sfxRecall();

    if (bricksLeft <= 0) {
      state = 'wait';
      banner('레벨 클리어!', 'gold');
      sfxLevel();
      setTimeout(function () { if (state === 'wait') nextLevel(); }, 720);
      return;
    }
    if (lowestRow() >= MAXROWS - 1) { gameOver(); return; }

    shiftDown();
    descend.on = true; descend.t = 0; descend.off = -rowH;
    state = 'wait';
    sfxDescend();
    setTimeout(function () {
      descend.on = false; descend.off = 0;
      if (state !== 'wait') return;
      if (bricksLeft > 0 && lowestRow() >= MAXROWS - 1) { gameOver(); return; }
      state = 'aim';
      setAimDefault();
      hudDirty = true;
    }, 250);
  }

  function nextLevel() {
    level++;
    buildWall();
    state = 'aim';
    setAimDefault();
    banner('레벨 ' + level, '');
    paintHud();
  }

  function gameOver() {
    state = 'over';
    var isNew = score > best;
    if (isNew) { best = score; store('bb100-best', String(best)); }
    $('ovTitle').textContent = isNew && score > 0 ? '🎉 최고 기록!' : '게임 오버';
    $('ovScore').textContent = score.toLocaleString();
    $('ovSub').textContent = '벽돌이 위험선에 닿았습니다';
    $('ovLevel').textContent = level;
    $('ovBest').textContent = best.toLocaleString();
    $('ovNew').hidden = !isNew || score === 0;
    $('over').hidden = false;
    $('recall').hidden = true;
    paintHud();
    sfxOver();
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ arcade: 'gameover', slug: 'brick-breaker-100', score: score }, '*');
      }
    } catch (e) { }
    if (window.ArcadeRank) {
      ArcadeRank.show({
        id: 'brick-breaker-100', score: score, delay: 1400,
        cancelIf: function () { return state !== 'over'; }
      });
    }
  }

  /* ══════════════════ 파티클 ══════════════════ */
  function burst(x, y, col, n) {
    var i, a, sp;
    for (i = 0; i < n; i++) {
      if (parts.length > 340) break;
      a = Math.random() * TAU;
      sp = 40 + Math.random() * 250;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: 0.28 + Math.random() * 0.42, max: 0.7,
        c: col % PAL.length, s: 1.8 + Math.random() * 2.8
      });
    }
  }

  function addShake(v) { shake = Math.min(9, shake + v); }

  function updateParts(d) {
    var i, p;
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.life -= d;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      p.vy += 520 * d;
      p.vx *= 0.985; p.vy *= 0.99;
      p.x += p.vx * d; p.y += p.vy * d;
    }
    for (i = beams.length - 1; i >= 0; i--) {
      beams[i].t += d;
      if (beams[i].t > beams[i].life) beams.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      rings[i].t += d;
      if (rings[i].t > rings[i].life) rings.splice(i, 1);
    }
  }

  /* ══════════════════ 업데이트 ══════════════════ */
  function update(dt) {
    var d = dt * speedMul;

    if (state === 'fire') {
      volleyT += dt;
      if (fireQ > 0) {
        fireAcc += d * (BALLS_PER_VOLLEY / SPAWN_TIME);
        while (fireAcc >= 1 && fireQ > 0) { fireAcc -= 1; fireQ--; launched++; spawnBall(); }
      }
      moveBalls(d);
      if ((fireQ === 0 && balls.length === 0) || volleyT > 10) endTurn(false);
    }

    /* 안전장치: 조준 중인데 벽이 남아 있지 않으면 다음 레벨 */
    if (state === 'aim' && bricksLeft === 0) nextLevel();

    if (comboT > 0) { comboT -= d; if (comboT <= 0) combo = 0; }

    if (descend.on) {
      descend.t += dt;
      var p = Math.min(1, descend.t / 0.25);
      var e = 1 - Math.pow(1 - p, 3);
      descend.off = -rowH * (1 - e);
    }

    updateParts(d);

    if (shake > 0) shake = Math.max(0, shake - dt * 26);

    /* HUD 스로틀: 초당 8회까지만 갱신 */
    if (state === 'fire') hudDirty = true;
    hudAcc += dt;
    if (hudDirty && hudAcc >= 0.12) { paintHud(); hudDirty = false; hudAcc = 0; }
  }

  function paintHud() {
    $('score').textContent = score.toLocaleString();
    $('best').textContent = Math.max(best, score).toLocaleString();
    $('level').textContent = level;
    $('left').textContent = bricksLeft;
    $('alive').textContent = state === 'fire' ? (fireQ + balls.length) : BALLS_PER_VOLLEY;
  }

  /* ══════════════════ 조준 궤적 ══════════════════ */
  function brickAtPoint(x, y) {
    var r = Math.floor((y - gridTop - descend.off) / rowH);
    var c = Math.floor((x - originX) / (bw + gapX));
    var dr, dc, rr, cc, br;
    for (dr = -1; dr <= 1; dr++) {
      rr = r + dr;
      if (rr < 0 || rr >= grid.length) continue;
      for (dc = -1; dc <= 1; dc++) {
        cc = c + dc;
        if (cc < 0 || cc >= COLS) continue;
        br = grid[rr] && grid[rr][cc];
        if (!br || br.hp <= 0) continue;
        var bx = originX + cc * (bw + gapX), by = gridTop + rr * rowH + descend.off;
        if (x >= bx - BR && x <= bx + bw + BR && y >= by - BR && y <= by + bh + BR) return true;
      }
    }
    return false;
  }

  /* 처음 위치부터 1차 벽 반사까지 추적 */
  function traceAim(ox, oy, dx, dy) {
    var pts = [{ x: ox, y: oy }];
    var x = ox, y = oy, vx = dx, vy = dy, bounces = 0, total = 0, step = 5;
    while (total < 1500) {
      x += vx * step; y += vy * step; total += step;
      if (x < BR) { x = BR; vx = -vx; bounces++; pts.push({ x: x, y: y }); }
      else if (x > W - BR) { x = W - BR; vx = -vx; bounces++; pts.push({ x: x, y: y }); }
      if (y < BR) { y = BR; vy = -vy; pts.push({ x: x, y: y }); }
      if (brickAtPoint(x, y)) { pts.push({ x: x, y: y }); break; }
      if (bounces > 1) break;
    }
    pts.push({ x: x, y: y });
    return pts;
  }

  /* ══════════════════ 그리기 ══════════════════ */
  function drawDanger() {
    var low = lowestRow();
    var near = low >= 0 && low >= MAXROWS - 6;
    ctx.save();
    ctx.setLineDash([9, 9]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = near ? 'rgba(255,90,130,.8)' : 'rgba(110,150,255,.26)';
    ctx.beginPath(); ctx.moveTo(4, dangerY); ctx.lineTo(W - 4, dangerY); ctx.stroke();
    ctx.restore();
    if (near) {
      ctx.fillStyle = 'rgba(255,60,95,.075)';
      ctx.fillRect(0, dangerY, W, H - dangerY);
    }
  }

  function drawBricks() {
    var r, c, b, x, y, sp;
    for (r = 0; r < grid.length; r++) {
      for (c = 0; c < COLS; c++) {
        b = grid[r] && grid[r][c];
        if (!b || b.hp <= 0) continue;
        x = originX + c * (bw + gapX);
        y = gridTop + r * rowH + descend.off;
        sp = brickSprite(b.col, b.hp, b.maxHp, b.type);
        ctx.drawImage(sp.c, x - sp.pad, y - sp.pad, sp.w, sp.h);
      }
    }
  }

  function drawBeams() {
    var i, bm, y, x, a;
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < beams.length; i++) {
      bm = beams[i];
      a = 1 - bm.t / bm.life;
      if (bm.dir === 'h') {
        y = gridTop + bm.idx * rowH + descend.off + bh / 2;
        ctx.strokeStyle = 'rgba(90,240,255,' + (0.20 * a).toFixed(3) + ')';
        ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.strokeStyle = 'rgba(220,255,255,' + (0.85 * a).toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      } else {
        x = originX + bm.idx * (bw + gapX) + bw / 2;
        ctx.strokeStyle = 'rgba(255,110,215,' + (0.20 * a).toFixed(3) + ')';
        ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(x, gridTop); ctx.lineTo(x, dangerY); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,235,255,' + (0.85 * a).toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, gridTop); ctx.lineTo(x, dangerY); ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawRings() {
    var i, rg, p, rr;
    for (i = 0; i < rings.length; i++) {
      rg = rings[i];
      p = rg.t / rg.life;
      rr = rg.r + (rg.mr - rg.r) * p;
      ctx.strokeStyle = 'rgba(' + rg.c + ',' + (0.5 * (1 - p)).toFixed(3) + ')';
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rr, 0, TAU); ctx.stroke();
    }
  }

  function drawBalls() {
    var i, b, s = SPR.ball.s;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      ctx.drawImage(SPR.ball.c, b.x - s / 2, b.y - s / 2, s, s);
    }
  }

  function drawParts() {
    var i, p, a, s;
    if (!SPR.dot[0]) {
      for (i = 0; i < PAL.length; i++) SPR.dot[i] = dotSprite(PAL[i].e);
      SPR.dot.white = dotSprite('#eafcff');
      SPR.dot.gold = dotSprite('#ffd166');
    }
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      a = Math.max(0, Math.min(1, p.life / p.max));
      ctx.globalAlpha = a;
      s = p.s;
      var d = SPR.dot[p.c] || SPR.dot[0];
      ctx.drawImage(d, p.x - s, p.y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
  }

  function dotSprite(color) {
    var s = 14, c = document.createElement('canvas');
    c.width = c.height = Math.ceil(s * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.35, color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, TAU); g.fill();
    return c;
  }

  function drawLauncher() {
    var s = SPR.pad.s, h = SPR.pad.h;
    ctx.drawImage(SPR.glow.c, LAUNCH.x - 52, LAUNCH.y - 46, 104, 104);
    ctx.drawImage(SPR.pad.c, LAUNCH.x - s / 2, LAUNCH.y - h * 0.66, s, h);
  }

  function drawHint() {
    if (state !== 'aim' || level !== 1 || score > 0) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(180,225,255,.72)';
    ctx.font = '900 13px "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
    ctx.fillText('드래그로 조준 · 손을 떼면 공 100개 연사!', W / 2, padY - 112);
    ctx.fillStyle = 'rgba(140,190,240,.45)';
    ctx.font = '800 11px "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
    ctx.fillText('벽돌이 아래 위험선에 닿으면 게임 오버', W / 2, padY - 92);
    ctx.restore();
  }

  function drawAim() {
    if (state !== 'aim') return;
    var ox = LAUNCH.x, oy = LAUNCH.y - 12;
    var pts = traceAim(ox, oy, aim.dx, aim.dy);
    var i;
    ctx.save();
    ctx.setLineDash([6, 7]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(150,240,255,.9)';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    var end = pts[pts.length - 1];
    ctx.strokeStyle = 'rgba(190,250,255,.95)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(end.x, end.y, 7, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,235,255,.45)';
    ctx.beginPath(); ctx.arc(end.x, end.y, 12, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    var sx = 0, sy = 0;
    if (shake > 0.2) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(SPR.bg, 0, 0, W, H);
    ctx.translate(sx, sy);
    drawDanger();
    drawBricks();
    drawBeams();
    drawRings();
    drawAim();
    drawBalls();
    drawParts();
    drawLauncher();
    drawHint();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ══════════════════ 배너 / 입력 / 루프 ══════════════════ */
  function banner(text, cls) {
    var el = $('banner');
    el.firstChild.textContent = text;
    el.className = cls ? cls + ' show' : 'show';
    if (banT) clearTimeout(banT);
    banT = setTimeout(function () { el.className = cls || ''; }, 1150);
  }

  var pointerId = null;

  function pointOf(e) {
    var t = e.touches && e.touches[0];
    if (t) return { x: t.clientX, y: t.clientY };
    if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onDown(e) {
    initAudio(); resumeAudio();
    if (state !== 'aim') return;
    var p = pointOf(e);
    pointerId = (e.pointerId == null ? 1 : e.pointerId);
    aim.on = true;
    setAimFrom(p.x, p.y);
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    if (!aim.on || state !== 'aim') return;
    var p = pointOf(e);
    setAimFrom(p.x, p.y);
    if (e.cancelable) e.preventDefault();
  }
  function onUp(e) {
    if (!aim.on) return;
    aim.on = false;
    if (state !== 'aim') return;
    var p = pointOf(e);
    if (p && typeof p.x === 'number') setAimFrom(p.x, p.y);
    fire();
    pointerId = null;
    if (e.cancelable) e.preventDefault();
  }

  if (window.PointerEvent) {
    cv.addEventListener('pointerdown', onDown, { passive: false });
    cv.addEventListener('pointermove', onMove, { passive: false });
    cv.addEventListener('pointerup', onUp, { passive: false });
    cv.addEventListener('pointercancel', onUp, { passive: false });
  } else {
    cv.addEventListener('touchstart', onDown, { passive: false });
    cv.addEventListener('touchmove', onMove, { passive: false });
    cv.addEventListener('touchend', onUp, { passive: false });
    cv.addEventListener('touchcancel', onUp, { passive: false });
    cv.addEventListener('mousedown', onDown, { passive: false });
    cv.addEventListener('mousemove', onMove, { passive: false });
    cv.addEventListener('mouseup', onUp, { passive: false });
  }
  /* 캔버스 밖에서 손을 떼도 발사되도록 */
  window.addEventListener('pointerup', function (e) { if (aim.on && state === 'aim') onUp(e); }, { passive: false });

  $('startBtn').addEventListener('click', function () {
    initAudio(); resumeAudio(); startGame();
  });
  $('againBtn').addEventListener('click', function () {
    if (window.ArcadeRank) { try { ArcadeRank.close(); } catch (e) { } }
    startGame();
  });
  $('rankBtn').addEventListener('click', function () {
    if (window.ArcadeRank) ArcadeRank.open({ id: 'brick-breaker-100' });
  });
  $('recall').addEventListener('click', function (e) {
    e.stopPropagation();
    recallNow();
  });
  $('mute').addEventListener('click', function () {
    muted = !muted;
    initAudio();
    if (master) master.gain.value = muted ? 0 : 0.55;
    this.textContent = muted ? '🔇' : '🔊';
    this.className = muted ? 'off' : 'on';
    this.setAttribute('aria-label', muted ? '소리 꺼짐' : '소리 켜짐');
    store('bb100-mute', muted ? '1' : '0');
  });

  var spBtns = document.querySelectorAll('#hud .sp');
  for (var si = 0; si < spBtns.length; si++) {
    spBtns[si].addEventListener('click', function () {
      setSpeed(Number(this.getAttribute('data-sp')));
    });
  }
  function setSpeed(v) {
    speedMul = v;
    for (var i = 0; i < spBtns.length; i++) {
      var b = spBtns[i];
      if (Number(b.getAttribute('data-sp')) === v) b.className = 'sp on';
      else b.className = 'sp';
    }
    store('bb100-speed', String(v));
  }

  /* ══════════════════ 도전장 ══════════════════ */
  function readChallenge() {
    var c = null;
    try { c = (window.ArcadeChallenge && ArcadeChallenge.get) ? ArcadeChallenge.get() : null; } catch (e) { }
    if (!c) {
      try {
        var u = new URLSearchParams(location.search);
        if (u.get('challenge')) c = { slug: u.get('challenge'), score: u.get('score'), by: u.get('by') };
      } catch (e2) { }
    }
    if (c && c.score != null && isFinite(Number(c.score)) && String(c.slug || '').indexOf('brick-breaker-100') >= 0) {
      chalTarget = Math.round(Number(c.score));
      if (chalTarget > 0) {
        chalHit = false;
        var tip = $('chalTip');
        tip.hidden = false; tip.className = '';
        tip.textContent = '⚔️ ' + (c.by ? c.by + '님' : '도전장') + ' 목표 ' + chalTarget.toLocaleString() + '점 깨기!';
      }
    }
  }
  function checkChallenge() {
    if (chalTarget && !chalHit && score > chalTarget) {
      chalHit = true;
      var tip = $('chalTip');
      tip.className = 'hit'; tip.hidden = false;
      tip.textContent = '🎉 도전장 달성! ' + score.toLocaleString() + '점 > ' + chalTarget.toLocaleString() + '점';
      banner('⚔️ 도전 성공!', 'gold');
      sfxLevel();
    }
  }
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || typeof d !== 'object' || d.arcade !== 'challenge') return;
    setTimeout(readChallenge, 0);
  });
  document.addEventListener('arcade-challenge-result', function () { readChallenge(); });

  /* ══════════════════ 루프 ══════════════════ */
  function frame(t) {
    requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0;
    update(dt);
    draw();
  }

  function boot() {
    best = Number(store('bb100-best') || 0) || 0;
    var savedSpeed = Number(store('bb100-speed') || 1);
    muted = store('bb100-mute') === '1';
    if (muted) { $('mute').textContent = '🔇'; $('mute').className = 'off'; }

    layout();
    buildWall();
    paintHud();
    setSpeed(savedSpeed === 2 || savedSpeed === 4 ? savedSpeed : 1);
    readChallenge();

    window.addEventListener('resize', function () { layout(); }, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(layout, 160); });
    document.addEventListener('visibilitychange', function () {
      lastT = 0;
      if (!document.hidden) resumeAudio();
    });
    requestAnimationFrame(frame);
  }

  /* ══════════════════ 테스트용 훅 ══════════════════ */
  window.__BB = {
    state: function () {
      return {
        state: state, score: score, level: level, bricks: bricksLeft,
        balls: balls.length, queued: fireQ, launched: launched,
        speed: speedMul, combo: combo, chalTarget: chalTarget, chalHit: chalHit,
        parts: parts.length, beams: beams.length, descend: descend.off,
        aim: { x: aim.dx, y: aim.dy }, over: !$('over').hidden
      };
    },
    start: startGame,
    fire: fire,
    recall: recallNow,
    setSpeed: setSpeed,
    aimAt: function (x, y) { setAimFrom(x, y); return { x: aim.dx, y: aim.dy }; },
    trace: function () { return traceAim(LAUNCH.x, LAUNCH.y - 12, aim.dx, aim.dy); },
    layout: function () {
      return { W: W, H: H, DPR: DPR, bw: bw, bh: bh, rowH: rowH, padY: padY, dangerY: dangerY, maxRows: MAXROWS, top: gridTop };
    },
    grid: function () { return grid.map(function (row) { return row.map(function (b) { return b ? b.hp : 0; }); }); },
    brickHit: function (c, r) { if (grid[r] && grid[r][c]) damage(c, r, null, 1); },
    types: function () {
      var out = [];
      for (var r = 0; r < grid.length; r++) for (var c = 0; c < COLS; c++) {
        var b = grid[r] && grid[r][c];
        if (b && b.hp > 0) out.push({ c: c, r: r, type: b.type, hp: b.hp });
      }
      return out;
    },
    killType: function (t) {
      for (var r = 0; r < grid.length; r++) for (var c = 0; c < COLS; c++) {
        var b = grid[r] && grid[r][c];
        if (b && b.hp > 0 && b.type === t) { damage(c, r, null, 99); return { c: c, r: r }; }
      }
      return null;
    },
    /* 테스트: 벽을 n줄 내려 게임오버까지 진행 */
    drop: function (n) {
      n = n || 1;
      for (var i = 0; i < n; i++) {
        if (lowestRow() >= MAXROWS - 1) { gameOver(); return false; }
        shiftDown();
      }
      hudDirty = true;
      return true;
    },
    lowestRow: lowestRow,
    gameOver: gameOver,
    canvas: cv
  };

  boot();
})();
</script>
</body>
</html>
