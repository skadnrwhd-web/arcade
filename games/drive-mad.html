    var kind = (e.clientX > viewW / 2) ? 'gas' : 'brake';
    ptrMap[e.pointerId] = kind;
    recount();
  }, false);
  app.addEventListener('pointerup', function (e) {
    if (ptrMap[e.pointerId]) { delete ptrMap[e.pointerId]; recount(); }
  }, false);
  app.addEventListener('pointercancel', function (e) {
    if (ptrMap[e.pointerId]) { delete ptrMap[e.pointerId]; recount(); }
  }, false);
  app.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

  var KEYMAP = { ArrowLeft: 'brake', a: 'brake', A: 'brake', ArrowRight: 'gas', d: 'gas', D: 'gas',
    ArrowUp: 'gas', w: 'gas', W: 'gas', ArrowDown: 'brake', s: 'brake', S: 'brake', ' ': 'gas', Spacebar: 'gas' };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { togglePause(); return; }
    var k = KEYMAP[e.key];
    if (!k) return;
    if (e.cancelable) e.preventDefault();
    initAudio(); resumeAudio(); startEngine();
    if (k === 'gas') keyGas = true; else keyBrake = true;
    recount();
  }, false);
  document.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.key];
    if (!k) return;
    if (e.cancelable) e.preventDefault();
    if (k === 'gas') keyGas = false; else keyBrake = false;
    recount();
  }, false);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);

  /* ══════════ 그리기 ══════════ */
  function wx(x) { return (x - cam.x) * PPM + viewW / 2; }
  function wy(y) { return (y - cam.y) * PPM + viewH * 0.56; }

  function pathBox(p) {
    var c = Math.cos(p.a), s = Math.sin(p.a);
    var cs = [[-p.hw, -p.hh], [p.hw, -p.hh], [p.hw, p.hh], [-p.hw, p.hh]];
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      var x = wx(p.cx + cs[i][0] * c - cs[i][1] * s);
      var y = wy(p.cy + cs[i][0] * s + cs[i][1] * c);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  function pieceColor(p) {
    if (p.t === 'crumble') return p.on ? '#ff5a6e' : '#ff4d6d';
    if (p.t === 'bounce') return '#ffd23f';
    if (p.t === 'bridge') return '#a78bfa';
    if (p.t === 'seesaw') return '#7dffb0';
    return '#37e0ff';
  }
  function drawSolids() {
    var i, p, col;
    for (i = 0; i < S.solids.length; i++) {
      p = S.solids[i];
      if (!p.alive) continue;
      var sx = wx(p.cx), sy = wy(p.cy);
      if (sx < -260 || sx > viewW + 260 || sy < -300 || sy > viewH + 300) continue;
      col = pieceColor(p);
      pathBox(p);
      ctx.fillStyle = (p.t === 'bridge') ? '#150e28' : (p.t === 'seesaw' ? '#0b1e18' : (p.t === 'bounce' ? '#241d06' : '#0a1322'));
      ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = col; ctx.globalAlpha = 0.16; ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1.7; ctx.strokeStyle = col; ctx.stroke();
      /* 윗면 하이라이트 */
      var c = Math.cos(p.a), s = Math.sin(p.a);
      ctx.beginPath();
      ctx.moveTo(wx(p.cx - p.hw * c + p.hh * s), wy(p.cy - p.hw * s - p.hh * c));
      ctx.lineTo(wx(p.cx + p.hw * c + p.hh * s), wy(p.cy + p.hw * s - p.hh * c));
      ctx.lineWidth = 2.6; ctx.strokeStyle = col; ctx.globalAlpha = 0.85; ctx.stroke();
      ctx.globalAlpha = 1;
      if (p.t === 'bounce') {
        ctx.beginPath();
        ctx.moveTo(wx(p.cx - p.hw * 0.7), wy(p.cy - p.hh));
        ctx.lineTo(wx(p.cx + p.hw * 0.7), wy(p.cy - p.hh));
        ctx.lineWidth = 3; ctx.strokeStyle = '#fff3b0'; ctx.stroke();
      }
      if (p.t === 'crumble' && p.on) {
        /* 금이 간 표시 */
        ctx.beginPath();
        ctx.moveTo(wx(p.cx - p.hw * 0.5), wy(p.cy - p.hh));
        ctx.lineTo(wx(p.cx - p.hw * 0.15), wy(p.cy + p.hh * 0.4));
        ctx.lineTo(wx(p.cx + p.hw * 0.2), wy(p.cy - p.hh * 0.4));
        ctx.lineTo(wx(p.cx + p.hw * 0.6), wy(p.cy + p.hh));
        ctx.strokeStyle = '#ffd0d8'; ctx.lineWidth = 1.4; ctx.stroke();
      }
    }
  }
  function drawRotor(h, tsec) {
    var len = h.hw * 2;
    var c = Math.cos(h.a), s = Math.sin(h.a);
    var x1 = wx(h.cx - h.hw * c), y1 = wy(h.cy - h.hw * s);
    var x2 = wx(h.cx + h.hw * c), y2 = wy(h.cy + h.hw * s);
    ctx.lineWidth = 9; ctx.strokeStyle = '#ff4d8d'; ctx.globalAlpha = 0.18;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = Math.max(4, h.hh * 2 * PPM);
    ctx.strokeStyle = '#ff5a7a'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.lineWidth = Math.max(1.4, h.hh * PPM * 0.5); ctx.strokeStyle = '#ffd9e2';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(wx(h.cx), wy(h.cy), Math.max(4, 0.16 * PPM), 0, Math.PI * 2);
    ctx.fillStyle = '#2a0f1c'; ctx.fill();
    ctx.strokeStyle = '#ff9ab0'; ctx.lineWidth = 2; ctx.stroke();
  }
  function drawFinish() {
    var gx = wx(S.finish), gy = wy(S.finishY), hgt = 4.4 * PPM;
    var cw = 0.44 * PPM;
    ctx.strokeStyle = '#7dffb0'; ctx.globalAlpha = 0.9; ctx.lineWidth = Math.max(2, 0.09 * PPM);
    ctx.beginPath();
    ctx.moveTo(gx - cw, gy); ctx.lineTo(gx - cw, gy - hgt);
    ctx.moveTo(gx + cw, gy); ctx.lineTo(gx + cw, gy - hgt);
    ctx.stroke();
    ctx.globalAlpha = 1;
    /* 체커 깃발 */
    var cols = 6, rows = 3, w = (cw * 2) / cols, h = hgt * 0.26 / rows;
    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        ctx.fillStyle = ((i + j) % 2) ? 'rgba(125,255,176,.9)' : 'rgba(8,20,14,.85)';
        ctx.fillRect(gx - cw + i * w, gy - hgt + j * h, w + 0.4, h + 0.4);
      }
    }
    ctx.strokeStyle = 'rgba(125,255,176,.55)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(gx - cw, gy - hgt, cw * 2, hgt * 0.26);
    ctx.fillStyle = 'rgba(160,255,200,.55)';
    ctx.fillRect(gx - cw * 0.5, gy - 2, cw, 2);
  }
  function drawCar() {
    var cs = Math.cos(car.a), sn = Math.sin(car.a);
    var px = wx(car.x), py = wy(car.y);
    var sc = PPM;
    /* 그림자 */
    var shY = wy(car.y + 1.5 + (car.onGround ? 0 : 0.5));
    ctx.save();
    ctx.globalAlpha = car.onGround ? 0.34 : 0.16;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(px, shY, 1.5 * sc, 0.22 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(car.a);
    /* 서스펜션 암 */
    var i, w;
    for (i = 0; i < 2; i++) {
      w = wheels[i];
      var wl = ANCHOR_Y + w.len;
      ctx.beginPath();
      ctx.moveTo(w.lx * sc, ANCHOR_Y * sc);
      ctx.lineTo(w.lx * sc, wl * sc);
      ctx.lineWidth = Math.max(2, 0.1 * sc); ctx.strokeStyle = '#2b4a6b'; ctx.stroke();
      ctx.lineWidth = Math.max(1, 0.045 * sc); ctx.strokeStyle = '#6fd8ff'; ctx.globalAlpha = 0.85;
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    /* 차체 */
    var bw = CAR_W * sc, bh = CAR_H * sc;
    ctx.beginPath();
    var r = 0.16 * sc;
    ctx.moveTo(-bw / 2 + r, -bh / 2);
    ctx.lineTo(bw / 2 - r, -bh / 2);
    ctx.quadraticCurveTo(bw / 2, -bh / 2, bw / 2, -bh / 2 + r);
    ctx.lineTo(bw / 2, bh / 2 - r);
    ctx.quadraticCurveTo(bw / 2, bh / 2, bw / 2 - r, bh / 2);
    ctx.lineTo(-bw / 2 + r, bh / 2);
    ctx.quadraticCurveTo(-bw / 2, bh / 2, -bw / 2, bh / 2 - r);
    ctx.lineTo(-bw / 2, -bh / 2 + r);
    ctx.quadraticCurveTo(-bw / 2, -bh / 2, -bw / 2 + r, -bh / 2);
    ctx.closePath();
    ctx.fillStyle = '#0d1a2e'; ctx.fill();
    ctx.lineWidth = Math.max(2, 0.055 * sc); ctx.strokeStyle = '#ff4d8d'; ctx.stroke();
    /* 캐빈 */
    ctx.beginPath();
    ctx.moveTo(-0.62 * sc, -bh / 2);
    ctx.lineTo(-0.44 * sc, -bh / 2 - 0.34 * sc);
    ctx.lineTo(0.34 * sc, -bh / 2 - 0.34 * sc);
    ctx.lineTo(0.56 * sc, -bh / 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(20,44,74,.95)'; ctx.fill();
    ctx.strokeStyle = '#7ceaff'; ctx.lineWidth = Math.max(1.4, 0.04 * sc); ctx.stroke();
    /* 창 */
    ctx.beginPath();
    ctx.moveTo(-0.5 * sc, -bh / 2 - 0.02 * sc);
    ctx.lineTo(-0.4 * sc, -bh / 2 - 0.26 * sc);
    ctx.lineTo(0.28 * sc, -bh / 2 - 0.26 * sc);
    ctx.lineTo(0.44 * sc, -bh / 2 - 0.02 * sc);
    ctx.closePath();
    ctx.fillStyle = 'rgba(55,224,255,.28)'; ctx.fill();
    /* 헤드라이트 */
    ctx.beginPath();
    ctx.arc(bw / 2 - 0.06 * sc, -0.06 * sc, 0.07 * sc, 0, Math.PI * 2);
    ctx.fillStyle = '#fff6cf'; ctx.fill();
    /* 언더글로우 */
    ctx.beginPath();
    ctx.moveTo(-bw / 2 + 0.1 * sc, bh / 2);
    ctx.lineTo(bw / 2 - 0.1 * sc, bh / 2);
    ctx.lineWidth = Math.max(1.4, 0.05 * sc); ctx.strokeStyle = 'rgba(55,224,255,.9)'; ctx.stroke();
    /* 배기 */
    if (inp.gas && state === 'play') {
      ctx.beginPath();
      ctx.arc(-bw / 2 - 0.02 * sc, 0.02 * sc, 0.06 * sc, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,140,60,' + (0.4 + Math.random() * 0.4) + ')'; ctx.fill();
    }
    ctx.restore();

    /* 바퀴 */
    for (i = 0; i < 2; i++) {
      w = wheels[i];
      var cx = wx(car.x + w.lx * cs - (ANCHOR_Y + w.len) * sn);
      var cy = wy(car.y + w.lx * sn + (ANCHOR_Y + w.len) * cs);
      var rr = WHEEL_R * sc;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.fillStyle = '#0a1020'; ctx.fill();
      ctx.lineWidth = Math.max(1.6, rr * 0.16); ctx.strokeStyle = '#37e0ff'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, rr * 0.86, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1, rr * 0.07); ctx.strokeStyle = 'rgba(55,224,255,.45)'; ctx.stroke();
      /* 트레드 */
      var n = 6, k;
      ctx.beginPath();
      for (k = 0; k < n; k++) {
        var ang = w.spin + k * Math.PI * 2 / n;
        ctx.moveTo(cx + Math.cos(ang) * rr * 0.55, cy + Math.sin(ang) * rr * 0.55);
        ctx.lineTo(cx + Math.cos(ang) * rr * 0.94, cy + Math.sin(ang) * rr * 0.94);
      }
      ctx.lineWidth = Math.max(1.4, rr * 0.13); ctx.strokeStyle = 'rgba(255,77,141,.85)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, rr * 0.24, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(160,240,255,.8)'; ctx.fill();
    }
  }
  function drawParts() {
    var i, p;
    if (parts.length) {
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        var a = Math.max(0, p.life / p.max);
        ctx.beginPath();
        ctx.arc(wx(p.x), wy(p.y), p.s * PPM * 0.09 * a + 0.8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.rgb + ',' + (a * 0.9).toFixed(3) + ')';
        ctx.fill();
      }
    }
    if (sparks.length) {
      ctx.strokeStyle = 'rgba(255,220,140,.9)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (i = 0; i < sparks.length; i++) {
        p = sparks[i];
        var a2 = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a2;
        ctx.beginPath();
        ctx.moveTo(wx(p.x), wy(p.y));
        ctx.lineTo(wx(p.x - p.vx * 0.012), wy(p.y - p.vy * 0.012));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawParallax() {
    var off = -cam.x * PPM * 0.12;
    var baseY = viewH * 0.56 - cam.y * PPM * 0.12;
    var i, x;
    ctx.beginPath();
    ctx.moveTo(-10, viewH + 10);
    for (i = 0; i <= 8; i++) {
      x = i * (viewW / 7) + (off % (viewW / 7));
      ctx.lineTo(x, baseY - 40 - (i % 3) * 26);
      ctx.lineTo(x + viewW / 14, baseY - 10);
    }
    ctx.lineTo(viewW + 10, viewH + 10);
    ctx.closePath();
    ctx.fillStyle = 'rgba(12,24,44,.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(55,224,255,.16)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function drawFrame() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (bgCan) ctx.drawImage(bgCan, 0, 0, viewW, viewH);
    else { ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, viewW, viewH); }
    if (!S) return;
    ctx.save();
    var sk = shake > 0 ? shake : 0;
    if (sk) ctx.translate(rnd(-sk, sk) * 0.4, rnd(-sk, sk) * 0.4);
    drawParallax();
    drawSolids();
    drawFinish();
    var i;
    for (i = 0; i < S.haz.length; i++) drawRotor(S.haz[i], 0);
    drawCar();
    drawParts();
    ctx.restore();
    if (vigCan) ctx.drawImage(vigCan, 0, 0, viewW, viewH);
    if (state === 'crash') {
      ctx.fillStyle = 'rgba(255,60,90,' + (0.24 * Math.max(0, 1 - crashT / RESPAWN_T)).toFixed(3) + ')';
      ctx.fillRect(0, 0, viewW, viewH);
    }
  }

  /* ══════════ 업데이트 ══════════ */
  function updateKinematic(dt, tsec) {
    var i, p;
    for (i = 0; i < S.solids.length; i++) {
      p = S.solids[i];
      if (p.t === 'bridge') {
        var off = p.amp * Math.sin(tsec * p.freq + p.i * 0.75);
        var prev = p.cy;
        p.cy = p.baseCy + off;
        p.svy = (p.cy - prev) / Math.max(dt, 0.0001);
        p.a = p.baseA + Math.cos(tsec * p.freq + p.i * 0.75) * 0.02;
        p.svx = 0;
      } else if (p.t === 'seesaw') {
        if (Math.abs(car.x - p.px) < p.hw + 1.6) {
          var tgt = clamp((car.x - p.px) * 0.075, -p.lim, p.lim);
          p.tv += (tgt - p.th) * 9 * dt;
          p.tv *= (1 - 3.4 * dt);
          p.th += p.tv * dt;
          p.th = clamp(p.th, -p.lim, p.lim);
        } else {
          p.tv += (0 - p.th) * 5 * dt;
          p.tv *= (1 - 3.4 * dt);
          p.th += p.tv * dt;
        }
        p.a = p.th;
        p.cy = p.py - Math.sin(p.th) * 0 - 0;
        p.svy = 0;
      } else if (p.t === 'crumble' && p.on && p.alive) {
        p.timer += dt;
        if (p.timer >= p.fuse) {
          p.alive = false;
          burst(p.cx, p.cy - p.hh, 8, '255,120,150', 0.8);
          sfx('crack');
        }
      } else if (p.t === 'bounce' && p.cool > 0) {
        p.cool -= dt;
      }
    }
    for (i = 0; i < S.haz.length; i++) {
      var h = S.haz[i];
      h.a += h.spd * dt;
      var om = h.spd, cx = Math.cos(h.a), sn2 = Math.sin(h.a);
      h.svx = -om * (h.hw) * sn2 * 0;
      h.svy = 0;
    }
  }
  function updateTimers(dt) {
    tsec += dt;
    updateParts(dt);
    updateKinematic(dt, tsec);
    if (shake > 0) { shake -= dt * 42; if (shake < 0) shake = 0; }
    if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.add('off'); }
    if (bT > 0) { bT -= dt; if (bT <= 0) banner(null); }
    if (state === 'play') {
      stageTime += dt;
      if (car.x > S.finish) stageClear();
      paintProgress(false);
    } else if (state === 'crash') {
      crashT += dt;
      if (crashT >= RESPAWN_T) respawn();
    } else if (state === 'clear') {
      clearT += dt;
      if (clearT >= 1.35) {
        if (stageN >= NST) finishRun(true);
        else { loadStage(stageN + 1); state = 'play'; }
      }
    }
  }

  function updateCam(dt) {
    if (!S) return;
    var look = clamp(car.vx * 0.2, -2.4, 3.4);
    var tx = car.x + look, ty = car.y - 0.85;
    var halfW = viewW / PPM / 2, halfH = viewH / PPM / 2;
    var lox = S.x0 + halfW * 0.72, hix = S.x1 - halfW * 0.72;
    if (lox < hix) tx = clamp(tx, lox, hix);
    var loy = S.yTop - halfH * 0.34, hiy = S.yBot + halfH * 0.5;
    if (loy < hiy) ty = clamp(ty, loy, hiy);
    var k = Math.min(1, dt * 7.5);
    cam.x += (tx - cam.x) * k;
    cam.y += (ty - cam.y) * Math.min(1, dt * 6);
  }

  /* ══════════ 루프 ══════════ */
  var lastT = 0, acc = 0, STEP = 1 / 120, tsec = 0, fps = 0, fpsN = 0, fpsAcc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    fpsN++; fpsAcc += dt;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsN = 0; fpsAcc = 0; if (fpsEl) fpsEl.textContent = fps + ' fps'; }
    if (!paused && state !== 'title' && state !== 'done') {
      if (state === 'play') {
        acc += dt;
        var guard = 0;
        while (acc >= STEP && guard < 8) {
          physStep(STEP); acc -= STEP; guard++;
          if (state !== 'play') break;
        }
      } else { acc = 0; }
      updateTimers(dt);
      updateCam(dt);
    }
    if (state !== 'title' && state !== 'done') updateEngine();
    drawFrame();
  }

  /* ══════════ UI 바인딩 ══════════ */
  var fpsEl = null;
  if (DEBUG) { fpsEl = document.createElement('div'); fpsEl.id = 'fps'; fpsEl.textContent = ''; app.appendChild(fpsEl); }

  $('startBtn').addEventListener('click', function () { startRun(); }, false);
  $('againBtn').addEventListener('click', function () { startRun(); }, false);
  $('pauseBtn').addEventListener('click', function () { togglePause(); }, false);
  $('resumeBtn').addEventListener('click', function () { togglePause(); }, false);
  $('retryBtn').addEventListener('click', function () {
    paused = false; hideOverlays(); state = 'play'; loadStage(stageN); paintScore();
  }, false);
  $('quitBtn').addEventListener('click', function () { paused = false; hideOverlays(); finishRun(false); }, false);
  $('ovHome').addEventListener('click', function () { location.href = '../index.html'; }, false);
  $('mute').addEventListener('click', function () {
    muted = !muted; store('arc-sound', muted ? '0' : '1');
    paintMute(); if (!muted) sfx('ui');
  }, false);
  function openRank() { initAudio(); resumeAudio(); if (window.ArcadeRank) { try { ArcadeRank.open({ id: 'drive-mad' }); } catch (e) { } } }
  $('tRank').addEventListener('click', openRank, false);
  $('ovRank').addEventListener('click', openRank, false);
  $('langBtn').addEventListener('click', function () {
    EN = !EN;
    try { store('arc-lang', EN ? 'en' : 'ko'); } catch (e) { }
    applyLang();
    if (S) showHint(S.hint ? S.hint[EN ? 1 : 0] : '');
    sfx('ui');
  }, false);
  $('langBtn').addEventListener('pointerdown', function (e) { e.stopPropagation(); }, false);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && (state === 'play' || state === 'crash' || state === 'clear') && !paused) {
      paused = true; $('pause').hidden = false;
      inp.gas = false; inp.brake = false; ptrMap = {}; paintPads();
    }
  }, false);

  function applyLang() {
    var els = document.querySelectorAll('[data-t]'), i, el, k, v;
    for (i = 0; i < els.length; i++) {
      el = els[i]; k = el.getAttribute('data-t');
      v = TXT[k];
      if (!v) continue;
      /* data-t="ovStage" 처럼 안에 <b> 가 있는 경우는 라벨만 교체 */
      if (el.querySelector('b')) {
        for (var c = 0; c < el.childNodes.length; c++) {
          if (el.childNodes[c].nodeType === 3 && el.childNodes[c].nodeValue.trim()) el.childNodes[c].nodeValue = v[EN ? 1 : 0];
        }
      } else el.textContent = v[EN ? 1 : 0];
    }
    $('pBrakeT').textContent = t('brake');
    $('pGasT').textContent = t('gas');
    $('startBtn').textContent = t('start');
    $('tRank').textContent = t('rank');
    $('resumeBtn').textContent = t('resume');
    $('retryBtn').textContent = t('retry');
    $('quitBtn').textContent = t('quit');
    $('againBtn').textContent = t('again');
    $('ovHome').textContent = t('home');
    $('keyHelp').textContent = t('keyHelp');
    $('langBtn').textContent = EN ? 'KO' : 'EN';
    document.documentElement.lang = EN ? 'en' : 'ko';
    document.title = EN ? 'Neon Drive Mad - Monster Truck Physics Racer (18 stages) | UJ ARCADE'
      : '네온 드라이브 매드 - 몬스터트럭 물리 레이싱 18단계 | UJ ARCADE';
    lastScore = -1; lastChip = ''; lastStars = '';
    paintScore(); paintChips(); paintBest(); paintChal();
  }

  /* ══════════ 확인용 훅 ══════════ */
  function __trace(sec, hz) {
    var out = [], step = 1 / (hz || 8), acc2 = 0, t = 0;
    while (t < sec && state === 'play') {
      inp.gas = true; inp.brake = false;
      physStep(STEP); updateTimers(STEP); t += STEP;
      acc2 += STEP;
      if (acc2 >= step) {
        acc2 = 0;
        out.push({ t: +t.toFixed(2), x: +car.x.toFixed(2), y: +car.y.toFixed(2), a: +car.a.toFixed(2),
          vx: +car.vx.toFixed(1), vy: +car.vy.toFixed(1), g: car.onGround });
      }
    }
    inp.gas = false;
    return { rows: out, state: state, crash: lastCrashInfo };
  }

  window.__DM = {
    get state() { return state; },
    get stage() { return stageN; },
    get score() { return Math.round(score); },
    get crashes() { return crashes; },
    get stageCrashes() { return stageCrashes; },
    get lastCrash() { return lastCrashInfo; },
    get stars() { return totalStars; },
    get fps() { return fps; },
    get errors() { return ERR.slice(); },
    get paused() { return paused; },
    get car() { return { x: +car.x.toFixed(2), y: +car.y.toFixed(2), a: +car.a.toFixed(3), vx: +car.vx.toFixed(2), vy: +car.vy.toFixed(2), av: +car.av.toFixed(2), onGround: car.onGround, speed: +Math.sqrt(car.vx * car.vx + car.vy * car.vy).toFixed(2) }; },
    get wheels() { return wheels.map(function (w) { return { on: w.on, len: +w.len.toFixed(3), dist: +(w.dist || 0).toFixed(3), comp: +(w.comp || 0).toFixed(3), fUp: +(w.fUp || 0).toFixed(1), vdown: +(w.vdown || 0).toFixed(2), n: [+(w.nx || 0).toFixed(2), +(w.ny || 0).toFixed(2)] }; }); },
    get view() { return { W: viewW, H: viewH, ppm: +PPM.toFixed(2), dpr: DPR, cam: { x: +cam.x.toFixed(2), y: +cam.y.toFixed(2) } }; },
    get stageCount() { return NST; },
    get finishX() { return S ? S.finish : 0; },
    get progress() { return S ? +((car.x - S.spawn[0]) / (S.finish - S.spawn[0])).toFixed(3) : 0; },
    stageInfo: function (n) {
      var o = buildFresh(clamp(n, 1, NST));
      return { n: o.n, ko: o.ko, en: o.en, finish: o.finish, pieces: o.solids.length, haz: o.haz.length,
        yTop: +o.yTop.toFixed(2), yBot: +o.yBot.toFixed(2), spawn: o.spawn };
    },
    press: function (k, on) { if (k === 'gas') inp.gas = !!on; else if (k === 'brake') inp.brake = !!on; paintPads(); },
    go: function (n) {
      if (!DEBUG) return false;
      paused = false; hideOverlays(); state = 'play'; loadStage(clamp(n, 1, NST));
      return true;
    },
    step: function (dt) {
      if (!DEBUG) return false;
      var left = dt, guard = 0;
      while (left > 0.0001 && guard++ < 4000) {
        var s = Math.min(STEP, left);
        physStep(s); updateTimers(s); left -= s;
        if (state !== 'play') break;
      }
      updateCam(0.016);
      return true;
    },
    drive: function (seconds, opt) {
      /* 무인 주행(검증용): 초당 물리 스텝을 돌리고 결과를 돌려준다 */
      if (!DEBUG) return null;
      opt = opt || {};
      var maxT = seconds || 40, t = 0, crashAt = -1, lastX = car.x, stuckT = 0, commit = 0, brakeMode = false, blockPrev = false;
      while (t < maxT && state === 'play') {
        var g = 1, b = 0;
        if (!car.onGround) {
          if (car.a < -0.12) { g = 0; b = 1; }
          else if (car.a > 0.2) { g = 1; b = 0; }
          else { g = car.vx < 8 ? 1 : 0; b = 0; }
        } else {
          if (opt.careful) { /* 로터 대기 */ }
        }
        /* 회전 막대가 앞을 막고 있으면 기다린다 */
        var near = null, gap = 1e9, i;
        for (i = 0; i < S.haz.length; i++) {
          var h = S.haz[i], dd = h.cx - car.x;
          if (dd > -2 && dd < 26 && dd < gap) { gap = dd; near = h; }
        }
        if (near) {
          var blocking = (near.cy + Math.abs(Math.sin(near.a)) * near.hw) > -2.4;
          var safe = true, k, aa;
          for (k = 1; k <= 7; k++) {
            aa = near.a + near.spd * 0.16 * k;
            if (near.cy + Math.abs(Math.sin(aa)) * near.hw > -2.4) { safe = false; break; }
          }
          if (!blocking && safe && Math.abs(car.vx) < 3.5 && gap < 12) commit = 2.0;
          blockPrev = blocking;
          var tooFast = (gap < 20) && (car.vx > (gap < 6.5 ? 1.2 : 5.5));
          if (commit <= 0 && (blocking || tooFast)) { g = 0; b = (car.vx > 0.8) ? 1 : 0; }
        } else { blockPrev = false; }
        if (commit > 0) { commit -= STEP; g = 1; b = 0; }
        if (commit > 0 && near && gap < 9 && (near.cy + Math.abs(Math.sin(near.a)) * near.hw) > -2.4) { commit = 0; g = 0; b = (car.vx > 0.8) ? 1 : 0; }
        inp.gas = g > 0; inp.brake = b > 0;
        physStep(STEP); updateTimers(STEP);
        t += STEP;
        if (Math.abs(car.x - lastX) < 0.02) stuckT += STEP; else stuckT = 0;
        lastX = car.x;
        if (stuckT > 3.5) break;
      }
      inp.gas = false; inp.brake = false;
      return { state: state, t: +t.toFixed(2), x: +car.x.toFixed(2), y: +car.y.toFixed(2), stage: stageN,
        score: Math.round(score), crashes: crashes, stuck: +stuckT.toFixed(2), finish: S.finish };
    },
    trace: function (sec, hz) { return __trace(sec, hz); },
    setPaused: function (v) { paused = !!v; },
    reset: function () { score = 0; crashes = 0; totalStars = 0; startRun(); return true; }
  };

  /* ══════════ 시작 ══════════ */
  var FM = null;
  try {
    var fm = /[?&]frame=(\d{3,4})x(\d{3,4})/.exec(location.search);
    if (fm) {
      FM = { w: +fm[1], h: +fm[2] };
      document.body.className = 'framed';
      app.style.width = FM.w + 'px'; app.style.height = FM.h + 'px';
    }
  } catch (e) { }

  resize();
  window.addEventListener('resize', function () { resize(); }, false);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); }, false);

  paintMute();
  applyLang();
  S = buildFresh(1);
  car.x = S.spawn[0]; car.y = S.spawn[1] - 1.246;
  cam.x = car.x; cam.y = car.y - 0.9;
  state = 'title';
  paintChips(); paintProgress(true); paintChal();
  requestAnimationFrame(frame);
})();
</script>
<script src="home.js"></script>
</body>
</html>
