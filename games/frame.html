<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>size frame</title>
<style>
  html,body{margin:0;height:100%;background:#000}
  #f{position:fixed;left:0;top:0;border:0;display:block}
</style>
</head>
<body>
<iframe id="f" allow="autoplay"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '390', 10);
  var h = parseInt(q.get('h') || '700', 10);
  var f = document.getElementById('f');
  f.width = w; f.height = h;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = 'slither-neon.html' + (q.get('t') ? '?t=' + q.get('t') : '');
</script>
</body>
</html>
