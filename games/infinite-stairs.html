<style>

  /* ── 배너·토스트 ── */
  #banner{position:fixed;left:0;right:0;top:34%;z-index:15;text-align:center;pointer-events:none;

  @keyframes bnr{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.06)}

  #toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 160px);z-index:16;

  #toast.on{opacity:1}
  #toast i{font-style:normal;background:rgba(10,16,34,.86);border:1px solid rgba(120,200,255,.4);
    border-radius:99px;padding:8px 15px}

<body>
<canvas id="stage" aria-label="네온 무한의 계단 게임 화면"></canvas>

<div id="hud">
  <div class="fl">
    <span class="lab">층수</span>
    <b id="floor">0</b>
    <span class="best" id="best">최고 0층</span>
  </div>
  <div class="hpbox">
    <div class="hprow"><span>체력</span><i id="hppct">100%</i></div>
    <div class="bar" id="hpbar"><i id="hpfill"></i></div>
    <span id="zone">네온 지하철역</span>
  </div>
  <button id="mute" type="button" aria-label="소리 끄기">🔊</button>
</div>

<div id="chalTip" hidden></div>

<div id="ctrls" class="dim">
  <button class="pad turn" id="btnTurn" type="button" aria-label="방향전환"><span class="ico" id="icoTurn">↖</span><span class="lb">방향전환</span></button>
  <button class="pad up" id="btnUp" type="button" aria-label="오르기"><span class="ico" id="icoUp">↗</span><span class="lb">오르기</span></button>
</div>

<div class="ov" id="title">
  <div class="card">
    <p class="logo">🪜 네온 무한의 계단</p>
    <p class="sub">다음 계단이 보이는 쪽 버튼을 누르면 한 층씩 올라갑니다.<br>체력이 0이 되면 추락!</p>
    <div class="skins" id="skinRow"></div>
    <button class="go" id="goBtn" type="button">시작하기</button>
    <div class="keyrow"><span>Space · ↑ · → 오르기</span><span>← · Shift · Z 방향전환</span></div>
    <button class="line" id="rankBtn" type="button">🏆 랭킹 보기</button>
    <p class="hint" style="margin-top:10px">오르기 = 지금 바라보는 방향으로 1층 · 방향전환 = 좌우를 바꾸며 1층</p>
  </div>
</div>

<div class="ov" id="over" hidden>
  <div class="card">
    <h2 id="ovT">추락!</h2>
    <p id="ovR">허공을 밟았습니다</p>
    <div class="big"><b id="ovFloor">0</b><span>층</span></div>
    <p class="best" id="ovBest">최고 기록 0층</p>
    <button class="go" id="againBtn" type="button">다시 오르기</button>
    <button class="line" id="ovRank" type="button">🏆 랭킹 보기</button>
  </div>
</div>

<div id="banner"></div>
<div id="toast"></div>

<script src="../rank.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ══════════ 기본 설정 ══════════ */
  var SKINS = [
    { id: 'runner', name: '네온 러너', c1: '#35e7ff', c2: '#0e3b63', eye: '#ffffff', ac: '#bfefff', kind: 'runner' },
    { id: 'cat',    name: '네온 캣',  c1: '#ff5bd6', c2: '#5c1146', eye: '#fff3c4', ac: '#ffd1f2', kind: 'cat' },
    { id: 'bot',    name: '골드 봇',  c1: '#ffd23f', c2: '#6a4704', eye: '#241800', ac: '#fff0b3', kind: 'bot' },
    { id: 'alien',  name: '라임 에일리언', c1: '#b6ff3b', c2: '#33570a', eye: '#0d1a00', ac: '#e6ffb8', kind: 'alien' }
  ];
  var ZONE_NAMES = ['네온 지하철역', '도심 야경', '별빛 구름', '우주 성층권'];
  var ZONE_BOUNDS = [50, 150, 300];
  var RUNG_STEP = 0.085;          /* 한 칸 오르는 애니메이션 길이(초) */
  var FALL_TIME = 1.0;            /* 추락 연출 길이(초) */
  var COOL = 260;                 /* 피버 판정: 연속 입력 간격(ms) */

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { }
    return null;
  }
  function num(v) { var n = parseInt(v, 10); return isFinite(n) ? n : 0; }

  /* ══════════ 캔버스 / 레이아웃 ══════════ */
  var cv = $('stage'), ctx = cv.getContext('2d', { alpha: false });
  var W = 360, H = 640, DPR = 1;
  var L = { hud: 92, padH: 134, playTop: 96, playBottom: 500, playH: 400, charY: 330, stepH: 100, colW: 62, rungW: 108 };

  function colX(c) { return W / 2 + (c || 0) * L.colW; }

  function resize() {
    W = Math.max(280, Math.round(window.innerWidth || 360));
    H = Math.max(420, Math.round(window.innerHeight || 640));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var hudH = $('hud') ? $('hud').getBoundingClientRect().height : 92;
    var ctlH = $('ctrls') ? $('ctrls').getBoundingClientRect().height : 134;
    L.hud = Math.round(hudH);
    L.padH = Math.round(ctlH);
    L.playTop = L.hud + 10;
    L.playBottom = H - L.padH - 6;
    L.playH = Math.max(180, L.playBottom - L.playTop);
    L.charY = Math.round(L.playTop + L.playH * 0.62);
    L.stepH = Math.max(72, Math.min(128, L.playH * 0.225));
    L.colW = Math.round(Math.min(W * 0.168, 74));
    L.rungW = Math.round(Math.min(W * 0.3, 124));
    buildBG(); buildSprites();
  }

  /* ══════════ 배경 (존별로 미리 그려 둔 타일) ══════════ */
  var bgTiles = [], bgHs = [];
  function newTile(h) {
    var c = document.createElement('canvas');
    c.width = Math.round(W); c.height = Math.round(h);
    var g = c.getContext('2d');
    return { c: c, g: g, h: h };
  }
  function rnd(seed) { /* 고정 난수: 매번 같은 그림 */ var s = seed % 2147483647; if (s <= 0) s += 2147483646; return function () { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; }; }
  function vgrad(g, top, bot) { var gr = g.createLinearGradient(0, 0, 0, H * 1.4); gr.addColorStop(0, top); gr.addColorStop(1, bot); return gr; }

  function buildBG() {
    bgTiles = []; bgHs = [];
    var th = Math.round(H * 1.45);

    /* 1) 네온 지하철역 */
    (function () {
      var t = newTile(th), g = t.g;
      g.fillStyle = vgrad(g, '#0a1024', '#131c3c'); g.fillRect(0, 0, W, th);
      var r = rnd(11), y, x;
      g.strokeStyle = 'rgba(120,170,255,.10)'; g.lineWidth = 1;
      for (y = 0; y < th; y += 46) {
        g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke();
        for (x = (y / 46) % 2 ? 0 : 28; x < W; x += 56) { g.beginPath(); g.moveTo(x + .5, y); g.lineTo(x + .5, y + 46); g.stroke(); }
      }
      for (var i = 0; i < 7; i++) {   /* 네온 형광등 */
        var yy = r() * th, ww = W * (0.3 + r() * 0.45), xx = W * r() * 0.5;
        g.fillStyle = i % 3 === 0 ? 'rgba(255,91,214,.16)' : 'rgba(61,220,255,.15)';
        g.fillRect(xx, yy, ww, 3);
        g.fillStyle = i % 3 === 0 ? 'rgba(255,91,214,.07)' : 'rgba(61,220,255,.06)';
        g.fillRect(xx - 6, yy - 7, ww + 12, 17);
      }
      for (var j = 0; j < 4; j++) {   /* 역 표지판 */
        var sy = th * (0.12 + j * 0.24), sw = 96, sx = W * 0.5 - sw / 2;
        g.fillStyle = 'rgba(20,40,80,.75)'; g.fillRect(sx, sy, sw, 26);
        g.strokeStyle = 'rgba(90,200,255,.35)'; g.lineWidth = 1.5; g.strokeRect(sx + .5, sy + .5, sw - 1, 25);
        g.fillStyle = 'rgba(160,220,255,.35)'; g.fillRect(sx + 12, sy + 11, sw - 24, 4);
      }
      bgTiles.push(t.c); bgHs.push(th);
    })();

    /* 2) 도심 야경 */
    (function () {
      var t = newTile(th), g = t.g;
      g.fillStyle = vgrad(g, '#060812', '#1a1038'); g.fillRect(0, 0, W, th);
      var r = rnd(23);
      g.fillStyle = 'rgba(255,255,255,.28)';
      for (var i = 0; i < 26; i++) { var sx = r() * W, sy = r() * th * .55; g.fillRect(sx, sy, 1.6, 1.6); }
      /* 달 */
      var mx = W * 0.74, my = th * 0.1;
      var mg = g.createRadialGradient(mx, my, 2, mx, my, 62);
      mg.addColorStop(0, 'rgba(220,235,255,.55)'); mg.addColorStop(.28, 'rgba(180,205,255,.16)'); mg.addColorStop(1, 'rgba(150,180,255,0)');
      g.fillStyle = mg; g.beginPath(); g.arc(mx, my, 62, 0, 6.2832); g.fill();
      g.fillStyle = 'rgba(232,242,255,.92)'; g.beginPath(); g.arc(mx, my, 15, 0, 6.2832); g.fill();
      /* 스카이라인: 타일 아래쪽에 두 겹 */
      function sky(baseY, hMax, alpha, col) {
        g.fillStyle = col;
        var x = -10;
        while (x < W + 20) {
          var bw = 18 + r() * 34, bh = 26 + r() * hMax;
          g.globalAlpha = alpha; g.fillRect(x, baseY - bh, bw, bh + 8);
          if (alpha > .8) {   /* 창문 불빛 */
            g.globalAlpha = 1;
            for (var wy = baseY - bh + 7; wy < baseY - 6; wy += 11) {
              for (var wx = x + 5; wx < x + bw - 6; wx += 9) {
                if (r() < .45) { g.fillStyle = r() < .25 ? 'rgba(255,210,63,.5)' : 'rgba(120,200,255,.34)'; g.fillRect(wx, wy, 3.2, 4.2); g.fillStyle = col; }
              }
            }
          }
          x += bw + 4 + r() * 8;
        }
        g.globalAlpha = 1;
      }
      sky(th * 0.52, 90, 0.55, '#0a0d20');
      sky(th * 0.66, 130, 0.95, '#0d1226');
      sky(th * 1.02, 120, 0.95, '#0d1226');
      bgTiles.push(t.c); bgHs.push(th);
    })();

    /* 3) 별빛 구름 */
    (function () {
      var t = newTile(th), g = t.g;
      g.fillStyle = vgrad(g, '#0a1030', '#2b1f5f'); g.fillRect(0, 0, W, th);
      var r = rnd(37);

  function sfxMile() { tone(660, 0.12, 'sine', 0.06); setTimeout(function () { tone(990, 0.18, 'sine', 0.06); }, 110); }
  function sfxFall() { tone(420, 0.55, 'sawtooth', 0.075, 55); setTimeout(function () { tone(120, 0.32, 'triangle', 0.05, 40); }, 90); }
  function sfxStart() { tone(440, 0.09, 'sine', 0.05); setTimeout(function () { tone(660, 0.13, 'sine', 0.05); }, 90); }

  /* ══════════ 업데이트 ══════════ */
  function update(dt) {
    tmNow += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 42);
    updParts(dt);

    if (state === 'play') {
      var drain = 6.5 + Math.min(20, floorN * 0.042);
      hp -= drain * dt;
      if (feverT > 0) { feverT = Math.max(0, feverT - dt); if (feverT === 0) fever = 0; }
      if (hp <= 0) { hp = 0; startFall('time', null); }
      if (anim) {
        anim.t += dt / RUNG_STEP;
        if (anim.t >= 1) { anim.t = 1; }
        visL = anim.from + (cur.L - anim.from) * ease(anim.t);
        if (anim.t >= 1) { anim = null; visL = cur.L; }
      } else visL = cur.L;
      bgScroll = (floorN + (visL - cur.L)) * L.stepH;
      paintHud();
    } else if (state === 'fall') {
      fall.t += dt;
      fall.vy += 1900 * dt;
      fall.y += fall.vy * dt;
      fall.rot += fall.vrot * dt;
      if (fall.t > FALL_TIME) { fall = null; gameOver(); }
    } else if (state === 'title') {
      bgScroll += dt * 26;
    } else if (state === 'over') {
      bgScroll += dt * 4;
    }
  }
  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  /* ══════════ 그리기 ══════════ */
  function drawTile(idx, alpha, offset) {
    var t = bgTiles[idx], h = bgHs[idx];
    if (!t) return;
    ctx.globalAlpha = alpha;
    var y = -(offset % h);
    ctx.drawImage(t, 0, Math.round(y), W, h);
    ctx.drawImage(t, 0, Math.round(y + h), W, h);
    ctx.globalAlpha = 1;
  }

  function drawBG() {
    var zf = state === 'title' ? 0 : floorN;
    var zb = zoneBlend(zf);
    var off = bgScroll * 0.42;
    if (zb.b < 0) drawTile(zb.a, 1, off);
    else { drawTile(zb.a, 1, off); drawTile(zb.b, zb.t, off); }
  }

  function drawRungs() {
    var first = Math.max(0, Math.floor(visL) - 3);
    var last = Math.ceil(visL + L.playH / L.stepH) + 2;
    genTo(last + 1);
    var z = zoneOf(state === 'title' ? 0 : floorN);
    var pulse = 0.5 + 0.5 * Math.sin(tmNow * 3.4);
    for (var i = first; i <= last; i++) {
      var rc = rungArr[i];
      if (rc === undefined) continue;
      var y = L.charY - (i - visL) * L.stepH;
      if (y < L.playTop - 60 || y > H - L.padH + 30) continue;
      var isNext = (state === 'play' && i === cur.L + 1);
      if (rc === 0) {
        drawRung(W / 2, y, L.colW * 2 + L.rungW * 0.75, 14, '#ffd23f', '#ffffff', isNext ? pulse : 0);
      } else {
        drawRung(colX(rc), y, L.rungW, 13, isNext ? RUNG_AC[z] : RUNG_COL[z], isNext ? '#ffffff' : RUNG_AC[z], isNext ? pulse : 0);
      }
      if (i === 0) {   /* 시작 발판 */
        drawRung(W / 2, y, L.colW * 2 + L.rungW * 0.9, 16, '#7dffd1', '#ffffff', 0);
      }
    }
  }

  function drawScene() {
    var sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - .5) * shake; sy = (Math.random() - .5) * shake; }

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#07091a';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(sx, sy);

    drawBG();

    /* 계단 */
    if (state !== 'title') drawRungs();
    else {
      /* 타이틀: 발판 하나만 */
      drawRung(W / 2, L.charY + 2, L.colW * 2 + L.rungW * 0.9, 16, '#7dffd1', '#ffffff', 0.4);
    }

    /* 캐릭터 */
    var sk = curSkin();
    var cx, cy = L.charY;
    if (state === 'fall' && fall) { cx = fall.x; drawChar(ctx, cx, cy, 1, sk, facing, tmNow, fall); }
    else if (state === 'play' && anim) {
      cx = colX(anim.fromCol) + (colX(cur.col) - colX(anim.fromCol)) * ease(anim.t);
      drawChar(ctx, cx, cy, 1, sk, facing, tmNow, null);
    } else {
      cx = colX(cur.col);
      drawChar(ctx, cx, cy, 1, sk, facing, tmNow, null);
    }

    /* 캐릭터 뒤 광원 */
    var gs = glowSpr[sk.id === 'cat' ? 'pink' : sk.id === 'bot' ? 'gold' : sk.id === 'alien' ? 'mint' : 'cyan'];
    ctx.globalAlpha = 0.55;
    ctx.drawImage(gs, cx - 52, cy - 84, 104, 104);
    ctx.globalAlpha = 1;

    /* 파티클 */
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    /* 피버 연출 */
    if (feverT > 0) {
      ctx.globalAlpha = 0.10 + 0.05 * Math.sin(tmNow * 22);
      var fg = zoneGlow(1);
      ctx.drawImage(fg, cx - 90, cy - 110, 180, 180);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    /* 비네트 */
    if (vignette) { ctx.globalAlpha = 1; ctx.drawImage(vignette, 0, 0, W, H); }

    /* 추락 시 붉은 경고 */
    if (state === 'fall' && fall) {
      ctx.globalAlpha = Math.min(0.28, fall.t * 0.4);
      ctx.fillStyle = '#ff2d55';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  /* ══════════ 루프 ══════════ */
  var lastT = 0, raf = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    drawScene();
  }

  /* ══════════ 스킨 선택 UI ══════════ */
  function buildSkinRow() {
    var row = $('skinRow'); if (!row) return;
    row.textContent = '';
    for (var i = 0; i < SKINS.length; i++) (function (i) {
      var sk = SKINS[i];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'skin' + (i === skinIdx ? ' sel' : '');
      b.setAttribute('aria-label', sk.name);
      var c = document.createElement('canvas');
      c.width = 92; c.height = 108;
      var g = c.getContext('2d');
      g.scale(2, 2);
      drawChar(g, 23, 50, 0.92, sk, 1, 0, null);
      var s = document.createElement('span'); s.textContent = sk.name.replace('네온 ', '');
      b.appendChild(c); b.appendChild(s);
      b.addEventListener('click', function () {
        skinIdx = i; store('stairs-skin', String(i));
        var all = row.querySelectorAll('.skin');
        for (var k = 0; k < all.length; k++) all[k].className = 'skin' + (k === i ? ' sel' : '');
        tone(520 + i * 90, 0.07, 'sine', 0.04);
      });
      row.appendChild(b);
    })(i);
  }

  /* ══════════ 이벤트 연결 ══════════ */
  function bindPad(el, kind) {
    if (!el) return;
    var down = function (e) {
      if (e && e.cancelable) e.preventDefault();
      el.classList.add('hit');
      setTimeout(function () { el.classList.remove('hit'); }, 90);
      if (state === 'title') { start(); return; }
      press(kind);
    };
    if (window.PointerEvent) el.addEventListener('pointerdown', down, { passive: false });
    else { el.addEventListener('touchstart', down, { passive: false }); el.addEventListener('mousedown', down); }
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function bindKeys() {
    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      var k = e.key;
      if (state === 'title') {
        if (k === ' ' || k === 'Enter' || k === 'ArrowUp' || k === 'ArrowRight') { e.preventDefault(); start(); }
        return;
      }
      if (state === 'over') {
        if (k === ' ' || k === 'Enter') { e.preventDefault(); start(); }
        return;
      }
      if (state !== 'play') return;
      if (k === ' ' || k === 'ArrowUp' || k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); press('up'); }
      else if (k === 'ArrowLeft' || k === 'Shift' || k === 'z' || k === 'Z') { e.preventDefault(); press('turn'); }
    }, { passive: false });
  }

  function bindUI() {
    $('goBtn').addEventListener('click', function () { tone(600, 0.08, 'sine', 0.04); start(); });
    $('againBtn').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.close(); start(); });
    $('rankBtn').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.open({ id: 'infinite-stairs' }); });
    $('ovRank').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.open({ id: 'infinite-stairs' }); });
    $('mute').addEventListener('click', function () {
      muted = !muted;
      store('stairs-mute', muted ? '1' : '0');
      var b = $('mute');
      b.textContent = muted ? '🔇' : '🔊';
      b.className = muted ? 'off' : '';
      b.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
      if (!muted) tone(700, 0.09, 'sine', 0.05);
    });
    $('mute').textContent = muted ? '🔇' : '🔊';
    $('mute').className = muted ? 'off' : '';
  }

  function readChallenge() {
    var c = null;
    try { c = window.ArcadeChallenge && ArcadeChallenge.get ? ArcadeChallenge.get() : null; } catch (e) { }
    if (!c) { try { var u = new URLSearchParams(location.search); if (u.get('challenge')) c = { slug: u.get('challenge'), score: u.get('score') }; } catch (e) { } }
    if (c && c.score != null && isFinite(Number(c.score)) && String(c.slug || '').indexOf('infinite-stairs') >= 0) {
      chalTarget = Math.round(Number(c.score));
      var tip = $('chalTip');
      if (tip && chalTarget > 0) {
        tip.hidden = false;
        tip.innerHTML = '<span>⚔️</span><span id="chalTxt"></span>';
        $('chalTxt').textContent = ' 도전장 목표 ' + chalTarget + '층 깨기!';
      }
    }
  }

  /* ══════════ 시작 ══════════ */
  function init() {
    window.addEventListener('error', function (e) { try { ERR.push(String(e.message || e.error || 'error')); } catch (x) { } });
    resize();
    genTo(16);
    buildSkinRow();
    bindUI();
    bindPad($('btnUp'), 'up');
    bindPad($('btnTurn'), 'turn');
    bindKeys();
    paintArrows();
    paintHud();
    readChallenge();
    window.addEventListener('resize', function () { resize(); }, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
    document.addEventListener('visibilitychange', function () { lastT = 0; });
    if (raf === 0) raf = requestAnimationFrame(frame);
    /* 도전장 목표는 부모(아케이드)가 나중에 보낼 수도 있다 */
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || d.arcade !== 'challenge') return;
      setTimeout(readChallenge, 0);
    });
    document.addEventListener('arcade-challenge-result', function () { readChallenge(); });
  }

  /* 테스트용 최소 API (게임 동작에는 영향 없음) */
  var ERR = [];
  window.__STAIRS = {
    state: function () { return { state: state, floor: floorN, hp: Math.round(hp), facing: facing, level: cur.L, col: cur.col, rungs: rungArr.slice(0, 40), chal: chalTarget, best: bestEver, parts: parts.length }; },
    press: press,
    start: start,
    setSkin: function (i) { skinIdx = i; },
    layout: function () { return { W: W, H: H, charY: L.charY, stepH: L.stepH, colW: L.colW, padH: L.padH, playTop: L.playTop }; },
    nextRung: function () { return rungArr[cur.L + 1]; },
    setHp: function (v) { hp = v; },
    errors: function () { return ERR.slice(); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
