        id: 'knife-throw', score: score, delay: 1300,
        cancelIf: function () { return state !== 'over'; }
      });
    }
  }

  /* ══════════ 파편 · 스파크 ══════════ */
  function spark(x, y, n, ox, oy, rgb) {
    if (parts.length > 190) n = Math.min(n, 6);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU, sp = rand(60, 320);
      parts.push({ x: ox || x, y: oy || y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: rand(0.25, 0.62), max: 0.62, c: rgb || '150,220,255', s: rand(1.4, 3.2), g: 620 });
    }
  }
  function makeFragments() {
    var pal = curPal, n = 20, i, a0, a1, am, rr;
    for (i = 0; i < n; i++) {
      a0 = i * TAU / n; a1 = a0 + TAU / n; am = (a0 + a1) / 2;
      rr = R * rand(0.94, 1.0);
      var pts = [
        { x: 0, y: 0 },
        { x: Math.cos(a0) * rr * 0.78, y: Math.sin(a0) * rr * 0.78 },
        { x: Math.cos(am) * rr, y: Math.sin(am) * rr },
        { x: Math.cos(a1) * rr * 0.78, y: Math.sin(a1) * rr * 0.78 }
      ];
      var cxx = 0, cyy = 0, k;
      for (k = 0; k < pts.length; k++) { cxx += pts[k].x; cyy += pts[k].y; }
      cxx /= pts.length; cyy /= pts.length;
      for (k = 0; k < pts.length; k++) { pts[k].x -= cxx; pts[k].y -= cyy; }
      var col = (i % 4 === 0) ? pal.line : (i % 4 === 1) ? '#1a2444' : (i % 4 === 2) ? pal.disc2 : pal.dark;
      frags.push({ x: cx + board.dx + cxx, y: cy + board.dy + cyy, pts: pts,
        vx: Math.cos(am) * rand(60, 300), vy: Math.sin(am) * rand(60, 300) - rand(40, 170),
        rot: board.rot, vrot: rand(-7, 7), life: 1.5, max: 1.5, c: col, w: R * rand(0.03, 0.08) });
    }
  }

  /* ══════════ 업데이트 ══════════ */
  function update(dt) {
    time += dt;
    /* 보드 반동 스프링 */
    board.vx += (-board.dx * 240 - board.vx * 17) * dt;
    board.vy += (-board.dy * 240 - board.vy * 17) * dt;
    board.dx += board.vx * dt; board.dy += board.vy * dt;
    if (board.s < 1) board.s = Math.min(1, board.s + dt * 2.6);

    if (shake > 0) shake = Math.max(0, shake - dt * 42);

    var i, p;
    /* 칼 꽂힘 애니메이션 */
    for (i = 0; i < knives.length; i++) if (knives[i].t < 1) knives[i].t = Math.min(1, knives[i].t + dt * 7);
    for (i = 0; i < gems.length; i++) if (gems[i].pop > 0) gems[i].pop = Math.max(0, gems[i].pop - dt * 3.2);

    /* 스파크 */
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    /* 파편 */
    for (i = frags.length - 1; i >= 0; i--) {
      p = frags[i];
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt; p.life -= dt;
      if (p.life <= 0) frags.splice(i, 1);
    }
    if (bounce) {
      bounce.vy += 1100 * dt; bounce.x += bounce.vx * dt; bounce.y += bounce.vy * dt;
      bounce.rot += bounce.vrot * dt; bounce.a = Math.max(0, bounce.a - dt * 0.45);
      if (bounce.a <= 0) bounce = null;
    }

    if (state === 'title') {
      spin += (0.55 - spin) * Math.min(1, dt * 3.2);
      board.rot += spin * dt;
      return;
    }
    if (state === 'hit') {
      hitT += dt;
      spin *= Math.max(0, 1 - dt * 5);
      board.rot += spin * dt;
      if (hitT > 0.85) gameOver();
      return;
    }
    if (state === 'clear') {
      clearT += dt;
      spin *= Math.max(0, 1 - dt * 6);
      if (clearT > 1.05) {
        stage++;
        setupStage(false);
        state = 'play';
        score = score; paintHud();
      }
      return;
    }
    if (state === 'over') { spin *= Math.max(0, 1 - dt * 4); return; }
    if (paused) return;

    /* 회전 패턴 */
    updateSpin(dt);

    if (flying) {
      flying.y -= 3400 * dt;
      if (flying.y <= cy + board.dy + R * 0.98) resolveHit();
    }
  }

  function updateSpin(dt) {
    var base = 1.05 + Math.min(2.0, (stage - 1) * 0.10);
    if (boss) base *= 1.16;
    var target = base * dir, rate = 4.0;
    patternT += dt;
    if (pattern === 'steady') {
      target = base * (1 + 0.32 * Math.sin(time * 0.9));
    } else if (pattern === 'pulse') {
      target = base * (0.45 + 1.0 * Math.abs(Math.sin(patternT * 1.15))) * dir;
    } else if (pattern === 'stopgo') {
      var ph = patternT % 3.0;
      if (ph < 1.9) target = base * 1.32 * dir; else { target = 0; rate = 24; }
    } else if (pattern === 'reverse') {
      if (patternT > 1.55) { patternT = 0; dir *= -1; }
      target = base * 0.92 * dir; rate = 6.5;
    } else if (pattern === 'boss') {
      var ph2 = patternT % 2.4;
      if (ph2 > 1.78) { target = 0; rate = 26; }
      else target = base * (1.0 + 0.45 * Math.sin(patternT * 3.1)) * dir;
      if (patternT > 2.4) { patternT = 0; dir *= -1; }
    }
    spin += (target - spin) * Math.min(1, dt * rate);
    board.rot = norm(board.rot + spin * dt);
  }

  /* ══════════ 그리기 ══════════ */
  function drawKnife(g, sk, len, wid, alpha) {
    var b = len * 0.60, hd = len * 0.40, w = wid, i;
    if (alpha != null) g.globalAlpha = alpha;
    var wf = sk.shape === 'dagger' ? 1.3 : sk.shape === 'kunai' ? 0.86 : 1;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(b * 0.20, -w * 0.50 * wf);
    g.lineTo(b, -w * 0.34 * wf);
    g.lineTo(b, w * 0.34 * wf);
    g.lineTo(b * 0.20, w * 0.50 * wf);
    g.closePath();
    g.fillStyle = sk.c1; g.fill();
    g.beginPath(); g.moveTo(b * 0.03, 0); g.lineTo(b * 0.95, -w * 0.30 * wf);
    g.strokeStyle = sk.c2; g.lineWidth = Math.max(1.2, w * 0.22); g.stroke();
    g.beginPath(); g.moveTo(b * 0.26, w * 0.40 * wf); g.lineTo(b * 0.92, w * 0.28 * wf);
    g.strokeStyle = sk.c3; g.lineWidth = Math.max(1, w * 0.14); g.stroke();
    g.fillStyle = sk.c3; g.fillRect(b * 0.97, -w * 0.30, hd * 0.96, w * 0.60);
    g.fillStyle = sk.c2;
    for (i = 0; i < 3; i++) g.fillRect(b * 0.97 + hd * (0.10 + i * 0.26), -w * 0.30, Math.max(1.3, hd * 0.07), w * 0.60);
    g.fillRect(b * 0.97 + hd * 0.90, -w * 0.34, Math.max(1.6, w * 0.16), w * 0.68);
    if (sk.shape === 'kunai' || sk.ring) {
      g.beginPath(); g.arc(b * 0.97 + hd + w * 0.26, 0, w * 0.30, 0, TAU);
      g.strokeStyle = sk.c2; g.lineWidth = Math.max(1.4, w * 0.20); g.stroke();
    }
    if (alpha != null) g.globalAlpha = 1;
  }

  function drawGem(g, size, kind, pop) {
    var s = size * (1 + pop * 0.45);
    if (kind === 'apple') {
      g.beginPath(); g.arc(0, 0, s * 0.80, 0, TAU); g.fillStyle = '#ff2f52'; g.fill();
      g.beginPath(); g.arc(-s * 0.22, -s * 0.22, s * 0.26, 0, TAU); g.fillStyle = 'rgba(255,255,255,0.55)'; g.fill();
      g.fillStyle = '#4dff88'; g.fillRect(-s * 0.05, -s * 1.06, s * 0.12, s * 0.42);
    } else {
      g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.76, 0); g.lineTo(0, s); g.lineTo(-s * 0.76, 0); g.closePath();
      g.fillStyle = '#2fd8ff'; g.fill();
      g.beginPath(); g.moveTo(0, -s * 0.52); g.lineTo(s * 0.40, 0); g.lineTo(0, s * 0.52); g.lineTo(-s * 0.40, 0); g.closePath();
      g.fillStyle = '#e2fbff'; g.fill();
    }
  }

  function drawSprite(img, x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var sx = 0, sy = 0;
    if (shake > 0.4) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);
    else { ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H); }

    ctx.save();
    ctx.translate(sx, sy);

    var bx = cx + board.dx, by = cy + board.dy;
    var sk = curSkin();
    var KLEN = R * 0.86, KWID = Math.max(6, R * 0.085);

    /* 원판 뒤 광 */
    if (board.alive) {
      drawSprite(boss ? GL.pink : GL.cyan, bx, by, R * 3.2, boss ? 0.42 : 0.30);
    }

    if (board.alive && faceCv) {
      ctx.save();
      ctx.translate(bx, by);
      ctx.scale(board.s, board.s);
      ctx.rotate(board.rot);
      ctx.drawImage(faceCv, -faceD / 2, -faceD / 2, faceD, faceD);
      /* 젬 */
      var i, gm;
      for (i = 0; i < gems.length; i++) {
        gm = gems[i];
        if (!gm.alive && gm.pop <= 0) continue;
        var gr = R * 0.95;
        var gx = Math.cos(gm.a) * gr, gy = Math.sin(gm.a) * gr;
        if (gm.alive) drawSprite(gm.kind === 'apple' ? GL.pink : GL.cyan, gx, gy, R * 0.62, 0.55);
        ctx.save(); ctx.translate(gx, gy);
        if (!gm.alive) ctx.globalAlpha = gm.pop;
        drawGem(ctx, R * 0.13, gm.kind, gm.pop);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
      /* 꽂힌 칼 */
      for (i = 0; i < knives.length; i++) {
        var k = knives[i];
        var kt = k.t < 1 ? (0.72 + 0.28 * k.t) : 1;
        ctx.save(); ctx.rotate(k.a); ctx.translate(R * 0.50, 0); ctx.scale(kt, kt);
        drawKnife(ctx, sk, KLEN, KWID, 1);
        ctx.restore();
      }
      ctx.restore();
    }

    /* 파편 */
    for (var f = 0; f < frags.length; f++) {
      var fr = frags[f], a = Math.min(1, fr.life / 0.45);
      ctx.save(); ctx.globalAlpha = a;
      ctx.translate(fr.x, fr.y); ctx.rotate(fr.rot);
      ctx.beginPath();
      ctx.moveTo(fr.pts[0].x, fr.pts[0].y);
      for (var q = 1; q < fr.pts.length; q++) ctx.lineTo(fr.pts[q].x, fr.pts[q].y);
      ctx.closePath();
      ctx.fillStyle = fr.c; ctx.fill();
      ctx.strokeStyle = 'rgba(150,220,255,0.55)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }

    /* 스파크 */
    ctx.lineWidth = 2;
    for (var s = 0; s < parts.length; s++) {
      var pp = parts[s], al = Math.max(0, pp.life / pp.max);
      ctx.globalAlpha = al;
      ctx.fillStyle = 'rgba(' + pp.c + ',1)';
      ctx.fillRect(pp.x - pp.s / 2, pp.y - pp.s / 2, pp.s, pp.s * 1.6);
    }
    ctx.globalAlpha = 1;

    /* 튕겨 나간 칼 */
    if (bounce) {
      ctx.save(); ctx.translate(bounce.x, bounce.y); ctx.rotate(bounce.rot);
      drawKnife(ctx, sk, KLEN, KWID, bounce.a);
      ctx.restore();
    }

    /* 발사대 · 날아가는 칼 */
    if (state === 'play' || state === 'clear' || state === 'hit') {
      /* 발사대 */
      ctx.fillStyle = 'rgba(18,28,54,0.95)';
      roundRect(cx - 40, PAD_Y, 80, 10, 5); ctx.fill();
      ctx.fillStyle = 'rgba(55,224,255,0.5)';
      roundRect(cx - 26, PAD_Y + 2, 52, 3, 2); ctx.fill();
      drawSprite(GL.cyan, cx, PAD_Y + 4, 120, 0.22);
      if (!flying && state === 'play') {
        ctx.save(); ctx.translate(cx, LAUNCH_Y); ctx.rotate(PI / 2);
        drawKnife(ctx, sk, KLEN, KWID, 1);
        ctx.restore();
      }
    }
    if (flying) {
      ctx.save(); ctx.translate(cx, flying.y); ctx.rotate(PI / 2);
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = 'rgba(120,230,255,1)';
      ctx.fillRect(-1.5, 0, 3, 14);
      ctx.globalAlpha = 1;
      drawKnife(ctx, sk, KLEN, KWID, 1);
      ctx.restore();
    }
    /* 첫 투척 안내 */
    if (state === 'play' && stage === 1 && own === 0 && !flying) {
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(time * 3.4);
      ctx.fillStyle = '#cfe6ff';
      ctx.font = '900 13px "Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Liberation Sans",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('화면을 탭해 칼을 던지세요', cx, PAD_Y - R * 0.86 - 26);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  /* ══════════ 루프 ══════════ */
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0;
    fpsN++; fpsAcc += dt;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsN = 0; fpsAcc = 0; }
    update(dt);
    draw();
  }

  /* ══════════ 입력 ══════════ */
  var lastTapAt = 0;
  function tap() {
    if (panelOpen) return;
    if (state === 'title') { startRun(); return; }
    if (state === 'over') { return; }
    if (state === 'play') throwKnife();
  }
  function handleInput(e) {
    var t = e.target;
    if (t && t.closest && t.closest('button, a, input, #over, #skins, #arcade-rank-host')) return;
    var now = performance.now ? performance.now() : Date.now();
    if (now - lastTapAt < 50) return;
    lastTapAt = now;
    if (e.cancelable) { try { e.preventDefault(); } catch (x) { } }
    initAudio(); resumeAudio();
    tap();
  }
  document.addEventListener('touchstart', handleInput, { passive: false });
  document.addEventListener('pointerdown', handleInput, { passive: false });
  document.addEventListener('mousedown', handleInput, false);
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      if (panelOpen) return;
      e.preventDefault(); initAudio(); resumeAudio();
      if (state === 'title') startRun(); else if (state === 'play') throwKnife();
    }
  });

  /* ══════════ 오버레이 · 스킨 ══════════ */
  function hideOverlays() { $('title').hidden = true; $('over').hidden = true; }
  $('startBtn').addEventListener('click', function () { startRun(); });
  $('againBtn').addEventListener('click', function () {
    if (window.ArcadeRank) { try { ArcadeRank.close(); } catch (e) { } }
    startRun();
  });
  $('ovRank').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.open({ id: 'knife-throw' }); });
  $('tRank').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.open({ id: 'knife-throw' }); });
  $('mute').addEventListener('click', function () { initAudio(); setMute(!muted); if (!muted) sfxGem(); });

  var previewsBuilt = false;
  function buildPreviews() {
    if (previewsBuilt) return;
    previewsBuilt = true;
    var grid = $('skinGrid');
    grid.textContent = '';
    SKINS.forEach(function (sk) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sk'; b.setAttribute('data-sk', sk.id);
      var c = document.createElement('canvas');
      var cw = 62, ch = 40;
      c.width = cw * 2; c.height = ch * 2;
      var g = c.getContext('2d'); g.scale(2, 2);
      g.translate(6, ch / 2); g.rotate(-0.42);
      drawKnife(g, sk, 52, 7.4, 1);
      c.style.width = cw + 'px'; c.style.height = ch + 'px';
      b.appendChild(c);
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = sk.name; b.appendChild(nm);
      var cs = document.createElement('span'); cs.className = 'cst'; b.appendChild(cs);
      var ck = document.createElement('span'); ck.className = 'chk'; ck.textContent = '✓'; b.appendChild(ck);
      b.addEventListener('click', function () { pickSkin(sk.id); });
      grid.appendChild(b);
    });
    paintSkins();
  }
  function paintSkins() {
    var grid = $('skinGrid');
    $('skShards').textContent = shards;
    for (var i = 0; i < grid.children.length; i++) {
      var b = grid.children[i], id = b.getAttribute('data-sk'), sk = skinById(id);
      var has = unlocked.indexOf(id) >= 0;
      b.className = 'sk' + (has ? (id === skinId ? ' on' : '') : ' lock');
      b.children[2].textContent = has ? (id === skinId ? '사용 중' : '') : ('💎 ' + sk.cost);
      b.children[3].style.display = (id === skinId) ? 'block' : 'none';
    }
  }
  function pickSkin(id) {
    var sk = skinById(id);
    if (!sk) return;
    if (unlocked.indexOf(id) < 0) {
      if (shards < sk.cost) { toast('조각이 ' + (sk.cost - shards) + '개 부족합니다'); return; }
      shards -= sk.cost; store('knife-shards', String(shards));
      unlocked.push(id); saveSkins();
      skinId = id; store('knife-skin', id);
      paintSkins(); paintHud(); sfxUnlock();
      toast('🔓 ' + sk.name + ' 해금!');

    }
    skinId = id; store('knife-skin', id);
    paintSkins(); sfxGem();
  }
  function openSkins() {

  function closeSkins() {

  }
  $('skinBtn').addEventListener('click', openSkins);
  $('tSkin').addEventListener('click', openSkins);
  $('ovSkin').addEventListener('click', openSkins);
  $('skClose').addEventListener('click', closeSkins);

  /* ══════════ 도전장 ══════════ */
  function readChallenge() {
    var c = null;
    try { c = window.ArcadeChallenge && ArcadeChallenge.get ? ArcadeChallenge.get() : null; } catch (e) { }
    if (!c) { try { var u = new URLSearchParams(location.search); if (u.get('challenge')) c = { slug: u.get('challenge'), score: u.get('score'), by: u.get('by') }; } catch (e) { } }
    if (c && c.score != null && isFinite(Number(c.score)) && String(c.slug || '').indexOf('knife-throw') >= 0) {
      chalTarget = Math.round(Number(c.score));
      if (chalTarget > 0) {
        chalHit = false;
        var tip = $('chalTip');
        tip.hidden = false; tip.className = '';
        tip.textContent = '⚔️ ' + (c.by ? c.by + '님' : '도전장') + ' 목표 ' + chalTarget.toLocaleString() + '점 깨기!';
      }
    }
  }
  function checkChallenge() {
    if (chalTarget && !chalHit && score > chalTarget) {
      chalHit = true;
      var tip = $('chalTip');
      tip.className = 'hit'; tip.hidden = false;
      tip.textContent = '🎉 도전장 달성! ' + score.toLocaleString() + '점 > ' + chalTarget.toLocaleString() + '점';
      banner('⚔️ 도전 성공!', 'gold');
      sfxUnlock();
    }
  }
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || typeof d !== 'object' || d.arcade !== 'challenge') return;
    setTimeout(readChallenge, 0);
  });
  document.addEventListener('arcade-challenge-result', function () { readChallenge(); });

  /* ══════════ 시작 ══════════ */
  function init() {
    setMute(muted);
    layout();
    $('tBest').textContent = best.toLocaleString();
    $('tStage').textContent = stageBest;
    setupStage(true);
    state = 'title';
    window.addEventListener('resize', function () { layout(); }, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
    document.addEventListener('visibilitychange', function () { lastT = 0; if (!document.hidden) { resumeAudio(); } });
    if (!raf) raf = requestAnimationFrame(frame);
    readChallenge();
    paintHud();
  }

  /* score 변경 시 도전장 판정 */
  var _paint = paintHud;
  paintHud = function () { _paint(); checkChallenge(); };

  init();

  /* 테스트용 최소 API (게임 동작에는 영향 없음) */
  window.__KNIFE = {
    state: function () {
      return {
        state: state, stage: stage, score: score, need: need, own: own, boss: boss, pattern: pattern,
        knives: knives.length, gems: gems.length, gemsAlive: gems.filter(function (g) { return g.alive; }).length,
        flying: !!flying, rot: +board.rot.toFixed(3), spin: +spin.toFixed(3), fps: fps,
        shards: shards, unlocked: unlocked.slice(), skin: skinId, best: best, chal: chalTarget,
        frags: frags.length, parts: parts.length, err: ERR.slice(0, 4), paused: paused
      };
    },
    start: startRun,
    tap: function () { if (state === 'title') { startRun(); } else throwKnife(); },
    forceStage: function (n) { stage = Math.max(1, n | 0); setupStage(false); state = 'play'; hideOverlays(); },
    addKnife: function (a) { knives.push({ a: (a == null ? norm(PI / 2 - board.rot) : a), t: 1, own: false }); own++; },
    clearStuck: function () { knives = []; own = 0; },
    setRot: function (v) { board.rot = norm(v); },
    setSpin: function (v) { spin = v; },
    bottomLocal: function () { return norm(PI / 2 - board.rot); },
    resolveNow: function () { flying = { y: cy + R * 0.99 }; resolveHit(); },
    need: function () { return need; },
    gameOverNow: function () { ricochet(norm(PI / 2 - board.rot)); },
    addShards: function (n) { shards += n; store('knife-shards', String(shards)); paintHud(); },
    resetSkins: function () { unlocked = ['cyan']; skinId = 'cyan'; saveSkins(); store('knife-skin', 'cyan'); },
    gemFree: function () { gems = []; },
    setGem: function (a, kind) { gems = [{ a: (a == null ? norm(PI / 2 - board.rot) : a), kind: kind || 'gem', alive: true, pop: 0 }]; },
    knifeAngles: function () { return knives.map(function (k) { return +k.a.toFixed(3); }); }
  };
})();
</script>
</body>
</html>
