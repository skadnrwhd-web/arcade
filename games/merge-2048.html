<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;background:radial-gradient(circle at 50% 0,#2b2160 0,#0b1020 70%)}
#top{width:var(--s);display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.02em;background:linear-gradient(90deg,#ffd23f,#ff7a59);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{display:flex;gap:8px}
.box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:5px 12px;text-align:center;min-width:64px}
.box small{display:block;font-size:10px;opacity:.65;letter-spacing:.08em}
.box b{font-size:19px}
#bar{width:var(--s);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;opacity:.9}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 15px;background:rgba(255,255,255,.13);color:#fff;cursor:pointer}
.btn.main{background:linear-gradient(135deg,#37e0ff,#6d5cff)}
.btn:disabled{opacity:.35}
#board{--g:2.4%;position:relative;width:var(--s);height:var(--s);border-radius:16px;background:#141b3a;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.cell{position:absolute;width:22%;height:22%;border-radius:10px;background:rgba(255,255,255,.06)}
.tile{position:absolute;width:22%;height:22%;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#fff;transition:left .12s ease,top .12s ease;text-shadow:0 2px 6px rgba(0,0,0,.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.3)}
.tile.new{animation:pop .18s ease .06s backwards}
.tile.merge{animation:bump .18s ease}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bump{50%{transform:scale(1.18)}}
#tip{font-size:12px;opacity:.6;text-align:center;width:var(--s)}
#ov{position:absolute;inset:0;border-radius:16px;background:rgba(8,12,30,.78);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;text-align:center;padding:16px}
#ov.on{display:flex}
#ov h2{margin:0;font-size:28px}#ov p{margin:0;opacity:.85}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="app">
  <div id="top"><h1>2048</h1><div class="sc"><div class="box"><small>점수</small><b id="sc">0</b></div><div class="box"><small>최고</small><b id="bs">0</b></div></div></div>
  <div id="bar"><span>같은 숫자를 합쳐 <b>2048</b>을 만드세요</span><span><button class="btn" id="undo" type="button">되돌리기</button> <button class="btn main" id="nw" type="button">새 게임</button></span></div>
  <div id="board"><div id="ov"></div></div>
  <div id="tip">밀어서(스와이프) 또는 방향키·W A S D 로 움직이세요</div>
</div>
<script>
(function(){
"use strict";
var N=4, board=document.getElementById("board"), ov=document.getElementById("ov");
var grid, score, best=0, prev=null, over=false, won=false, keepGoing=false, nextId=1, busy=false;
function $(id){ return document.getElementById(id); }
function st(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
best=+st("m2048-best")||0;

/* 크기: 화면에 맞는 정사각형 */
function size(){ var s=Math.floor(Math.min(window.innerWidth-20,window.innerHeight-210,480)); if(s<220) s=220; document.documentElement.style.setProperty("--s",s+"px"); }
window.addEventListener("resize",size); size();

/* 칸 배경 */
(function(){ var g=2.4,c=(100-5*g)/4; for(var r=0;r<N;r++) for(var k=0;k<N;k++){ var d=document.createElement("div"); d.className="cell"; d.style.left=(g+k*(c+g))+"%"; d.style.top=(g+r*(c+g))+"%"; board.appendChild(d); } })();
function pos(t){ var g=2.4,c=(100-5*g)/4; t.el.style.left=(g+t.c*(c+g))+"%"; t.el.style.top=(g+t.r*(c+g))+"%"; }
function paint(t){ var v=t.v,l=Math.log(v)/Math.LN2,h=(200+l*34)%360;
  t.el.textContent=v; t.el.style.background=v<=4?(v===2?"#3a4a82":"#4a5a9c"):"linear-gradient(135deg,hsl("+h+",75%,52%),hsl("+((h+30)%360)+",80%,40%))";
  var d=String(v).length; t.el.style.fontSize=(d<=2?"clamp(22px,7.4vw,40px)":d===3?"clamp(19px,6.2vw,34px)":"clamp(15px,5vw,28px)"); }
function mk(r,c,v,anim){ var t={id:nextId++,v:v,r:r,c:c,el:document.createElement("div")}; t.el.className="tile"+(anim?" new":""); paint(t); pos(t); board.appendChild(t.el); return t; }

function snapshot(){ var a=[]; for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(grid[r][c]) a.push([r,c,grid[r][c].v]); return {tiles:a,score:score}; }
function clearTiles(){ var ts=board.querySelectorAll(".tile"); for(var i=0;i<ts.length;i++) ts[i].remove(); }
function restore(s){ clearTiles(); grid=[]; for(var r=0;r<N;r++){ grid[r]=[]; for(var c=0;c<N;c++) grid[r][c]=null; } s.tiles.forEach(function(a){ grid[a[0]][a[1]]=mk(a[0],a[1],a[2],false); }); score=s.score; hud(); }
function hud(){ $("sc").textContent=score; if(score>best){ best=score; st("m2048-best",String(best)); } $("bs").textContent=best; $("undo").disabled=!prev; }

function spawn(){ var e=[]; for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(!grid[r][c]) e.push([r,c]); if(!e.length) return; var p=e[Math.floor(Math.random()*e.length)]; grid[p[0]][p[1]]=mk(p[0],p[1],Math.random()<.9?2:4,true); }
function start(){ clearTiles(); grid=[]; for(var r=0;r<N;r++){ grid[r]=[]; for(var c=0;c<N;c++) grid[r][c]=null; } score=0; prev=null; over=false; won=false; keepGoing=false; busy=false; ov.classList.remove("on"); spawn(); spawn(); hud(); }

/* 한 줄을 방향대로 모은다. 같은 숫자는 한 번만 합쳐진다. */
function move(dir){ if(over||busy) return; var before=snapshot(), moved=false, gain=0, dying=[], r,c,i;
  var vec={left:[0,-1],right:[0,1],up:[-1,0],down:[1,0]}[dir];
  for(var line=0;line<N;line++){
    var cells=[]; for(i=0;i<N;i++){ var rr=(dir==="left"||dir==="right")?line:i, cc=(dir==="left"||dir==="right")?i:line; cells.push([rr,cc]); }
    if(dir==="right"||dir==="down") cells.reverse();
    var tiles=[]; cells.forEach(function(p){ if(grid[p[0]][p[1]]) tiles.push(grid[p[0]][p[1]]); });
    var out=[],k=0; while(k<tiles.length){ var t=tiles[k];
      if(k+1<tiles.length&&tiles[k+1].v===t.v){ out.push({keep:t,gone:tiles[k+1]}); k+=2; } else { out.push({keep:t}); k++; } }
    cells.forEach(function(p){ grid[p[0]][p[1]]=null; });
    out.forEach(function(o,idx){ var p=cells[idx]; if(o.keep.r!==p[0]||o.keep.c!==p[1]) moved=true; o.keep.r=p[0]; o.keep.c=p[1]; grid[p[0]][p[1]]=o.keep; pos(o.keep);
      if(o.gone){ moved=true; o.gone.r=p[0]; o.gone.c=p[1]; pos(o.gone); dying.push([o.keep,o.gone]); } });
  }
  if(!moved){ return; }
  prev=before; busy=true;
  setTimeout(function(){ dying.forEach(function(d){ d[1].el.remove(); d[0].v*=2; gain+=d[0].v; paint(d[0]); d[0].el.classList.remove("new"); d[0].el.classList.remove("merge"); void d[0].el.offsetWidth; d[0].el.classList.add("merge"); if(d[0].v===2048&&!won){ won=true; } });
    score+=gain; spawn(); hud(); busy=false; check(); },130);
}
function canMove(){ for(var r=0;r<N;r++) for(var c=0;c<N;c++){ var t=grid[r][c]; if(!t) return true; if(c+1<N&&grid[r][c+1]&&grid[r][c+1].v===t.v) return true; if(r+1<N&&grid[r+1][c]&&grid[r+1][c].v===t.v) return true; } return false; }
function check(){ if(won&&!keepGoing){ ov.innerHTML='<h2>🎉 2048 달성!</h2><p>점수 '+score+'</p><div class="acts"><button class="btn main" id="kg" type="button">계속하기</button><button class="btn" id="nw2" type="button">새 게임</button></div>'; ov.classList.add("on"); $("kg").onclick=function(){ keepGoing=true; ov.classList.remove("on"); }; $("nw2").onclick=start; return; }
  if(!canMove()){ over=true; ov.innerHTML='<h2>더 움직일 수 없어요</h2><p>점수 '+score+(score>=best&&score>0?' · 최고 기록!':'')+'</p><div class="acts"><button class="btn main" id="nw3" type="button">다시 하기</button></div>'; ov.classList.add("on"); $("nw3").onclick=start; } }

/* 입력 */
window.addEventListener("keydown",function(e){ var m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down",A:"left",D:"right",W:"up",S:"down"}[e.key]; if(m){ e.preventDefault(); move(m); } });
var sx=0,sy=0,tracking=false;
board.addEventListener("pointerdown",function(e){ sx=e.clientX; sy=e.clientY; tracking=true; try{ board.setPointerCapture(e.pointerId); }catch(x){} });
board.addEventListener("pointerup",function(e){ if(!tracking) return; tracking=false; var dx=e.clientX-sx,dy=e.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up")); });
board.addEventListener("touchmove",function(e){ e.preventDefault(); },{passive:false});
$("undo").addEventListener("click",function(){ if(!prev||busy) return; over=false; ov.classList.remove("on"); restore(prev); prev=null; hud(); });
$("nw").addEventListener("click",start);
start();
})();
</script>
</body>
</html>
