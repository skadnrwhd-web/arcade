    ctx.strokeStyle = 'rgba(90,230,255,0.30)';

    ctx.moveTo(prx(-0.17, zN), pry(HY * 0.995, zN)); ctx.lineTo(prx(-0.17, zF), pry(HY * 0.995, zF));

    ctx.stroke();

      ctx.lineWidth = w2;
      ctx.beginPath();
      ctx.moveTo(prx(-0.985, z), pry(-HY * 0.82, z)); ctx.lineTo(prx(-0.985, z), pry(HY * 0.82, z));
      ctx.moveTo(prx(0.985, z), pry(-HY * 0.82, z)); ctx.lineTo(prx(0.985, z), pry(HY * 0.82, z));

  function drawTarget(t, z) {
    var p = { x: prx(t.x, z), y: pry(t.y, z) };
    var rs = t.r * (f / z);
    if (rs < 0.8) return;
    var alpha = clamp((SPAWN_Z + 1 - z) / 7, 0.16, 1);
    var tr = t.dead ? clamp(t.deadT / 0.36, 0, 1) : 0;
    if (t.dead) { alpha *= (1 - tr); rs *= 1 + tr * 1.5; }
    if (alpha <= 0.01) return;
    var T0 = TYPE[t.tp];
    var col = T0.col;

    ctx.globalAlpha = alpha * 0.62;
    var gsz = rs * 5;
    ctx.drawImage(GLOW[T0.glow], p.x - gsz / 2, p.y - gsz / 2, gsz, gsz);
    ctx.globalAlpha = alpha;

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);
    ctx.save();
    if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawCorridor();
    /* 먼 표적부터 */
    for (var i = targets.length - 1; i >= 0; i--) {
      var t = targets[i], z = t.z - camZ;
      if (z < 1.1 || z > SPAWN_Z + 2) continue;
      drawTarget(t, z);
    }
    ctx.restore();

    drawSpeedLines();

    /* 파티클 */
    var j;
    for (j = 0; j < parts.length; j++) {
      var p = parts[j], k = 1 - p.t / p.life;

      ctx.moveTo(p.x, p.y);

      ctx.stroke();

      ctx.beginPath(); ctx.arc(r.x, r.y, 8 + kr * 54 * r.k, 0, TAU); ctx.stroke();
    }

    if (state !== 'title') drawGun();

    /* 팝업 */
    ctx.textAlign = 'center';
    for (j = 0; j < pops.length; j++) {

      ctx.font = '900 ' + q.size + 'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
      ctx.fillStyle = 'rgba(4,6,14,0.6)';
      ctx.fillText(q.text, q.x + 1.5, q.y - kq * 26 + 1.5);
      ctx.fillStyle = q.col;
      ctx.fillText(q.text, q.x, q.y - kq * 26);
    }
    ctx.globalAlpha = 1;

    /* 탭 표시 */
    var nowT = performance.now();

      ctx.moveTo(lastTapX - s2 - 6, lastTapY); ctx.lineTo(lastTapX - s2, lastTapY);
      ctx.moveTo(lastTapX + s2, lastTapY); ctx.lineTo(lastTapX + s2 + 6, lastTapY);
      ctx.moveTo(lastTapX, lastTapY - s2 - 6); ctx.lineTo(lastTapX, lastTapY - s2);
      ctx.moveTo(lastTapX, lastTapY + s2); ctx.lineTo(lastTapX, lastTapY + s2 + 6);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* 첫 안내 */
    if (state === 'play' && hintT > 0) {
      ctx.globalAlpha = clamp(hintT / 1.6, 0, 1) * 0.85;
      ctx.fillStyle = '#d9ecff';
      ctx.font = '900 14px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(T('hintTap'), cx, cy + Math.min(W, H) * 0.3);
      ctx.globalAlpha = 1;
    }

    /* 피격 플래시 */
    if (flashT > 0) {
      ctx.fillStyle = 'rgba(' + flashCol + ',' + (flashT * 1.6).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ══════════════ 배너 · 도전장 ══════════════ */
  var bannerT = null;
  function banner(text, kind) {

    el.innerHTML = '<span>' + text + '</span>';
    el.className = 'show' + (kind ? ' ' + kind : '');
    if (bannerT) clearTimeout(bannerT);
    bannerT = setTimeout(function () { el.className = kind || ''; }, kind === 'bad' ? 1100 : 900);
  }
  function readChallenge() {
    var c = null;
    try { c = (window.ArcadeChallenge && ArcadeChallenge.get) ? ArcadeChallenge.get() : null; } catch (e) { }
    if (!c) {
      try {
        var u = new URLSearchParams(location.search);
        if (u.get('challenge')) c = { slug: u.get('challenge'), score: u.get('score'), by: u.get('by') };
      } catch (e2) { }
    }
    if (c && c.score != null && isFinite(Number(c.score)) && String(c.slug || '').indexOf('breach') >= 0) {
      var v = Math.round(Number(c.score));
      if (v > 0) {
        chalTarget = v; chalBy = c.by || ''; chalHit = false;
        var tip = $('chalTip');
        tip.hidden = false; tip.className = '';
        tip.textContent = '⚔️ ' + (chalBy ? chalBy + T('chGoal') : T('chGoal2')) + fmt(chalTarget) + (EN ? ' pts!' : '점!');
      }
    }
  }
  function checkChallenge() {
    if (!chalTarget || chalHit) return;
    if (score > chalTarget) {
      chalHit = true;
      var tip = $('chalTip');
      if (tip) { tip.className = 'hit'; tip.hidden = false; tip.textContent = '⚔️ ' + T('chClear') + ' ' + fmt(score) + ' > ' + fmt(chalTarget); }
      banner(T('chClear'), 'gold');
      sfxBull();
    }
  }
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || typeof d !== 'object' || d.arcade !== 'challenge') return;
    setTimeout(readChallenge, 0);
  });
  document.addEventListener('arcade-challenge-result', function () { readChallenge(); });

  /* ══════════════ 언어 적용 ══════════════ */
  function applyLang() {
    var i, els = document.querySelectorAll('[data-i]');
    for (i = 0; i < els.length; i++) els[i].textContent = T(els[i].getAttribute('data-i'));
    $('rules').innerHTML =
      '<div><i style="color:#ff4d5e;background:#ff4d5e"></i><span>' + T('r1') + '</span></div>' +
      '<div><i style="color:#37e0ff;background:#37e0ff"></i><span>' + T('r2') + '</span></div>' +
      '<div><i style="color:#4ade80;background:#4ade80"></i><span>' + T('r3') + '</span></div>' +
      '<div><i style="color:#ffd23f;background:#ffd23f"></i><span>' + T('r4') + '</span></div>';
    $('langBtn').textContent = EN ? '한' : 'EN';
    $('tBest').textContent = fmt(best);
    $('tCombo').textContent = fmt(bestC);
    $('best').textContent = (EN ? 'Best ' : '최고 ') + fmt(best);
    document.documentElement.lang = EN ? 'en' : 'ko';
    paintHudNow();
  }

  /* ══════════════ 입력 ══════════════ */
  function handleInput(e) {
    var el = e.target;
    if (el && el.closest && el.closest('button, a, input, #arcade-rank-host')) return;
    initAudio(); resumeAudio();
    var now = performance.now();
    var px = 0, py = 0, has = false;
    if (e.changedTouches && e.changedTouches.length) { px = e.changedTouches[0].clientX; py = e.changedTouches[0].clientY; has = true; }
    else if (e.touches && e.touches.length) { px = e.touches[0].clientX; py = e.touches[0].clientY; has = true; }
    else if (typeof e.clientX === 'number' && (e.clientX || e.clientY)) { px = e.clientX; py = e.clientY; has = true; }
    if (e.cancelable) { try { e.preventDefault(); } catch (x) { } }
    if (!has) return;
    if (now - lastTapT < 45 && Math.abs(px - lastTapX) < 8 && Math.abs(py - lastTapY) < 8) return;
    lastTapT = now; lastTapX = px; lastTapY = py;
    if (state === 'title') {
      if (now - titleAt > 420) startGame();
      return;
    }
    if (state === 'over') {
      if (now - endAt > 1100) { /* 결과 화면을 닫지 않고 버튼만 사용 */ }
      return;
    }
    shoot(px, py);
  }
  document.addEventListener('touchstart', handleInput, { passive: false });
  document.addEventListener('pointerdown', handleInput, { passive: false });
  document.addEventListener('mousedown', handleInput, false);
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === 'play') { e.preventDefault(); initAudio(); resumeAudio(); shoot(cx, cy); }
    } else if (e.key === 'm' || e.key === 'M') { setMute(!muted); }
  });

  /* ══════════════ 버튼 ══════════════ */
  $('startBtn').addEventListener('click', function () { startGame(); });
  $('againBtn').addEventListener('click', function () {
    if (window.ArcadeRank) { try { ArcadeRank.close(); } catch (e) { } }
    startGame();
  });
  $('tRank').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.open({ id: 'neon-breach' }); });
  $('ovRank').addEventListener('click', function () { if (window.ArcadeRank) ArcadeRank.open({ id: 'neon-breach' }); });
  $('mute').addEventListener('click', function () { initAudio(); setMute(!muted); if (!muted) sfxHit(1); });
  $('langBtn').addEventListener('click', function () {
    EN = !EN;
    try { store('arc-lang', EN ? 'en' : 'ko'); } catch (e) { }
    applyLang();
  });

  document.addEventListener('visibilitychange', function () {
    lastT = 0;
    if (document.hidden) { if (state === 'play') endGame(); }
    else resumeAudio();
  });
  window.addEventListener('resize', function () { layout(); }, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(layout, 160); });

  /* ══════════════ 루프 ══════════════ */
  var lastT = 0, raf = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    fpsN++; fpsAcc += dt;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsN = 0; fpsAcc = 0; }
    update(dt);
    draw();
  }

  /* ══════════════ 부팅 ══════════════ */
  function boot() {
    layout();
    titleAt = performance.now();
    setMute(muted);
    if (muted) { $('mute').textContent = '🔇'; $('mute').className = 'off'; }
    applyLang();
    resetWorld();
    readChallenge();
    $('title').hidden = false; $('over').hidden = true;
    syncChrome();
    raf = requestAnimationFrame(frame);
  }

  /* 테스트용 훅 (사용 화면에는 영향 없음) */
  window.__NB = {
    state: function () {
      return {
        state: state, time: timeLeft, score: score, combo: combo, hits: hits, shots: shots, bull: bullseyes,
        ally: alliesHit, esc: escapes, fever: fever, alive: aliveCount(), dpr: dpr, W: W, H: H, err: ERR.slice(),
        best: best, muted: muted, en: EN, chal: chalTarget, camZ: camZ, fps: fps, mult: multNow()
      };
    },
    layout: function () { return { DPR: dpr, W: W, H: H, f: f, cx: cx, cy: cy, minTap: MIN_TAP }; },
    start: function () { startGame(); },
    /* z 는 카메라로부터의 깊이(월드 절대 z 아님) */
    spawn: function (tp, x, y, z) { return !!addTarget(tp, x == null ? 0 : x, y == null ? 0 : y, camZ + (z == null ? 14 : z)); },
    screenOf: function (i) {
      var t = targets[i]; if (!t) return null;
      var z = t.z - camZ, rs = t.r * (f / z);
      return { x: prx(t.x, z), y: pry(t.y, z), r: rs, z: z, tp: t.tp, dead: !!t.dead };
    },
    tap: function (x, y) { lastTapT = performance.now(); lastTapX = x; lastTapY = y; shoot(x, y); },
    tapTitle: function () { startGame(); },
    setTime: function (v) { timeLeft = v; },
    clearTargets: function () { targets.length = 0; },
    end: function () { endGame(); },
    mult: function () { return multNow(); },
    fps: function () { return fps; },
    mute: function (v) { setMute(v); }
  };

  var fps = 0, fpsN = 0, fpsAcc = 0;
  boot();
})();
</script>
<script src="home.js"></script>
</body>
</html>
