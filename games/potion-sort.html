<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ══════════════════════════ 기본값 ══════════════════════════ */
  var COLORS = ["#ff3b6b", "#ffd23f", "#3dffa2", "#35c8ff", "#b46bff", "#ff8a3d", "#4f7dff", "#ff5cf0", "#a6ff3d", "#2ff0d6", "#eaf2ff"];
  var RGB = COLORS.map(function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; });
  function col(i, a) { var r = RGB[((i % RGB.length) + RGB.length) % RGB.length]; return 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',' + a + ')'; }

  //<<CORE
  /* ══════════════════════════ 퍼즐 코어 (순수 로직) ══════════════════════════
     물약: 한 병에 4칸. bottles[i] = 아래→위 색 번호 배열. 빈 병은 [].
     합법 이동: 소스에 물약이 있고, 목표가 안 찼고(빈 병이거나 맨 위 색이 같음) → 맨 위 같은 색 덩어리를 옮긴다. */
  var CAP = 4;

  function bTop(b) { return b.length ? b[b.length - 1] : -1; }
  function bRun(b) {              /* 맨 위와 같은 색이 위에서 몇 칸 이어졌는지 */
    var n = b.length; if (!n) return 0;
    var c = b[n - 1], k = 1;
    while (k < n && b[n - 1 - k] === c) k++;
    return k;
  }
  function bSpace(b) { return CAP - b.length; }
  function bComplete(b) { return b.length === CAP && bRun(b) === CAP; }
  function canPour(from, to) {
    if (!from || !to || !from.length) return false;
    if (to.length >= CAP) return false;
    if (!to.length) return true;
    return bTop(to) === bTop(from);
  }
  function pourAmount(from, to) { return canPour(from, to) ? Math.min(bRun(from), bSpace(to)) : 0; }
  function doPour(bottles, i, j) {
    if (!canPour(bottles[i], bottles[j])) return 0;
    var c = bTop(bottles[i]), k = pourAmount(bottles[i], bottles[j]), t;
    for (t = 0; t < k; t++) { bottles[i].pop(); bottles[j].push(c); }
    return k;
  }
  function isSolved(bottles) {
    for (var i = 0; i < bottles.length; i++) {
      var b = bottles[i];
      if (!b.length) continue;
      if (!bComplete(b)) return false;
    }
    return true;
  }
  function cloneBottles(bs) { return bs.map(function (b) { return b.slice(); }); }

  /* ── 스테이지 생성기 ──────────────────────────────────────────
     네 색을 네 칸씩 모두 흘려 담은 뒤(균등 무작위), 완성된 병이 없고 충분히 섞였는지 확인한다.
     풀리는지는 만들 때 실제 솔버가 해답 순서를 찾아내는 것으로 보장한다(해답을 되짚으면 반드시 풀린다).
     ※ 합법 이동의 역연산만으로 섞는 방식은 이 게임의 규칙에서 병 안에 다른 색이 섞인 판을
        만들 수 없다(역이동은 항상 같은 색 위에 같은 색만 쌓이므로 병이 한 색으로만 남는다). */
  function genStage(colors, empties, rng) {
    rng = rng || Math.random;
    var units = [], c, i, j, k, t;
    for (c = 0; c < colors; c++) for (k = 0; k < CAP; k++) units.push(c);
    for (i = units.length - 1; i > 0; i--) {
      j = (rng() * (i + 1)) | 0;
      t = units[i]; units[i] = units[j]; units[j] = t;
    }
    var b = [];
    for (i = 0; i < colors; i++) b.push(units.slice(i * CAP, i * CAP + CAP));
    for (i = 0; i < empties; i++) b.push([]);
    /* 완성된 병이 있으면 처음부터 끝난 병이 생기고, 한 색으로만 채워진 병이 많으면 너무 쉽다 */
    var mixed = 0;
    for (i = 0; i < b.length; i++) {
      if (!b[i].length) continue;
      if (bComplete(b[i])) return null;
      if (bRun(b[i]) !== b[i].length) mixed++;
    }
    if (mixed < Math.ceil(colors * 0.6)) return null;
    if (isSolved(b)) return null;
    return b;
  }

  /* ── 풀이 가능 판정(깊이 우선 + 상태 메모) ──────────────────── */
  function solveState(bottles, cap, nodeCap) {
    cap = cap || CAP; nodeCap = nodeCap || 60000;
    var nodes = 0, limit = false, seen = {}, path = [];
    function key(st) {
      var a = [], i;
      for (i = 0; i < st.length; i++) a.push(st[i].join(','));
      a.sort();
      return a.join('|');
    }
    function won(st) {
      for (var i = 0; i < st.length; i++) {
        var b = st[i];
        if (!b.length) continue;
        if (b.length !== cap) return false;
        for (var j = 1; j < cap; j++) if (b[j] !== b[0]) return false;
      }
      return true;
    }
    function dfs(st, depth) {
      if (nodes++ > nodeCap) { limit = true; return false; }
      if (depth > 260) return false;
      if (won(st)) return true;
      var k = key(st);
      if (seen[k]) return false;
      seen[k] = 1;
      var mv = [], i, j;
      for (i = 0; i < st.length; i++) {
        var bi = st[i]; if (!bi.length) continue;
        var c = bi[bi.length - 1], run = bRun(bi);
        if (run === bi.length && bi.length === cap) continue;      /* 이미 끝난 병은 건드리지 않는다 */
        for (j = 0; j < st.length; j++) {
          if (j === i) continue;
          var bj = st[j]; if (bj.length >= cap) continue;
          if (bj.length && bj[bj.length - 1] !== c) continue;
          var sc = 0;
          if (!bj.length) { if (run === bi.length) continue; sc = 10; } else sc = 60;
          if (bj.length + Math.min(run, cap - bj.length) === cap) sc += 90;
          if (run === bi.length) sc += 20;
          mv.push([sc, i, j]);
        }
      }
      mv.sort(function (x, y) { return y[0] - x[0]; });
      for (var m = 0; m < mv.length; m++) {
        var st2 = cloneBottles(st), a = st2[mv[m][1]], b2 = st2[mv[m][2]];
        var cc = a[a.length - 1], kk = Math.min(bRun(a), cap - b2.length);
        for (var t = 0; t < kk; t++) { a.pop(); b2.push(cc); }
        if (dfs(st2, depth + 1)) { path.push([mv[m][1], mv[m][2]]); return true; }
        if (limit) return false;
      }
      return false;
    }
    var ok = dfs(cloneBottles(bottles), 0);
    path.reverse();
    return { ok: ok, nodes: nodes, limit: limit, path: path };
  }

  /* ── 스테이지 난이도 ─────────────────────────────────────── */
  function stageColors(n) { return Math.min(11, 4 + Math.floor((n - 1) / 2)); }
  function stageBottles(n) { return stageColors(n) + 2; }
  //CORE>>

  /* ══════════════════════════ 저장 · 유틸 ══════════════════════════ */
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, String(v));
    } catch (e) { }
    return null;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function fmtTime(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function fmtNum(n) { return Number(n || 0).toLocaleString('ko-KR'); }

  /* ══════════════════════════ 소리 ══════════════════════════ */
  var AC = null, muted = store('ps-mute') === '1', noiseBuf = null;
  function ac() {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) { } }
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo, when) {
    if (muted) return;
    var a = ac(); if (!a) return;
    try {
      var t0 = a.currentTime + (when || 0);
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);

  /* 한 병 그리기: (cx,cy) 중심, 각도, 액체 길이(소수 허용) */

  function drawStream(sx, sy, ex, ey, ci, p) {

    c.lineWidth = 6.4;
    c.lineCap = 'round';

  function tubeOf(i) {

    var sg = tubeOf(i), dg = tubeOf(j);
    if (!sg || !dg) return false;
    var sign = sg.cx <= dg.cx ? 1 : -1;
    var ang = 0.82 * sign;
    var mouthX = dg.cx;
    var mouthY = dg.y - 32;
    var pcx = mouthX - (sg.h / 2) * Math.sin(ang);
    var pcy = mouthY + (sg.h / 2) * Math.cos(ang);
    A = {
      t: 0, src: i, dst: j, count: count, color: bTop(from),
      sg: { cx: sg.cx, cy: sg.y + sg.h / 2, w: sg.w, h: sg.h },
      dg: { cx: dg.cx, y: dg.y, w: dg.w, h: dg.h },
      sStart: from.length, dStart: to.length,
      t1: 0.09, t2: 0.25, t3: 0.25 + 0.055 * count + 0.06, t4: 0,
      committed: false, poured: false, newDone: [],
      pos: { cx: sg.cx, cy: sg.y + sg.h / 2, ang: 0 }
    };
    A.t4 = A.t3 + 0.05;
    A.t5 = A.t4 + 0.22;
    S.sel = -1;
    return true;
  }

  function commitPour() {
    if (!A || A.committed) return;
    A.committed = true;
    var from = S.bottles[A.src], to = S.bottles[A.dst], c = A.color, k = A.count;
    var beforeSrc = bComplete(from), beforeDst = bComplete(to), t;
    for (t = 0; t < k; t++) { from.pop(); to.push(c); }
    A.newDone = [];
    if (!beforeDst && bComplete(to)) A.newDone.push(A.dst);
    if (!beforeSrc && bComplete(from)) A.newDone.push(A.src);
    S.moves++;
    if (A.newDone.length) { S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); }
    else S.combo = 0;
    updateHud();
  }

  function finishPour() {
    if (!A || A.poured) return;
    A.poured = true;
    sfxPour(A.count);
    for (var n = 0; n < A.newDone.length; n++) {
      var bi = A.newDone[n], g = tubeOf(bi);
      if (g) burst(g.cx, g.y + g.h * 0.2, bTop(S.bottles[bi]), 26, 170);
      sfxSeal();
    }
    if (A.newDone.length) buzz(18);
    /* 클리어 판정 */
    if (isSolved(S.bottles)) {
      S.state = 'clear';
      var cx = L.W / 2, cy = L.H * 0.45;
      for (var i = 0; i < 7; i++) burst(cx + (Math.random() - 0.5) * 200, cy + (Math.random() - 0.5) * 160, (Math.random() * 8) | 0, 26, 260);
      setTimeout(stageClear, 620);
    }
  }

  function updateAnim(dt) {
    if (!A) return;
    A.t += dt;
    if (A.t >= A.t2) commitPour();
    if (A.t >= A.t3) finishPour();
    var sg = A.sg, dg = A.dg;
    var sign = sg.cx <= dg.cx ? 1 : -1;
    var ang = 0.82 * sign;
    var sg0 = { cx: sg.cx, cy: sg.cy };
    var pcx = dg.cx - (sg.h / 2) * Math.sin(ang);
    var pcy = (dg.y - 32) + (sg.h / 2) * Math.cos(ang);
    if (A.t < A.t1) {
      var p = easeOut(A.t / A.t1);
      A.pos = { cx: sg0.cx, cy: sg0.cy - 12 * p, ang: 0 };
    } else if (A.t < A.t2) {
      var q = easeInOut((A.t - A.t1) / (A.t2 - A.t1));
      A.pos = {
        cx: sg0.cx + (pcx - sg0.cx) * q,
        cy: (sg0.cy - 12) + (pcy - (sg0.cy - 12)) * q,
        ang: ang * q
      };
    } else if (A.t < A.t4) {
      A.pos = { cx: pcx, cy: pcy, ang: ang };
    } else if (A.t < A.t5) {
      var r = easeInOut((A.t - A.t4) / (A.t5 - A.t4));
      A.pos = {
        cx: pcx + (sg0.cx - pcx) * r,
        cy: pcy + (sg0.cy - pcy) * r,
        ang: ang * (1 - r)
      };
    } else {
      A = null;
      updateHud();
    }
  }

  function update(dt) {
    S.clock += dt;
    if (S.state === 'play') S.elapsed += dt;
    var i;
    for (i = P.length - 1; i >= 0; i--) {
      var p = P[i];
      p.life -= dt;
      if (p.life <= 0) { P.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.g * dt; p.vx *= 0.985;
    }
    updateAnim(dt);
    if (S.state === 'play') updateHudTime();
  }

  var lastT = 0, rafId = 0;
  function frame(t) {
    rafId = requestAnimationFrame(frame);
    var dt = lastT ? (t - lastT) / 1000 : 0.016;
    lastT = t;
    if (!(dt > 0)) dt = 0.016;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
  }

  /* ══════════════════════════ HUD ══════════════════════════ */
  var hudCache = {};
  function updateHud() {
    var hs = $('hStage'), hc = $('hScore'), hm = $('chipMoves'), ht = $('chipTime'), hb = $('chipCombo'), hbest = $('hBest');
    if (hs) hs.textContent = S.stage;
    if (hc) hc.textContent = fmtNum(S.total);
    if (hm) hm.textContent = S.moves + '수';
    if (ht) ht.textContent = fmtTime(S.elapsed);
    if (hb) { hb.hidden = S.combo < 2; if (S.combo >= 2) hb.textContent = '콤보 ×' + S.combo; }
    if (hbest) hbest.textContent = '최고 ' + fmtNum(S.bestScore) + '점 · ' + S.bestStage + '스테이지';
    var un = $('undoN');
    if (un) { un.hidden = !S.hist.length; un.textContent = S.hist.length; }
    var ba = $('btnAdd');
    if (ba) ba.disabled = S.added || S.state !== 'play';
    var bu = $('btnUndo');
    if (bu) bu.disabled = !S.hist.length || S.state !== 'play' || !!A;
    var bStart = $('startBest');
    if (bStart) bStart.textContent = '최고 기록 ' + fmtNum(S.bestScore) + '점 · ' + S.bestStage + '스테이지';
  }
  function updateHudTime() {
    var ht = $('chipTime');
    if (ht) { var v = fmtTime(S.elapsed); if (hudCache.t !== v) { hudCache.t = v; ht.textContent = v; } }
  }

  /* ══════════════════════════ 입력 ══════════════════════════ */
  function hitTest(x, y) {
    for (var i = L.tubes.length - 1; i >= 0; i--) {
      var g = L.tubes[i];
      if (i >= S.bottles.length) continue;
      var lift = (S.sel === i) ? 11 : 0;
      if (x >= g.x - 6 && x <= g.x + g.w + 6 && y >= g.y - lift - 14 && y <= g.y + g.h + 10) return i;
    }
    return -1;
  }

  function tapBottle(i) {
    if (A || S.state !== 'play') return;
    if (i < 0 || i >= S.bottles.length) return;
    if (S.sel < 0) {
      if (S.bottles[i].length) { S.sel = i; sfxPick(); }
      return;
    }
    if (S.sel === i) { S.sel = -1; tone(480, 0.06, 'sine', 0.025, 380); return; }
    if (canPour(S.bottles[S.sel], S.bottles[i])) {
      var from = S.sel;
      pushHistory();
      startPour(from, i);
      return;
    }
    if (S.bottles[i].length) { S.sel = i; sfxPick(); return; }
    flash[i] = S.clock; sfxNo(); buzz(9);
  }

  function pushHistory() {
    S.hist.push({
      b: cloneBottles(S.bottles),
      moves: S.moves, combo: S.combo, maxCombo: S.maxCombo
    });
    if (S.hist.length > 400) S.hist.shift();
  }

  function undo() {
    if (S.state !== 'play' || A) return;
    if (!S.hist.length) { toast('무를 동작이 없어요'); sfxNo(); return; }
    var h = S.hist.pop();
    S.bottles = cloneBottles(h.b);
    S.moves = h.moves; S.combo = h.combo; S.maxCombo = h.maxCombo;
    S.usedUndo = true;
    S.sel = -1;
    layout();
    updateHud();
    sfxUndo();
  }

  function addBottle() {
    if (S.state !== 'play' || A) return;
    if (S.added) { toast('이번 스테이지에서는 한 번만 쓸 수 있어요'); sfxNo(); return; }
    S.added = true;
    S.hist = [];                      /* 병을 하나 얻는 대신 무르기 기록은 비운다 */
    S.bottles.push([]);
    S.sel = -1;
    layout();
    updateHud();
    sfxAdd();
    toast('빈 병 +1 · 무르기 기록은 초기화됐어요');
  }

  function restart() {
    if (A) return;
    S.bottles = cloneBottles(S.initial);
    S.moves = 0; S.combo = 0; S.maxCombo = 0; S.usedUndo = false; S.added = false;
    S.elapsed = 0; S.hist = []; S.sel = -1; S.state = 'play';
    P.length = 0;
    layout(); updateHud(); hideClear();
    tone(420, 0.1, 'sine', 0.04, 620);
  }

  /* ══════════════════════════ 스테이지 ══════════════════════════ */
  function makeStage(n) {
    var colors = stageColors(n), b = null, ok = false, path = null, tries = 0, last = null;
    while (tries < 60) {
      tries++;
      b = genStage(colors, 2, Math.random);
      if (!b) continue;
      last = b;
      var res = solveState(b, CAP, 40000);
      if (res.ok) { ok = true; path = res.path; break; }
    }
    if (!ok) {
      b = last || [[0, 1, 0, 1], [1, 0, 1, 0], [], []];
    }
    return b;
  }

  function startStage(n) {
    A = null; P.length = 0; flash = {};
    var b = makeStage(n);
    S.stage = n;
    S.bottles = cloneBottles(b);
    S.initial = cloneBottles(b);
    S.moves = 0; S.elapsed = 0; S.combo = 0; S.maxCombo = 0;
    S.usedUndo = false; S.added = false; S.hist = []; S.sel = -1;
    S.state = 'play';
    layout(); updateHud();
  }

  function stageClear() {
    if (S.state !== 'clear') return;
    var t = S.elapsed, mv = S.moves;
    var base = 600 + S.stage * 120;
    var mb = Math.max(0, 260 - mv * 6);
    var tb = Math.max(0, 220 - Math.floor(t) * 3);
    var cb = S.maxCombo * 90;
    var nb = S.usedUndo ? 0 : 200;
    var ab = S.added ? -120 : 0;
    var got = Math.max(60, base + mb + tb + cb + nb + ab);
    S.total += got;
    var isBestStage = S.stage >= S.bestStage;
    if (S.stage > S.bestStage) { S.bestStage = S.stage; store('ps-best-stage', S.bestStage); }
    if (S.total > S.bestScore) { S.bestScore = S.total; store('ps-best-score', S.bestScore); }
    updateHud();
    sfxClear();
    buzz(26);

    var rows = $('clrRows');
    if (rows) {
      var items = [
        ['기본 점수', '+' + fmtNum(base), true],
        ['이동 보너스 (' + mv + '수)', '+' + fmtNum(mb), mb > 0],
        ['시간 보너스 (' + fmtTime(t) + ')', '+' + fmtNum(tb), tb > 0],
        ['콤보 보너스 (최대 ×' + S.maxCombo + ')', '+' + fmtNum(cb), cb > 0],
        [S.usedUndo ? '무르기 사용' : '무르기 없이 클리어', S.usedUndo ? '+0' : '+' + fmtNum(nb), !S.usedUndo],
        ['병 추가 사용', ab ? '-' + fmtNum(-ab) : '+0', false]
      ];
      var html = '';
      for (var i = 0; i < items.length; i++) {
        if (items[i][2] === false && items[i][1] === '+0') continue;
        html += '<div class="r' + (items[i][2] ? '' : ' off') + '"><span>' + items[i][0] + '</span><b>' + items[i][1] + '</b></div>';
      }
      html += '<div class="r sum"><span>이번 스테이지</span><b>+' + fmtNum(got) + '</b></div>';
      rows.innerHTML = html;
    }
    var ct = $('clrTitle'); if (ct) ct.textContent = 'STAGE ' + S.stage + ' CLEAR!';
    var cs = $('clrSub');
    if (cs) {
      if (isBestStage && S.stage > 1) cs.textContent = '🎉 최고 기록 경신! 다음 병이 기다려요';
      else if (S.maxCombo >= 2) cs.textContent = '콤보 ' + S.maxCombo + '연속! 손이 좋아요';
      else cs.textContent = '물약을 모두 정리했어요';
    }
    var ctot = $('clrTotal'); if (ctot) ctot.textContent = fmtNum(S.total);
    showClear();
  }

  function showClear() {
    var el = $('clear'); if (el) el.hidden = false;
    var btn = $('btnNext'); if (btn) btn.textContent = '다음 스테이지 →';
  }
  function hideClear() { var el = $('clear'); if (el) el.hidden = true; }

  /* ══════════════════════════ 랭킹 · 도전장 ══════════════════════════ */
  function rankShowScore() {
    if (window.ArcadeRank && ArcadeRank.games && ArcadeRank.games['potion-sort']) {
      ArcadeRank.show({ id: 'potion-sort', score: S.total, delay: 0 });
    } else toast('랭킹을 불러오지 못했어요');
  }
  function rankOpen() {
    if (window.ArcadeRank) ArcadeRank.open({ id: 'potion-sort' });
    else toast('랭킹을 불러오지 못했어요');
  }
  function readChallenge() {
    var c = null;
    try { c = (window.ArcadeChallenge && ArcadeChallenge.get) ? ArcadeChallenge.get() : null; } catch (e) { }
    if (!c) {
      try {
        var u = new URLSearchParams(location.search);
        if (u.get('challenge')) c = { slug: u.get('challenge'), score: u.get('score'), by: u.get('by') };
      } catch (e) { }
    }
    if (!c || c.score == null || !isFinite(Number(c.score))) return;
    if (String(c.slug || '').indexOf('potion') < 0) return;
    S.chal = { target: Math.round(Number(c.score)), by: String(c.by || '') };
    S.chalHit = false;
    var tip = $('chalTip');
    if (tip && S.chal.target > 0) {
      tip.hidden = false;
      tip.className = '';
      tip.textContent = '⚔️ ' + (S.chal.by ? S.chal.by + '님' : '도전장') + ' 목표 ' + fmtNum(S.chal.target) + '점 넘기!';
      layout();
    }
  }
  function checkChallenge() {
    if (!S.chal || S.chalHit) return;
    if (S.total >= S.chal.target) {
      S.chalHit = true;
      var tip = $('chalTip');
      if (tip) { tip.className = 'hit'; tip.textContent = '⚔️ 도전장 목표 ' + fmtNum(S.chal.target) + '점 돌파!'; }
      toast('⚔️ 도전장 목표를 넘었어요!');
      tone(880, 0.2, 'triangle', 0.06, 1180);
    }
  }

  /* ══════════════════════════ 토스트 ══════════════════════════ */
  var toastTid = 0;
  function toast(msg) {
    var el = $('toastT');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTid);
    toastTid = setTimeout(function () { el.hidden = true; }, 2400);
  }

  /* ══════════════════════════ 시작 ══════════════════════════ */
  function startGame() {
    ac();
    var t = $('title'); if (t) t.hidden = true;
    startStage(1);
    S.total = 0;
    updateHud();
    var tip = $('chalTip');
    if (tip) tip.hidden = !S.chal;
    toast('병을 탭해 들고, 같은 색 병을 탭하세요');
  }

  function nextStage() {
    hideClear();
    startStage(S.stage + 1);
    toast('STAGE ' + S.stage + ' · ' + stageColors(S.stage) + '가지 색');
  }

  function bind() {
    cv = $('cv');
    if (cv && cv.getContext) {
      ctx = cv.getContext('2d', { alpha: true });
    }
    if (!ctx) {
      /* 캔버스를 못 쓰는 환경에서도 멈추지 않게 최소 스텁 */
      var noop = function () { };
      ctx = {};
      ['save', 'restore', 'translate', 'rotate', 'beginPath', 'moveTo', 'lineTo', 'quadraticCurveTo',
        'closePath', 'fill', 'stroke', 'arc', 'ellipse', 'fillRect', 'clearRect', 'clip', 'arcTo'].forEach(function (k) { ctx[k] = noop; });
    }

    if (cv && cv.addEventListener) {
      cv.addEventListener('pointerdown', function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (S.state !== 'play' || A) return;
        var x = e.clientX, y = e.clientY;
        var i = hitTest(x, y);
        if (i >= 0) tapBottle(i);
        else if (S.sel >= 0) S.sel = -1;
      }, { passive: false });
      cv.addEventListener('contextmenu', function (e) { if (e && e.preventDefault) e.preventDefault(); });
    }
    /* iOS 핀치·더블탭 확대 방지 (버튼·오버레이는 예외) */
    document.addEventListener('touchstart', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('button,a,.ov')) return;
      if (e.touches && e.touches.length > 1 && e.preventDefault) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) { if (e && e.preventDefault) e.preventDefault(); }, { passive: false });

    var bs = $('btnStart'); if (bs) bs.addEventListener('click', startGame);
    var bn = $('btnNext'); if (bn) bn.addEventListener('click', nextStage);
    var bu = $('btnUndo'); if (bu) bu.addEventListener('click', undo);
    var ba = $('btnAdd'); if (ba) ba.addEventListener('click', addBottle);
    var br = $('btnRestart'); if (br) br.addEventListener('click', restart);
    var bk = $('btnRank'); if (bk) bk.addEventListener('click', rankOpen);
    var bkr = $('btnTitleRank'); if (bkr) bkr.addEventListener('click', rankOpen);
    var bcr = $('btnClrRank'); if (bcr) bcr.addEventListener('click', rankShowScore);
    var mu = $('mute');
    if (mu) {
      mu.textContent = muted ? '🔇' : '🔊';
      mu.className = muted ? 'off' : '';
      mu.addEventListener('click', function () {
        muted = !muted;
        store('ps-mute', muted ? '1' : '0');
        mu.textContent = muted ? '🔇' : '🔊';
        mu.className = muted ? 'off' : '';
        mu.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
        if (!muted) tone(700, 0.09, 'sine', 0.05);
      });
    }
    window.addEventListener('resize', function () { layout(); }, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(function () { layout(); }, 140); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { layout(); });
    }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || d.arcade !== 'challenge') return;
      setTimeout(readChallenge, 0);
    });
    document.addEventListener('arcade-challenge-result', function () { readChallenge(); });
  }

  function init() {
    bind();
    /* 시작 화면 뒤에 미리보기 판을 깔아 둔다 */
    S.bottles = makeStage(1);
    S.initial = cloneBottles(S.bottles);
    layout();
    updateHud();
    readChallenge();
    if (!rafId) rafId = requestAnimationFrame(frame);
    /* 채점이 끝날 때마다 도전장 목표를 확인한다 */
    setInterval(function () { if (S.state === 'clear' || S.state === 'play') checkChallenge(); }, 700);
  }

  /* 테스트용 최소 API (게임 동작에는 영향 없음) */
  window.__POTION = {
    state: function () {
      return {
        stage: S.stage, total: S.total, moves: S.moves, elapsed: S.elapsed,
        combo: S.combo, maxCombo: S.maxCombo, usedUndo: S.usedUndo, added: S.added,
        sel: S.sel, state: S.state, hist: S.hist.length,
        bottles: cloneBottles(S.bottles), initial: cloneBottles(S.initial),
        anim: A ? { src: A.src, dst: A.dst, count: A.count, t: A.t, committed: A.committed, poured: A.poured } : null,
        particles: P.length, solved: isSolved(S.bottles), best: S.bestScore, bestStage: S.bestStage
      };
    },
    tick: function (ms) { var d = (ms || 16) / 1000; update(d); draw(); return !!A; },
    tap: tapBottle, tapBottle: tapBottle, pour: function (i, j) { tapBottle(i); tapBottle(j); },
    undo: undo, addBottle: addBottle, restart: restart,
    start: function () { startGame(); },
    next: nextStage,
    setStage: function (n) { startStage(n); },
    genStage: genStage, solve: solveState, colors: stageColors, bottlesFor: stageBottles,
    layout: function () { return { W: L.W, H: L.H, tubes: L.tubes.map(function (t) { return { x: t.x, y: t.y, w: t.w, h: t.h, i: t.i }; }) }; },
    makeStage: makeStage,
    setBottles: function (bs) { S.bottles = cloneBottles(bs); S.initial = cloneBottles(bs); S.hist = []; S.sel = -1; S.moves = 0; layout(); updateHud(); },
    tapAt: function (x, y) { var i = hitTest(x, y); if (i >= 0) tapBottle(i); return i; },
    clearNow: function () { S.state = 'clear'; stageClear(); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
