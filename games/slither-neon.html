<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060e">
<meta name="description" content="네온 아레나에서 빛 구슬을 먹고 몸을 키워 AI 지렁이를 가로막아 잡는 지렁이 액션 게임. 1위 왕관을 노려라!">
<title>🐍 네온 지렁이 키우기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060e;color:#eaf6ff;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",sans-serif}
  body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  #app{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#04060e}
  #cv{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- flash ---------- */
  #flash{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.85),rgba(160,240,255,.15) 55%,transparent 75%)}
  #flash.hit{animation:flashUp .45s ease-out}
  #flash.kill{animation:flashKill .4s ease-out}
  @keyframes flashUp{0%{opacity:.85}100%{opacity:0}}
  @keyframes flashKill{0%{opacity:.5}100%{opacity:0}}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0 12px;pointer-events:none;z-index:6;gap:8px}
  .hleft{display:flex;flex-direction:column;gap:4px;min-width:0}
  .lenrow{display:flex;align-items:baseline;gap:6px}
  #len{font-size:clamp(30px,8.6vw,46px);font-weight:900;line-height:.98;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;color:#f4feff;
    text-shadow:0 0 20px rgba(70,225,255,.85),0 0 6px rgba(120,240,255,.75)}
  .lenrow .unit{font-size:clamp(8px,2.3vw,10px);font-weight:800;letter-spacing:.22em;color:rgba(140,205,235,.72)}
  .statrow{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:clamp(9px,2.6vw,11px);font-weight:800;
    letter-spacing:.12em;color:rgba(150,205,232,.78)}
  .statrow b{color:#9ff3ff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .statrow .sep{width:1px;height:9px;background:rgba(120,190,220,.35)}
  #buffs{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .buff{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;
    font-size:10px;font-weight:900;letter-spacing:.04em;white-space:nowrap;
    background:rgba(10,30,55,.72);border:1px solid rgba(90,220,255,.45);color:#bff4ff;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .buff.hyper{border-color:rgba(255,120,230,.6);color:#ffd0f6;box-shadow:0 0 14px rgba(255,110,225,.35)}
  .buff .bar{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
  .buff .bar i{display:block;height:100%;background:currentColor;transform-origin:left center}

  .hright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;max-width:47vw}
  .rankpanel{width:clamp(104px,30vw,142px);padding:6px 7px 5px;border-radius:11px;
    background:linear-gradient(180deg,rgba(8,22,42,.9),rgba(6,14,28,.78));
    border:1px solid rgba(70,180,240,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(140,235,255,.12)}
  .rt{font-size:8px;font-weight:900;letter-spacing:.2em;color:rgba(120,200,235,.65);
    display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
  .rt em{font-style:normal;color:#ffd45a}
  #rank{display:flex;flex-direction:column;gap:1px}
  #rank .row{display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.45;
    font-variant-numeric:tabular-nums;color:rgba(190,225,245,.82)}
  #rank .row .i{width:9px;text-align:right;font-weight:800;color:rgba(120,180,215,.6);font-size:9px}
  #rank .row .c{width:11px;font-size:9px;text-align:center}
  #rank .row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  #rank .row .v{font-weight:900;color:#9ff3ff}
  #rank .row.me{color:#fff}
  #rank .row.me .n{color:#fff;text-shadow:0 0 10px rgba(90,235,255,.9)}
  #rank .row.me .v{color:#fff}
  #rank .row.top .v{color:#ffd45a}

  .mmwrap{position:relative;width:clamp(72px,20vw,92px);height:clamp(72px,20vw,92px);border-radius:50%;
    background:rgba(4,10,22,.62);border:1px solid rgba(70,180,240,.3);
    box-shadow:0 0 18px rgba(30,140,220,.22),inset 0 0 22px rgba(20,90,160,.25);overflow:hidden;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #mm{display:block;width:100%;height:100%}

  /* ---------- note ---------- */
  #note{position:absolute;left:0;right:0;top:clamp(96px,26vh,190px);text-align:center;pointer-events:none;z-index:7;
    font-weight:900;font-style:italic;letter-spacing:.04em;font-size:clamp(22px,7vw,38px);
    color:#fff;opacity:0;transform:translateY(0) scale(.9);
    text-shadow:0 0 14px #fff,0 0 30px #46e6ff,0 0 60px #2ba6ff}
  #note.show{animation:noteUp 1.25s cubic-bezier(.2,.9,.25,1) forwards}
  #note.combo{text-shadow:0 0 14px #fff,0 0 32px #ffd45a,0 0 64px #ff7a2a}
  @keyframes noteUp{
    0%{opacity:0;transform:translateY(18px) scale(.7)}
    16%{opacity:1;transform:translateY(0) scale(1.14)}
    30%{transform:translateY(0) scale(1)}
    72%{opacity:1;transform:translateY(-6px) scale(1)}
    100%{opacity:0;transform:translateY(-30px) scale(.96)}
  }

  /* ---------- joystick ---------- */
  #stick{position:absolute;width:118px;height:118px;border-radius:50%;pointer-events:none;z-index:5;
    display:none;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(90,220,255,.12),rgba(90,220,255,.03) 60%,transparent 72%);
    border:1px solid rgba(110,225,255,.3);box-shadow:0 0 26px rgba(60,200,255,.18) inset}
  #stick.on{display:block}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.95),rgba(90,225,255,.7) 45%,rgba(30,150,220,.35));
    box-shadow:0 0 20px rgba(110,235,255,.85),0 0 44px rgba(60,190,255,.45);transform:translate(0,0)}

  /* ---------- boost ---------- */
  #boostBtn{position:absolute;right:clamp(14px,4vw,26px);bottom:calc(clamp(18px,4vh,30px) + env(safe-area-inset-bottom,0px));
    width:clamp(80px,22vw,104px);height:clamp(80px,22vw,104px);border-radius:50%;z-index:6;cursor:pointer;
    border:2px solid rgba(255,205,90,.55);color:#fff3c4;
    background:radial-gradient(circle at 40% 34%,rgba(255,225,140,.34),rgba(255,150,40,.16) 48%,rgba(60,20,0,.42));
    box-shadow:0 0 26px rgba(255,180,60,.32),inset 0 0 22px rgba(255,200,90,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    transition:transform .1s,box-shadow .14s,opacity .18s;touch-action:none}
  #boostBtn span{font-size:clamp(22px,6.4vw,30px);line-height:1;filter:drop-shadow(0 0 8px rgba(255,220,120,.95))}
  #boostBtn em{font-style:normal;font-size:clamp(8px,2.2vw,10px);font-weight:900;letter-spacing:.18em;color:rgba(255,235,180,.9)}
  #boostBtn.down{transform:scale(.92);box-shadow:0 0 40px rgba(255,200,80,.75),inset 0 0 30px rgba(255,225,150,.4)}
  #boostBtn.off{opacity:.42}
  #boostBtn .cd{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,220,120,.9);
    clip-path:inset(0 0 0 0);opacity:0}

  #mute{position:absolute;left:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:rgba(10,24,42,.62);border:1px solid rgba(70,180,240,.32);color:#bfeeff;font-size:16px;
    cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .12s}
  #mute:active{transform:scale(.92)}

  /* ---------- overlays ---------- */
  .overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(circle at 50% 32%,rgba(8,24,48,.55),rgba(2,5,14,.86) 72%);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow:auto;
    animation:fadeIn .32s ease-out}
  .overlay.hide{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{width:min(560px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(9px,2.4vw,15px)}
  .logo{font-size:clamp(24px,7.4vw,42px);font-weight:900;letter-spacing:-.02em;line-height:1.1;color:#fff;
    text-shadow:0 0 18px rgba(80,230,255,.9),0 0 46px rgba(70,120,255,.7),0 0 90px rgba(150,60,255,.5)}
  .logo .em{font-style:normal}
  .sub{font-size:clamp(11px,3vw,14px);color:rgba(175,220,240,.82);font-weight:600;letter-spacing:.01em;line-height:1.5}
  .sub b{color:#9ff3ff;font-weight:800}
  .skinlab{font-size:9px;font-weight:900;letter-spacing:.24em;color:rgba(140,200,230,.6);margin-bottom:-4px}
  #skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%;max-width:400px}
  .skin{position:relative;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:13px;cursor:pointer;
    background:linear-gradient(160deg,rgba(14,30,54,.86),rgba(6,12,24,.86));
    border:1px solid rgba(80,160,220,.26);transition:transform .12s,border-color .16s,box-shadow .16s;text-align:left}
  .skin:active{transform:scale(.97)}
  .skin .sw{width:26px;height:26px;border-radius:50%;flex:none;position:relative}
  .skin .sw::after{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.92);
    filter:blur(1px);opacity:.55;transform:translate(-3px,-3px)}
  .skin .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
  .skin .nm b{font-size:11.5px;font-weight:900;color:#e9f8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .skin .nm i{font-style:normal;font-size:8.5px;letter-spacing:.12em;color:rgba(150,200,225,.55);font-weight:700}
  .skin.on{border-color:rgba(120,240,255,.85);box-shadow:0 0 0 1px rgba(120,240,255,.35),0 0 22px rgba(60,210,255,.42);
    background:linear-gradient(160deg,rgba(18,48,80,.94),rgba(8,18,34,.92))}
  .skin.on::before{content:"✓";position:absolute;top:-6px;right:-4px;width:17px;height:17px;border-radius:50%;
    background:linear-gradient(180deg,#7cf6ff,#25b6f5);color:#04202e;font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(90,230,255,.85)}

  .btn{position:relative;width:100%;max-width:340px;height:clamp(48px,12.4vw,56px);border-radius:15px;cursor:pointer;
    border:1px solid rgba(140,250,255,.7);color:#03202c;font-size:clamp(15px,4.2vw,18px);font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#a8fbff,#3fd8ff 48%,#12a8e8);
    box-shadow:0 0 30px rgba(60,215,255,.55),0 8px 20px rgba(0,40,80,.5),inset 0 1px 0 rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,box-shadow .16s}
  .btn:active{transform:translateY(2px) scale(.985);box-shadow:0 0 20px rgba(60,215,255,.4)}
  .btn.ghost{background:linear-gradient(180deg,rgba(20,44,72,.9),rgba(8,16,30,.9));color:#bfefff;
    border:1px solid rgba(90,190,235,.4);box-shadow:none;font-size:clamp(12px,3.4vw,14px);height:clamp(36px,9vw,42px)}

  .keys{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;
    font-size:clamp(9.5px,2.6vw,11px);color:rgba(160,205,230,.7);font-weight:700;letter-spacing:.02em}
  .keys span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .keys i{font-style:normal;color:#9ff3ff}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800;
    letter-spacing:.06em;color:#ffe9a8;background:rgba(60,44,0,.55);border:1px solid rgba(255,205,90,.4)}

  /* game over */
  #over .logo{font-size:clamp(26px,8vw,44px);color:#ffe3e3;
    text-shadow:0 0 18px rgba(255,90,120,.9),0 0 46px rgba(255,60,60,.6),0 0 90px rgba(120,0,60,.6)}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%;max-width:340px}
  .st{padding:9px 8px;border-radius:12px;background:linear-gradient(170deg,rgba(16,32,52,.9),rgba(6,12,22,.86));
    border:1px solid rgba(80,160,220,.24);display:flex;flex-direction:column;gap:2px;align-items:center}
  .st em{font-style:normal;font-size:8.5px;font-weight:900;letter-spacing:.18em;color:rgba(140,195,225,.62)}
  .st b{font-size:clamp(18px,5.2vw,24px);font-weight:900;color:#eafcff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(90,230,255,.6)}
  .st.best b{color:#ffd45a;text-shadow:0 0 16px rgba(255,200,70,.75)}
  .newbest{font-size:10px;font-weight:900;letter-spacing:.1em;color:#ffd45a;
    animation:pulseGold 1.1s ease-in-out infinite}
  @keyframes pulseGold{0%,100%{opacity:.55}50%{opacity:1}}

  @media (max-height:520px){
    .logo{font-size:clamp(20px,5vw,30px)}
    .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
    #skins{gap:5px}
    .skin{padding:6px 7px}
    .card{gap:7px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div class="hleft">
      <div class="lenrow"><span id="len">0</span><span class="unit">LENGTH</span></div>
      <div class="statrow"><span>KILLS <b id="kills">0</b></span><span class="sep"></span><span>BEST <b id="best">0</b></span></div>
      <div id="buffs"></div>
    </div>
    <div class="hright">
      <div class="rankpanel">
        <div class="rt"><span>TOP 5</span><em id="crownTag">👑</em></div>
        <div id="rank"></div>
      </div>
      <div class="mmwrap"><canvas id="mm"></canvas></div>
    </div>
  </div>

  <div id="note"></div>
  <div id="stick"><div id="knob"></div></div>

  <button id="boostBtn" aria-label="부스트"><span>⚡</span><em>BOOST</em><div class="cd"></div></button>
  <button id="mute" aria-label="음소거">🔊</button>

  <div id="menu" class="overlay">
    <div class="card">
      <div class="logo"><span class="em">🐍</span> 네온 지렁이 키우기</div>
      <div class="sub">빛 구슬을 먹고 <b>몸을 키워</b> AI 지렁이 앞을 가로막아 잡으세요.<br>아레나에서 <b>가장 긴 지렁이</b>의 머리에 황금 왕관이 빛납니다.</div>
      <div class="skinlab">NEON SKIN</div>
      <div id="skins"></div>
      <button id="startBtn" class="btn">▶ 아레나 입장</button>
      <div class="keys">
        <span><i>📱</i> 드래그로 조종 · ⚡ 버튼 부스트</span>
        <span><i>🖱️</i> 마우스로 조종 · 클릭/스페이스 부스트</span>
      </div>
      <div class="tag">1등 왕관 👑 을 빼앗아 보세요</div>
    </div>
  </div>

  <div id="over" class="overlay hide">
    <div class="card">
      <div class="logo">GAME OVER</div>
      <div class="sub" id="overSub">아레나에서 밀려났습니다</div>
      <div class="stats">
        <div class="st"><em>FINAL LENGTH</em><b id="oLen">0</b></div>
        <div class="st"><em>KILLS</em><b id="oKills">0</b></div>
        <div class="st"><em>RANK</em><b id="oRank">-</b></div>
        <div class="st best"><em>BEST</em><b id="oBest">0</b></div>
      </div>
      <div class="newbest" id="oNew" style="display:none">★ NEW RECORD ★</div>
      <button id="againBtn" class="btn">↻ 다시 하기</button>
      <button id="skinBtn" class="btn ghost">🎨 스킨 바꾸기</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==================================================================
   0. utils
   ================================================================== */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(a+Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function angDiff(a,b){ var d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function hypot(x,y){ return Math.sqrt(x*x+y*y); }
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function mix(a,b,t){ return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))]; }
function dark(c,t){ return [Math.round(c[0]*t),Math.round(c[1]*t),Math.round(c[2]*t)]; }
function cssRgb(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
function cssHex(c){ return '#'+((1<<24)+(c[0]<<16)+(c[1]<<8)+c[2]).toString(16).slice(1); }

/* ==================================================================
   1. DOM
   ================================================================== */
function $(id){ return document.getElementById(id); }
var cv = $('cv');
var ctx = cv.getContext('2d', { alpha:false });
var mmc = $('mm');
var mctx = mmc.getContext('2d');
var elLen = $('len'), elKills = $('kills'), elBest = $('best');
var elRank = $('rank'), elBuffs = $('buffs'), elNote = $('note');
var elFlash = $('flash'), elStick = $('stick'), elKnob = $('knob');
var elBoost = $('boostBtn'), elMute = $('mute');
var elMenu = $('menu'), elOver = $('over');
var elSkins = $('skins'), elStart = $('startBtn'), elAgain = $('againBtn'), elSkinBtn = $('skinBtn');

/* ==================================================================
   2. skins / config
   ================================================================== */
var SKINS = [
  { id:'cyan',  name:'사이버 시안',   tag:'CYBER CYAN', a:[0,234,255],   b:[130,255,232], css:'#00eaff' },
  { id:'magma', name:'마그마 레드',   tag:'MAGMA RED',  a:[255,58,38],   b:[255,176,58],  css:'#ff3a26' },
  { id:'gold',  name:'일렉트릭 골드', tag:'ELECTRIC',   a:[255,206,64],  b:[255,243,176], css:'#ffce40' },
  { id:'prism', name:'갤럭시 프리즘', tag:'GALAXY',     a:[176,107,255], b:[255,122,217], css:'#b06bff' }
];
var AI_COLORS = [
  { a:[255,80,120], b:[255,190,200] },
  { a:[120,255,140], b:[220,255,190] },
  { a:[100,150,255], b:[190,230,255] },
  { a:[255,140,40],  b:[255,220,150] },
  { a:[200,120,255], b:[240,200,255] },
  { a:[60,255,220],  b:[200,255,245] },
  { a:[255,220,60],  b:[255,250,190] },
  { a:[255,90,220],  b:[255,200,245] }
];
var AI_NAMES = ['네온테일','바이퍼','글로우','픽셀','사이렌','제로','루멘','코브라','하이드라','오로라','미라주','톡식','스텔라','노바','레이저'];

var ARENA_R = 1380;
var NODE_RATIO = 0.62;
var BOOST_MIN_LEN = 20;
var AI_COUNT = 12;
var FOOD_TARGET = 540;
var MAX_LEN = 420;
var AI_LEN_CAP = 168;

var cfg = {
  baseSpeed: 208,
  boostMul: 2.02,
  hyperMul: 2.42,
  turn: 4.35,
  boostTurn: 3.45,
  boostDrain: 7.6,

var AC = null, MASTER = null, muted = false;
function audioInit(){
  if(AC) return;
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    AC = new C();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.42;
    MASTER.connect(AC.destination);
    if(AC.state === 'suspended' && AC.resume) AC.resume();
  }catch(e){ AC = null; }
}
function tone(f1,f2,dur,type,vol,when){
  if(!AC || muted) return;
  try{
    var t0 = AC.currentTime + (when||0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(24,f2), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.18, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(MASTER);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function noiseBurst(dur, vol, freq, type){
  if(!AC || muted) return;
  try{
    var n = Math.max(1, Math.floor(AC.sampleRate*dur));
    var buf = AC.createBuffer(1, n, AC.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2); }
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq || 1400; f.Q.value = 0.8;
    var g = AC.createGain(); g.gain.value = vol || 0.25;
    src.connect(f); f.connect(g); g.connect(MASTER);
    src.start(0);
  }catch(e){}
}
var lastEatSnd = 0;
var sfx = {
  eat: function(pitch){
    if(!AC || muted) return;
    var now = AC.currentTime;
    if(now - lastEatSnd < 0.045) return;
    lastEatSnd = now;
    tone(pitch*1.0, pitch*1.7, 0.085, 'sine', 0.11);
  },
  big: function(){

    tone(780, 1560, 0.12, 'sine', 0.09, 0.04);
  },
  boost: function(){
    noiseBurst(0.22, 0.13, 900, 'highpass');
    tone(160, 420, 0.24, 'sawtooth', 0.07);
  },
  kill: function(n){
    var base = 1 + (n-1)*0.16;
    noiseBurst(0.34, 0.3, 2200);
    tone(620*base, 120, 0.34, 'square', 0.12);
    tone(940*base, 220, 0.26, 'triangle', 0.09, 0.02);
  },
  power: function(){

  },
  hyper: function(){

/* ==================================================================
   5. spatial grid
   ================================================================== */
var CELL = 120;
var GB = ARENA_R + 700;
var GW = Math.ceil((GB*2)/CELL) + 1;
var grid = new Array(GW*GW);
for(var gi=0; gi<grid.length; gi++) grid[gi] = [];

function cidx(x,y){
  var ix = clamp(Math.floor((x+GB)/CELL), 0, GW-1);
  var iy = clamp(Math.floor((y+GB)/CELL), 0, GW-1);
  return iy*GW + ix;
}
function buildGrid(){
  for(var i=0;i<grid.length;i++){ if(grid[i].length) grid[i].length = 0; }
  for(var k=0;k<G.worms.length;k++){
    var w = G.worms[k];
    if(!w.alive) continue;
    var ns = w.nodes;
    for(var j=0;j<ns.length;j++){
      var n = ns[j];
      grid[cidx(n.x,n.y)].push(n);
    }
  }
}
function nearestNode(x,y,skipW,maxR){
  var best = 1e9, bn = null;
  var x0 = clamp(Math.floor((x-maxR+GB)/CELL),0,GW-1);
  var x1 = clamp(Math.floor((x+maxR+GB)/CELL),0,GW-1);
  var y0 = clamp(Math.floor((y-maxR+GB)/CELL),0,GW-1);
  var y1 = clamp(Math.floor((y+maxR+GB)/CELL),0,GW-1);
  for(var iy=y0; iy<=y1; iy++){
    var row = iy*GW;
    for(var ix=x0; ix<=x1; ix++){
      var arr = grid[row+ix];
      for(var k=0;k<arr.length;k++){
        var n = arr[k];
        if(n._w === skipW) continue;
        var dx = n.x-x, dy = n.y-y;
        var d = Math.sqrt(dx*dx+dy*dy) - n._w.r*1.0;
        if(d < best){ best = d; bn = n; }
      }
    }
  }
  return { d:best, n:bn };
}

/* ==================================================================
   6. worm factory
   ================================================================== */
function segRadius(len){ return 10.6 + Math.min(11.5, len*0.042); }

function makeWorm(opt){
  var w = {
    x: opt.x, y: opt.y, ang: opt.ang || rnd(0,TAU), aimA: 0,
    len: opt.len || 16, r: 0, nodes: [], alive: true,
    isPlayer: !!opt.isPlayer, name: opt.name || 'AI',
    c1: opt.c1, c2: opt.c2, phase: rnd(0,TAU), skinId: opt.skinId || null,
    boosting: false, wantBoost: false, kills: 0, thinkT: 0,
    target: null, blink: rnd(1.5,4.5), spawnT: G.time, dropT: 0,
    magnetT: 0, hyperT: 0,
    wob: rnd(0,TAU)
  };
  w.aimA = w.ang;
  w.r = segRadius(w.len);
  var n = Math.max(6, Math.round(w.len));
  for(var i=0;i<n;i++){
    var px = w.x - Math.cos(w.ang)*i*w.r*NODE_RATIO;
    var py = w.y - Math.sin(w.ang)*i*w.r*NODE_RATIO;
    w.nodes.push({ x:px, y:py, _w:w });
  }
  return w;
}

function freeSpot(minDist){
  var bestP = { x:0, y:0 }, bestD = -1;
  for(var attempt=0; attempt<40; attempt++){
    var a = rnd(0,TAU), rr = rnd(160, ARENA_R*0.82);
    var x = Math.cos(a)*rr, y = Math.sin(a)*rr;
    var nn = nearestNode(x, y, null, 420);
    var d = nn.n ? nn.d : 999;
    if(d > minDist) return { x:x, y:y };
    if(d > bestD){ bestD = d; bestP = { x:x, y:y }; }
  }
  return bestP;
}

/* ==================================================================
   7. food & powerups
   ================================================================== */
var FOOD_HUES = [180, 195, 210, 285, 320, 150, 45, 0, 260];

function makeOrb(x, y, opt){
  opt = opt || {};
  var big = !!opt.big;
  var v = opt.v || (big ? 3.4 : 1);
  var hue = opt.hue != null ? opt.hue : pick(FOOD_HUES);
  var r = opt.r || (big ? rnd(7.5,12) : rnd(4.2,6.4));
  return {
    x:x, y:y, r:r, big:big, v:v, hue:hue, life: big ? 0 : -1,
    age: 0, ph: rnd(0,TAU), vx:0, vy:0, spin: rnd(0,TAU)
  };
}
function hueRgb(h, s, l){
  var c = 0.5;
  s = s==null?1:s; l = l==null?0.62:l;
  var r,g,b;
  function f(n){
    var k = (n + h/30) % 12;
    var a = s*Math.min(l,1-l);
    return l - a*Math.max(-1, Math.min(Math.min(k-3, 9-k), 1));
  }
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}

function seedFood(count){
  for(var i=0;i<count;i++){
    var a = rnd(0,TAU), rr = Math.sqrt(Math.random())*ARENA_R*0.95;
    G.orbs.push(makeOrb(Math.cos(a)*rr, Math.sin(a)*rr, {}));
  }
}
function respawnOrb(){
  var a = rnd(0,TAU), rr = Math.sqrt(Math.random())*ARENA_R*0.95;
  return makeOrb(Math.cos(a)*rr, Math.sin(a)*rr, {});
}

function spawnPower(){
  var p = freeSpot(220);
  var type = Math.random() < 0.52 ? 'magnet' : 'hyper';
  G.pows.push({ x:p.x, y:p.y, type:type, life: 26, age: 0, ph: rnd(0,TAU) });
}

var MAX_PARTS = 760;
function burst(x, y, col, n, speed, opt){
  opt = opt || {};

      r: rnd(1.6,4.4)*(opt.size||1), g: opt.g!=null?opt.g:18, drag: opt.drag||2.4
    });

var input = {
  mode: 'none',
  aim: 0,
  mouseX: 0, mouseY: 0,
  mouseIn: false,
  stickOn: false,
  stickId: null,
  ox: 0, oy: 0, sx: 0, sy: 0,
  boostTouch: false,
  boostMouse: false,
  boostKey: false,
  steer: null
};

function setAimAngle(a, from){
  input.aim = a;
  input.steer = from || 'pointer';
  if(G.player) G.player.aimA = a;
}

function pointerPos(e){
  var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left:0, top:0 };
  return { x: e.clientX - (r.left||0), y: e.clientY - (r.top||0) };
}

function onDown(e, isTouchLike){
  audioInit();
  if(G.phase === 'menu') return;
  var p = pointerPos(e);
  if(G.phase === 'dead') return;
  if(G.phase === 'play'){
    if(isTouchLike){
      if(input.stickId !== null) return;
      input.stickId = e.pointerId != null ? e.pointerId : 1;
      input.stickOn = true;
      input.ox = p.x; input.oy = p.y;
      input.sx = p.x; input.sy = p.y;
      elStick.classList.add('on');
      elStick.style.left = p.x + 'px';
      elStick.style.top = p.y + 'px';
      elKnob.style.transform = 'translate(0,0)';
      input.mode = 'touch';
    } else {
      input.boostMouse = true;
    }
  }
}
function onMove(e, isTouchLike){
  var p = pointerPos(e);
  if(isTouchLike){
    if(!input.stickOn) return;
    if(input.stickId !== null && e.pointerId != null && e.pointerId !== input.stickId) return;
    var dx = p.x - input.ox, dy = p.y - input.oy;
    var d = hypot(dx,dy);
    var maxR = 52;
    var k = d > maxR ? maxR/d : 1;
    elKnob.style.transform = 'translate(' + (dx*k).toFixed(1) + 'px,' + (dy*k).toFixed(1) + 'px)';
    if(d > 14) setAimAngle(Math.atan2(dy,dx), 'stick');
    input.stickMag = d;
  } else {
    input.mouseX = p.x; input.mouseY = p.y; input.mouseIn = true;
    input.mode = 'mouse';
  }
}
function onUp(e, isTouchLike){
  if(isTouchLike){
    input.stickOn = false;
    input.stickId = null;
    elStick.classList.remove('on');
    input.stickMag = 0;
  } else {
    input.boostMouse = false;
  }
}

function bindInput(){
  var pm = window.PointerEvent;
  if(pm){
    cv.addEventListener('pointerdown', function(e){
      var touchLike = (e.pointerType === 'touch' || e.pointerType === 'pen');
      if(touchLike){ e.preventDefault(); }
      onDown(e, touchLike);
    }, { passive:false });
    window.addEventListener('pointermove', function(e){
      var touchLike = (e.pointerType === 'touch' || e.pointerType === 'pen');
      onMove(e, touchLike);
    }, { passive:false });
    window.addEventListener('pointerup', function(e){
      var touchLike = (e.pointerType === 'touch' || e.pointerType === 'pen');
      onUp(e, touchLike);
    }, { passive:false });
    window.addEventListener('pointercancel', function(e){
      var touchLike = (e.pointerType === 'touch' || e.pointerType === 'pen');
      onUp(e, touchLike);
    }, { passive:true });
  } else {
    cv.addEventListener('mousedown', function(e){ onDown(e,false); });
    window.addEventListener('mousemove', function(e){ onMove(e,false); });
    window.addEventListener('mouseup', function(e){ onUp(e,false); });
    cv.addEventListener('touchstart', function(e){
      e.preventDefault();
      var t = e.touches[0]; if(t) onDown({ clientX:t.clientX, clientY:t.clientY, pointerId:t.identifier }, true);
    }, { passive:false });
    window.addEventListener('touchmove', function(e){
      var t = e.touches[0]; if(t) onMove({ clientX:t.clientX, clientY:t.clientY, pointerId:t.identifier }, true);
    }, { passive:false });
    window.addEventListener('touchend', function(e){ onUp(e,true); }, { passive:true });
  }

  window.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Spacebar' || e.key === 'Shift'){ input.boostKey = true; e.preventDefault(); }
    if(e.key === 'Enter' && (G.phase === 'menu' || G.phase === 'dead')) startGame();
  });
  window.addEventListener('keyup', function(e){
    if(e.key === ' ' || e.key === 'Spacebar' || e.key === 'Shift') input.boostKey = false;
  });

  function boostOn(e){
    e.preventDefault();
    audioInit();
    input.boostTouch = true;
    elBoost.classList.add('down');
    if(!G.firstTouch){ G.firstTouch = true; }
  }
  function boostOff(){ input.boostTouch = false; elBoost.classList.remove('down'); }
  elBoost.addEventListener('pointerdown', boostOn, { passive:false });
  elBoost.addEventListener('pointerup', boostOff);
  elBoost.addEventListener('pointercancel', boostOff);
  elBoost.addEventListener('pointerleave', boostOff);
  elBoost.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  elMute.addEventListener('click', function(){
    muted = !muted;
    if(MASTER) MASTER.gain.value = muted ? 0 : 0.42;
    elMute.textContent = muted ? '🔇' : '🔊';
    if(!muted) audioInit();
  });

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('gesturestart', function(e){ e.preventDefault(); });
}

function baseScale(){
  var mn = Math.min(W, H);
  return clamp(mn/640, 0.58, 1.18);
}
function camTarget(w){
  var len = w ? w.len : 30;
  var shrink = clamp(1 - (len - 14)*0.0028, 0.60, 1);
  return baseScale()*shrink;
}

function resetArena(){
  G.worms.length = 0;
  G.orbs.length = 0;
  G.pows.length = 0;
  G.parts.length = 0;
  G.floats.length = 0;
  G.respawns.length = 0;
  G.kills = 0;
  G.combo = 0; G.comboT = 0;
  G.player = null;
  G.deathPos = null;
  G.overShown = false;
  seedFood(FOOD_TARGET);
  for(var i=0;i<AI_COUNT;i++) addAI(i===0);
  for(var p=0;p<2;p++) spawnPower();
}

function addAI(initial){
  var spot = freeSpot(260);
  var col = pick(AI_COLORS);
  var nm = pick(AI_NAMES) + (Math.random()<0.4 ? rndi(2,99) : '');
  var w = makeWorm({
    x: spot.x, y: spot.y, ang: rnd(0,TAU),
    len: initial ? rnd(18,46) : rnd(14,22),
    c1: col.a, c2: col.b, name: nm
  });
  G.worms.push(w);
  return w;
}

function spawnPlayer(){
  var skin = SKINS[G.skinIdx];
  var a0 = rnd(0, TAU), r0 = rnd(0, ARENA_R*0.42);
  var spot = { x: Math.cos(a0)*r0, y: Math.sin(a0)*r0 };
  if(nearestNode(spot.x, spot.y, null, 400).d < 120){
    spot = freeSpot(160);
  }
  // player spawn heading points to the arena centre
  var headAng = Math.atan2(-spot.y, -spot.x) + rnd(-0.5, 0.5);
  var w = makeWorm({
    x: spot.x, y: spot.y, ang: headAng, len: 17,
    isPlayer: true, name: '나', c1: skin.a, c2: skin.b, skinId: skin.id
  });
  G.player = w;
  G.worms.push(w);
  G.cam.x = w.x; G.cam.y = w.y;
  G.cam.scale = camTarget(w);
  return w;
}

function startGame(){
  audioInit();
  G.phase = 'play';
  G.time = 0;
  G.hudT = 0;
  elMenu.classList.add('hide');
  elOver.classList.add('hide');
  resetArena();
  spawnPlayer();
  input.stickOn = false;
  elStick.classList.remove('on');
  updateHud(true);
}

function showOver(){
  if(G.overShown) return;
  G.overShown = true;
  var p = G.player;
  var finalLen = p ? Math.round(p.len) : 0;
  var rank = 1;
  for(var i=0;i<G.worms.length;i++){
    if(G.worms[i].alive && G.worms[i] !== p && G.worms[i].len > finalLen) rank++;
  }
  $('oLen').textContent = finalLen;
  $('oKills').textContent = G.kills;
  $('oRank').textContent = rank + ' / ' + (AI_COUNT+1);
  var isNew = finalLen > G.best;
  if(isNew){ G.best = finalLen; saveBest(G.best); }
  $('oBest').textContent = G.best;
  $('oNew').style.display = isNew && finalLen > 20 ? 'block' : 'none';
  $('overSub').textContent = G.deathCause === 'wall'
    ? '아레나 경계에 부딪혔습니다'
    : (G.deathCause === 'ai' ? 'AI 지렁이 몸통에 부딪혔습니다' : '아레나에서 밀려났습니다');
  elOver.classList.remove('hide');
  G.phase = 'dead';
}

function killPlayer(cause){
  var w = G.player;
  if(!w || !w.alive) return;
  w.alive = false;
  G.deathCause = cause;
  explode(w, null);
  G.cam.shake = 26;
  elFlash.classList.remove('kill'); elFlash.classList.add('hit');
  sfx.death();
  setTimeout(function(){ elFlash.classList.remove('hit'); }, 500);
  setTimeout(showOver, 900);
}

function killWorm(w, by){
  if(!w.alive) return;
  w.alive = false;
  var byPlayer = !!(by && by.isPlayer);
  explode(w, by);
  if(byPlayer){
    onPlayerKill(w);
  }
}

function onPlayerKill(w){
  G.kills++;
  G.comboT = 3.2;
  G.combo++;
  var n = G.combo;
  var txt;
  if(n === 1) txt = '+ KILL!';
  else if(n === 2) txt = 'DOUBLE KILL!';
  else if(n === 3) txt = 'TRIPLE KILL!';
  else txt = 'MEGA KILL ×' + n;
  showNote(txt, n > 1);
  G.cam.shake = n > 1 ? 20 + n*3 : 13;
  G.flashT = 0.32;
  elFlash.classList.remove('hit');
  elFlash.classList.add('kill');
  setTimeout(function(){ elFlash.classList.remove('kill'); }, 460);
  sfx.kill(n);
  G.floats.push({ x:w.x, y:w.y - 20, vy:-46, life:1.1, maxLife:1.1, t:'+1 KILL', c:[255,225,140], size:22 });
  updateHud(true);
}

function explode(w, by){
  // corpse economy: total dropped value ~ 0.6x the worm's length (prevents runaway inflation)
  var v = 0.8 + Math.min(1.5, w.len*0.006);
  var N = Math.round((w.len*0.6) / (1.21*v));
  N = Math.max(8, Math.min(44, N));
  var col = w.c1;
  for(var i=0;i<N;i++){
    var a = rnd(0,TAU), rr = Math.random()*Math.max(w.r*2, 18);
    var o = makeOrb(w.x+Math.cos(a)*rr, w.y+Math.sin(a)*rr, { big:true, v: v, hue: rnd(0,360) });
    o.vx = Math.cos(a)*rnd(30,120);
    o.vy = Math.sin(a)*rnd(30,120);
    G.orbs.push(o);
    if(G.orbs.length > 1000){ G.orbs.shift(); }
  }
  burst(w.x, w.y, col, 46, 420, { size:1.5, life:1.4 });
  burst(w.x, w.y, [255,240,190], 22, 260, { size:1.1, life:1.0 });

}

   12. update: worms
   ================================================================== */
function headRadius(w){ return w.r*1.12; }

function reconcileNodes(w){
  var want = Math.max(6, Math.round(w.len));
  if(want > MAX_LEN) want = MAX_LEN;
  while(w.nodes.length < want){
    var last = w.nodes[w.nodes.length-1];
    w.nodes.push({ x:last.x, y:last.y, _w:w });
  }
  while(w.nodes.length > want && w.nodes.length > 6){
    w.nodes.pop();
  }
}

function moveWorm(w, dt, hyper){
  var lenFactor = 1 - Math.min(0.16, w.len*0.00055);
  var sp = cfg.baseSpeed * lenFactor;
  if(w.hyperT > 0) sp *= cfg.hyperMul;
  else if(w.boosting) sp *= cfg.boostMul;
  var turn = w.boosting || w.hyperT > 0 ? cfg.boostTurn : cfg.turn;

  var d = angDiff(w.aimA, w.ang);
  var step = turn*dt;
  if(d > step) d = step; else if(d < -step) d = -step;
  w.ang += d;

  var nx = w.x + Math.cos(w.ang)*sp*dt;
  var ny = w.y + Math.sin(w.ang)*sp*dt;
  w.x = nx; w.y = ny;
  w.nodes[0].x = nx; w.nodes[0].y = ny;
  w._speed = sp;

  var spacing = w.r*NODE_RATIO;
  var prev = w.nodes[0];
  for(var i=1;i<w.nodes.length;i++){
    var n = w.nodes[i];
    var dx = prev.x - n.x, dy = prev.y - n.y;
    var dd = Math.sqrt(dx*dx+dy*dy);
    if(dd > spacing){
      var t = (dd-spacing)/dd;
      n.x += dx*t; n.y += dy*t;
    }
    prev = n;
  }

  // boost drain / hyper timer
  if(w.hyperT > 0){
    w.hyperT -= dt;
    if(w.hyperT <= 0){ w.hyperT = 0; endHyper(w); }
  }
  if(w.boosting && w.hyperT <= 0){
    if(w.len > BOOST_MIN_LEN){
      w.len -= cfg.boostDrain*dt;
      w.dropT -= dt;
      if(w.dropT <= 0){
        w.dropT = cfg.boostDropInt;
        var tail = w.nodes[w.nodes.length-1];
        var o = makeOrb(tail.x + rnd(-4,4), tail.y + rnd(-4,4), {
          big:false, v:0.55, r: rnd(3.6,4.8),
          hue: w.isPlayer ? 45 : 300
        });
        o.vx = rnd(-40,40); o.vy = rnd(-40,40);
        G.orbs.push(o);
      }
    } else {
      w.boosting = false;
    }
  }
  reconcileNodes(w);
  w.len = clamp(w.len, 10, MAX_LEN);

  // nose sparkle
  if(w.boosting || w.hyperT > 0){
    var col = w.hyperT > 0 ? hueRgb((G.time*420 + w.phase*60)%360, 1, 0.66) : mix(w.c1, [255,255,255], 0.35);
    trailPuff(w.x - Math.cos(w.ang)*w.r, w.y - Math.sin(w.ang)*w.r, col);
  }
}

function endHyper(w){
  if(w.isPlayer){
    G.floats.push({ x:w.x, y:w.y-24, vy:-40, life:0.8, maxLife:0.8, t:'HYPER END', c:[220,200,255], size:16 });
  }
}

function playerBoostState(w){
  var want = input.boostTouch || input.boostMouse || input.boostKey || (input.stickOn && input.stickMag > 74);
  if(w.hyperT > 0) return true;
  return !!(want && w.len > BOOST_MIN_LEN);
}

function updatePlayer(dt){
  var w = G.player;
  if(!w || !w.alive) return;

  // aim from mouse (screen -> world)
  if(input.mode === 'mouse' && input.mouseIn){
    var wx = G.cam.x + (input.mouseX - W/2)/G.cam.scale;
    var wy = G.cam.y + (input.mouseY - H/2)/G.cam.scale;
    var dx = wx - w.x, dy = wy - w.y;
    if(hypot(dx,dy) > 10) w.aimA = Math.atan2(dy,dx);
  }

  var wasBoosting = w.boosting;
  w.boosting = playerBoostState(w);
  if(w.boosting && !wasBoosting && w.hyperT <= 0) sfx.boost();

  // power timers
  if(w.magnetT > 0){ w.magnetT -= dt; if(w.magnetT < 0) w.magnetT = 0; }
  moveWorm(w, dt, w.hyperT > 0);
}

/* ---------------- AI ---------------- */
var STEER_OFFS = [0, -0.16, 0.16, -0.34, 0.34, -0.58, 0.58, -0.9, 0.9, -1.35, 1.35, -1.9, 1.9];

function aiThink(w){
  // --- target food ---
  var bestS = -1e9, tx = null, ty = null;
  var scanR = 900;
  for(var i=0;i<G.orbs.length;i++){
    var f = G.orbs[i];
    var dx = f.x - w.x, dy = f.y - w.y;
    if(dx > scanR || dx < -scanR || dy > scanR || dy < -scanR) continue;
    var d2 = dx*dx + dy*dy;
    if(d2 > scanR*scanR) continue;
    var s = (f.big ? (f.v*24) : (f.v*3.4)) / (Math.sqrt(d2) + 80);
    if(s > bestS){ bestS = s; tx = f.x; ty = f.y; }
  }
  // --- maybe hunt a powerup ---
  for(var pi=0; pi<G.pows.length; pi++){
    var pw = G.pows[pi];
    var pdx = pw.x - w.x, pdy = pw.y - w.y;
    var pd = hypot(pdx,pdy);
    if(pd < 420){
      var ps = 260/(pd+60);
      if(ps > bestS){ bestS = ps; tx = pw.x; ty = pw.y; }
    }
  }
  w.target = (tx === null) ? null : { x:tx, y:ty };

  var tAng = (tx === null) ? w.ang : Math.atan2(ty - w.y, tx - w.x);

  // --- steering with danger probes ---
  var bestA = w.ang, bestScore = -1e9;
  var look = 74 + w.r*3.2;
  for(var k=0;k<STEER_OFFS.length;k++){
    var a = w.ang + STEER_OFFS[k];
    var sc = -Math.abs(STEER_OFFS[k])*0.42;
    if(tx !== null) sc += Math.cos(a - tAng)*1.25;
    var danger = 0;
    for(var p=0;p<2;p++){
      var dist = look*(p===0?0.72:1.45);
      var px = w.x + Math.cos(a)*dist, py = w.y + Math.sin(a)*dist;
      var nr = nearestNode(px, py, w, 150);
      if(nr.n){
        var g = clamp(1 - nr.d/130, 0, 1);
        danger += g*g*(p===0?1.0:0.55);
      }
      var rad = hypot(px,py);
      if(rad > ARENA_R - 110) danger += (rad-(ARENA_R-110))/110 * 1.4;
    }
    sc -= danger*3.4;
    if(sc > bestScore){ bestScore = sc; bestA = a; }
  }
  w.aimA = bestA;

  // --- boost decision ---
  var tdist = (tx === null) ? 0 : hypot(tx-w.x, ty-w.y);
  if(w.len > 30 && tdist > 320 && w.hyperT <= 0){
    w.wantBoost = Math.random() < 0.32;
  } else {
    w.wantBoost = false;
  }
}

function updateAI(w, dt){
  w.thinkT -= dt;
  if(w.thinkT <= 0){
    w.thinkT = rnd(0.12, 0.26);
    aiThink(w);
    w.boosting = !!w.wantBoost && w.len > 24 && w.hyperT <= 0;
  }
  moveWorm(w, dt, false);
}

function eatCheck(){
  var n = G.orbs.length;
  for(var wi=0; wi<G.worms.length; wi++){
    var w = G.worms[wi];
    if(!w.alive) continue;
    var hr = headRadius(w);
    var reach = hr + 12;
    for(var i=n-1; i>=0; i--){
      var f = G.orbs[i];
      var dx = f.x - w.x, dy = f.y - w.y;
      if(dx > reach || dx < -reach || dy > reach || dy < -reach) continue;
      var rr = reach + f.r;
      if(dx*dx + dy*dy < rr*rr){
        // eat
        G.orbs.splice(i,1);
        var gain = (f.big ? f.v*1.55 : f.v) * cfg.growOrb;
        if(!w.isPlayer && w.len + gain > AI_LEN_CAP){ gain = Math.max(0, AI_LEN_CAP - w.len); }
        w.len = Math.min(MAX_LEN, w.len + gain);
        if(w.isPlayer){
          G.lastLen = w.len;
          if(f.big){ sfx.big(); burst(f.x, f.y, hueRgb(f.hue,1,0.65), 12, 200, {size:0.9, life:0.8}); }
          else sfx.eat(560 + Math.min(560, w.len*2.2));
          G.floats.push({ x:f.x, y:f.y, vy:-34, life:0.55, maxLife:0.55, t:'+'+(f.big?3:1), c:hueRgb(f.hue,1,0.75), size:14 });
        }
        n = G.orbs.length;
        if(!f.big) G.orbs.push(respawnOrb());
      }
    }
  }
}

function magnetPull(dt){
  var w = G.player;
  if(!w || !w.alive || !(w.magnetT > 0)) return;
  var pullR = 300, sp = 520;
  for(var i=0;i<G.orbs.length;i++){
    var f = G.orbs[i];
    var dx = w.x - f.x, dy = w.y - f.y;
    var d2 = dx*dx + dy*dy;
    if(d2 > pullR*pullR || d2 < 1) continue;
    var d = Math.sqrt(d2);
    var k = (1 - d/pullR)*sp*dt;
    f.x += dx/d*k; f.y += dy/d*k;
  }
}

function powerCheck(){
  var w = G.player;
  if(!w || !w.alive) return;
  for(var i=G.pows.length-1;i>=0;i--){
    var p = G.pows[i];
    var d = hypot(p.x-w.x, p.y-w.y);
    if(d < headRadius(w) + 26){
      G.pows.splice(i,1);
      if(p.type === 'magnet'){
        w.magnetT = 5;
        G.floats.push({ x:w.x, y:w.y-26, vy:-46, life:1.0, maxLife:1.0, t:'🧲 자석!', c:[120,235,255], size:20 });
        sfx.power();
      } else {
        w.hyperT = 4;
        w.boosting = false;
        G.floats.push({ x:w.x, y:w.y-26, vy:-46, life:1.0, maxLife:1.0, t:'⚡ 하이퍼!', c:[255,200,110], size:20 });
        sfx.hyper();
      }
      burst(p.x, p.y, p.type==='magnet' ? [90,220,255] : [255,190,80], 26, 260, {size:1.15});
    }
  }
}

function collideCheck(){
  for(var i=0;i<G.worms.length;i++){
    var w = G.worms[i];
    if(!w.alive) continue;
    var hr = headRadius(w);
    // body hit
    var nr = nearestNode(w.x, w.y, w, 300);
    if(nr.n && nr.d < hr*0.5){
      if(w.isPlayer) killPlayer('ai');
      else killWorm(w, nr.n._w);
      continue;
    }
    // wall hit
    var rad = hypot(w.x, w.y);
    if(rad > ARENA_R - w.r*0.55){
      if(w.isPlayer) killPlayer('wall');
      else killWorm(w, null);
      continue;
    }
  }
}

function updateParticles(dt){
  var ps = G.parts;
  for(var i=ps.length-1;i>=0;i--){
    var p = ps[i];
    p.life -= dt;
    if(p.life <= 0){ ps.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.g){ p.vy += p.g*dt; }
    var dr = 1 - p.drag*dt;
    if(dr > 0){ p.vx *= dr; p.vy *= dr; }
  }
  var fl = G.floats;
  for(var j=fl.length-1;j>=0;j--){
    var f = fl[j];
    f.life -= dt;
    if(f.life <= 0){ fl.splice(j,1); continue; }
    f.y += f.vy*dt;
    f.vy *= 1 - 1.6*dt;
  }
}

function updatePowerups(dt){
  for(var i=G.pows.length-1;i>=0;i--){
    var p = G.pows[i];
    p.age += dt;
    p.life -= dt;
    if(p.life <= 0) G.pows.splice(i,1);
  }
  if(G.pows.length < 2 && Math.random() < dt*0.42){
    spawnPower();
  }
}

function countAi(){
  var n = 0;
  for(var i=0;i<G.worms.length;i++){ if(G.worms[i].alive && !G.worms[i].isPlayer) n++; }
  return n;
}

function updateRespawns(dt){
  for(var i=G.respawns.length-1;i>=0;i--){
    G.respawns[i].t -= dt;
    if(G.respawns[i].t <= 0){
      G.respawns.splice(i,1);
      if(countAi() < AI_COUNT) addAI(false);
    }
  }
  // keeper: always keep the arena populated
  G.aiTopT = (G.aiTopT || 0) - dt;
  if(G.aiTopT <= 0){
    G.aiTopT = 1.1;
    var alive = countAi();
    if(alive + G.respawns.length < AI_COUNT) addAI(false);
  }
  // cull dead worms
  for(var j=G.worms.length-1;j>=0;j--){
    var w = G.worms[j];
    if(!w.alive && !w.isPlayer){
      G.worms.splice(j,1);
      G.respawns.push({ t: rnd(1.4, 3.0) });
    }
  }
  // keep orb count near target
  if(G.orbs.length < FOOD_TARGET){
    var need = Math.min(6, FOOD_TARGET - G.orbs.length);
    for(var m=0;m<need;m++) G.orbs.push(respawnOrb());
  }
}

function updateWorld(dt){
  G.time += dt;

  buildGrid();
  if(G.player && G.player.alive){
    updatePlayer(dt);
  }
  for(var i=0;i<G.worms.length;i++){
    var w = G.worms[i];
    if(!w.alive || w.isPlayer) continue;
    updateAI(w, dt);
  }
  buildGrid();
  eatCheck();
  magnetPull(dt);
  powerCheck();
  collideCheck();
  updateParticles(dt);
  updatePowerups(dt);
  updateRespawns(dt);

  if(G.comboT > 0){
    G.comboT -= dt;
    if(G.comboT <= 0){ G.combo = 0; G.comboT = 0; }
  }
  if(G.cam.shake > 0){
    G.cam.shake = Math.max(0, G.cam.shake - cfg.shakeDecay*dt*6.5);
  }
  if(G.flashT > 0) G.flashT -= dt;
}

function updateCamera(dt){
  var c = G.cam;
  var tgt = G.player && G.player.alive ? G.player : null;
  if(tgt){
    var lead = 0.28;
    var fx = tgt.x + Math.cos(tgt.ang)*Math.min(140, tgt._speed*lead);
    var fy = tgt.y + Math.sin(tgt.ang)*Math.min(140, tgt._speed*lead);
    var k = 1 - Math.exp(-7.5*dt);
    c.x = lerp(c.x, fx, k);
    c.y = lerp(c.y, fy, k);
    c.scale = lerp(c.scale, camTarget(tgt), 1 - Math.exp(-2.6*dt));
  } else {
    // menu / dead: slow orbit
    c.orbit += dt*0.11;
    var rr = Math.min(560, ARENA_R*0.42);
    c.x = lerp(c.x, Math.cos(c.orbit)*rr, 1 - Math.exp(-2*dt));
    c.y = lerp(c.y, Math.sin(c.orbit*0.86)*rr*0.8, 1 - Math.exp(-2*dt));
    c.scale = lerp(c.scale, baseScale()*0.98, 1 - Math.exp(-2*dt));
  }
}

var STAR_LAYERS = [];
function initStars(){
  var depths = [0.28, 0.52, 0.78];
  var counts = [150, 110, 80];
  for(var L=0; L<3; L++){
    var arr = [];
    for(var i=0;i<counts[L];i++){
      arr.push({
        x: rnd(-2900,2900), y: rnd(-2900,2900),
        r: rnd(0.6, L===0?1.8:2.6), a: rnd(0.18, 0.7),
        hue: pick([195, 210, 285, 320, 45, 180])
      });
    }
    STAR_LAYERS.push({ d: depths[L], stars: arr });
  }
}

var NEBULAS = [];
function initNebulas(){
  for(var i=0;i<5;i++){
    NEBULAS.push({ x: rnd(-1500,1500), y: rnd(-1500,1500), r: rnd(500,1100),
      hue: pick([200, 280, 320, 165]), a: rnd(0.035, 0.075) });
  }
}

function drawBack(cam, cx, cy){
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.78);
  g.addColorStop(0, '#0a1730');
  g.addColorStop(0.45, '#060c1c');
  g.addColorStop(1, '#03050c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(cam, cx, cy, sc, ox, oy, t){
  ctx.globalCompositeOperation = 'lighter';
  for(var L=0; L<STAR_LAYERS.length; L++){
    var lay = STAR_LAYERS[L];
    var d = lay.d;
    var halfW = W/sc/2 + 120, halfH = H/sc/2 + 120;
    var ccx = cam.x*d, ccy = cam.y*d;
    for(var i=0;i<lay.stars.length;i++){
      var s = lay.stars[i];
      var wx = s.x - ccx*0.16, wy = s.y - ccy*0.16;
      if(wx < -halfW || wx > halfW || wy < -halfH || wy > halfH) continue;
      var sx = cx + (wx - ccx*(1-d*0.16))*sc;
      var sy = cy + (wy - ccy*(1-d*0.16))*sc;
      var tw = 0.72 + 0.28*Math.sin(t*1.7 + s.x*0.01 + s.y*0.013);
      ctx.fillStyle = 'hsla(' + s.hue + ',100%,72%,' + (s.a*tw).toFixed(3) + ')';
      var rr = s.r*sc*1.5;
      ctx.beginPath(); ctx.arc(sx, sy, rr, 0, TAU); ctx.fill();
    }
  }
  // nebula blooms (parallax ~0.4)
  for(var n=0;n<NEBULAS.length;n++){
    var nb = NEBULAS[n];
    var nx = cx + (nb.x - cam.x*0.4)*sc;
    var ny = cy + (nb.y - cam.y*0.4)*sc;
    var nr = nb.r*sc;
    if(nx < -nr || nx > W+nr || ny < -nr || ny > H+nr) continue;
    var gg = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
    gg.addColorStop(0, 'hsla(' + nb.hue + ',95%,60%,' + nb.a + ')');
    gg.addColorStop(1, 'hsla(' + nb.hue + ',95%,50%,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(nx, ny, nr, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawArenaFloor(t){
  // floor disc
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, ARENA_R);
  g.addColorStop(0, 'rgba(10,28,56,0.98)');
  g.addColorStop(0.55, 'rgba(6,16,34,0.98)');
  g.addColorStop(1, 'rgba(3,8,18,0.99)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.fill();

  // hex-ish grid, clipped
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R-2, 0, TAU); ctx.clip();
  ctx.lineWidth = 1;
  var gs = 150, ext = ARENA_R*1.05;
  for(var pass=0; pass<3; pass++){
    ctx.save();
    ctx.rotate(pass*Math.PI/3);
    ctx.strokeStyle = pass === 0 ? 'rgba(70,165,240,0.13)' : 'rgba(60,145,220,0.085)';
    ctx.beginPath();
    for(var y=-ext; y<=ext; y+=gs){
      ctx.moveTo(-ext, y);
      ctx.lineTo(ext, y);
    }
    ctx.stroke();
    ctx.restore();
  }
  // distance rings
  ctx.strokeStyle = 'rgba(70,170,240,0.07)';
  for(var ring=1; ring<=4; ring++){
    ctx.beginPath(); ctx.arc(0, 0, ARENA_R*ring/4.4, 0, TAU); ctx.stroke();
  }
  // slow sweeping radar line
  var sa = t*0.34;
  var sg = ctx.createLinearGradient(0, 0, Math.cos(sa)*ARENA_R, Math.sin(sa)*ARENA_R);
  sg.addColorStop(0, 'rgba(90,220,255,0.10)');
  sg.addColorStop(1, 'rgba(90,220,255,0)');
  ctx.strokeStyle = sg; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(sa)*ARENA_R, Math.sin(sa)*ARENA_R); ctx.stroke();
  ctx.restore();

  // arena border
  ctx.globalCompositeOperation = 'lighter';
  var pulse = 0.55 + 0.45*Math.sin(t*1.5);
  ctx.strokeStyle = 'rgba(255,70,110,' + (0.05 + pulse*0.035).toFixed(3) + ')';
  ctx.lineWidth = 60;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,90,130,0.20)';
  ctx.lineWidth = 22;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,150,175,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.stroke();

  // danger dashed ring
  ctx.strokeStyle = 'rgba(255,80,110,' + (0.22 + pulse*0.2).toFixed(3) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([24, 22]);
  ctx.lineDashOffset = -t*40;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R-64, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = 'source-over';
}

function drawOrbs(t){
  var x0 = view.x0, x1 = view.x1, y0 = view.y0, y1 = view.y1;
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<G.orbs.length;i++){
    var f = G.orbs[i];
    if(f.x < x0 || f.x > x1 || f.y < y0 || f.y > y1) continue;
    var pulse = 0.82 + 0.18*Math.sin(t*3.4 + f.ph);
    var r = f.r*pulse;
    var c = hueRgb((f.hue + (f.big ? t*30 : 0)) % 360, 1, f.big ? 0.72 : 0.66);
    if(f.big){
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.17)';
      ctx.beginPath(); ctx.arc(f.x, f.y, r*3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.5)';
      ctx.beginPath(); ctx.arc(f.x, f.y, r*1.5, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.2)';
      ctx.beginPath(); ctx.arc(f.x, f.y, r*2.3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.98)';
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(f.x - r*0.22, f.y - r*0.24, r*0.4, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawPowIcon(cx, cy, type, t, scale){
  var s = scale || 1;
  if(type === 'magnet'){
    var col = [90, 215, 255];
    ctx.strokeStyle = rgba(col, 0.95);
    ctx.lineWidth = 8*s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, 12*s, Math.PI*0.05, Math.PI*0.95, false);
    ctx.stroke();
    ctx.strokeStyle = rgba([255,255,255], 0.9);
    ctx.lineWidth = 4*s;
    ctx.beginPath();
    ctx.moveTo(cx-12*s, cy+2*s); ctx.lineTo(cx-12*s, cy+9*s);
    ctx.moveTo(cx+12*s, cy+2*s); ctx.lineTo(cx+12*s, cy+9*s);
    ctx.stroke();
  } else {
    var c2 = [255,205,80];
    ctx.fillStyle = rgba(c2, 0.96);
    ctx.beginPath();
    ctx.moveTo(cx+5*s, cy-16*s);
    ctx.lineTo(cx-9*s, cy+2*s);
    ctx.lineTo(cx-1*s, cy+2*s);
    ctx.lineTo(cx-5*s, cy+16*s);
    ctx.lineTo(cx+10*s, cy-3*s);
    ctx.lineTo(cx+1*s, cy-3*s);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPows(t){
  for(var i=0;i<G.pows.length;i++){
    var p = G.pows[i];
    if(p.x < view.x0 || p.x > view.x1 || p.y < view.y0 || p.y > view.y1) continue;
    var bob = Math.sin(t*2.2 + p.ph)*4;
    var fading = p.life < 4 ? (0.35 + 0.65*Math.abs(Math.sin(p.life*4))) : 1;
    var col = p.type === 'magnet' ? [90,215,255] : [255,200,80];
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.globalAlpha = fading;
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(0,0,0, 0,0, 46);
    g.addColorStop(0, rgba(col, 0.5));
    g.addColorStop(0.5, rgba(col, 0.16));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,46,0,TAU); ctx.fill();
    ctx.rotate(t*1.1);
    ctx.strokeStyle = rgba(col, 0.55);
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 9]);
    ctx.beginPath(); ctx.arc(0,0,30,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(-t*1.1);
    ctx.fillStyle = rgba(col, 0.2);
    ctx.beginPath(); ctx.arc(0,0,24,0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    drawPowIcon(0, 0, p.type, t, 1);
    ctx.restore();
  }
}

function wormStroke(w, width, style){
  var ns = w.nodes;
  if(ns.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(ns[0].x, ns[0].y);
  for(var i=1;i<ns.length;i++) ctx.lineTo(ns[i].x, ns[i].y);
  ctx.lineWidth = width;
  ctx.strokeStyle = style;
  ctx.stroke();
}

function wormBodyColor(w, t){
  if(w.hyperT > 0){
    return hueRgb((t*400 + w.phase*40) % 360, 1, 0.62);
  }
  if(w.skinId === 'prism'){
    var k = 0.5 + 0.5*Math.sin(t*1.7 + w.phase);
    return mix(w.c1, w.c2, k);
  }
  return w.c1;
}

function drawWorm(w, t, isLeader){
  if(!w.alive) return;
  var c1 = w.c1, c2 = w.c2;
  var body = wormBodyColor(w, t);
  var boostGlow = w.boosting || w.hyperT > 0;

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // outer neon glow
  ctx.globalCompositeOperation = 'lighter';
  wormStroke(w, w.r*3.4, rgba(body, boostGlow ? 0.14 : 0.055));
  wormStroke(w, w.r*2.15, rgba(body, boostGlow ? 0.2 : 0.09));
  wormStroke(w, w.r*1.5, rgba(mix(body,[255,255,255],0.3), boostGlow ? 0.42 : 0.2));
  ctx.globalCompositeOperation = 'source-over';

  // neon rim -> dark inner -> bright mid -> gloss
  wormStroke(w, w.r*1.94, rgba(mix(body, [255,255,255], 0.42), 0.92));
  wormStroke(w, w.r*1.66, rgba(dark(body, 0.34), 1));
  wormStroke(w, w.r*1.22, rgba(mix(body, [0,0,0], 0.06), 1));
  wormStroke(w, w.r*0.56, rgba(mix(body, [255,255,255], 0.85), 0.3));

  // energy cores along body
  var ns = w.nodes;
  var vx0 = view.x0, vx1 = view.x1, vy0 = view.y0, vy1 = view.y1;
  ctx.globalCompositeOperation = 'lighter';
  var step = (w.r < 12 && G.cam.scale < 0.7) ? 2 : 1;
  for(var i=1; i<ns.length; i+=step){
    var n = ns[i];
    if(n.x < vx0 || n.x > vx1 || n.y < vy0 || n.y > vy1) continue;
    var pulse = 0.5 + 0.5*Math.sin(t*4.2 - i*0.5 + w.phase);
    var cc = (w.skinId === 'prism' || w.hyperT > 0)
      ? hueRgb(((w.hyperT > 0 ? t*400 : t*90) + i*7) % 360, 1, 0.66)
      : mix(c2, [255,255,255], pulse*0.35);
    var rr = w.r*(0.16 + 0.2*pulse);
    ctx.fillStyle = rgba(cc, 0.55 + 0.3*pulse);
    ctx.beginPath(); ctx.arc(n.x, n.y, rr, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // head
  drawHead(w, t, isLeader, body);
}

function drawHead(w, t, isLeader, body){
  var hr = headRadius(w);
  var a = w.ang;

  // glow
  ctx.globalCompositeOperation = 'lighter';
  var g0 = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, hr*3);
  var gc = w.hyperT > 0 ? hueRgb((t*400)%360,1,0.6) : body;
  g0.addColorStop(0, rgba(gc, 0.35));
  g0.addColorStop(0.45, rgba(gc, 0.1));
  g0.addColorStop(1, rgba(gc, 0));
  ctx.fillStyle = g0;
  ctx.beginPath(); ctx.arc(w.x, w.y, hr*3, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // head disc
  var g1 = ctx.createRadialGradient(
    w.x - Math.cos(a)*hr*0.3, w.y - Math.sin(a)*hr*0.3, hr*0.15,
    w.x, w.y, hr*1.02
  );
  g1.addColorStop(0, rgba(mix(body,[255,255,255],0.6), 1));
  g1.addColorStop(0.55, rgba(body, 1));
  g1.addColorStop(1, rgba(dark(body, 0.5), 1));
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(w.x, w.y, hr, 0, TAU); ctx.fill();

  ctx.strokeStyle = rgba(mix(body,[255,255,255],0.55), 0.7);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(w.x, w.y, hr*0.98, 0, TAU); ctx.stroke();

  // eyes
  var px = -Math.sin(a), py = Math.cos(a);
  var blinkPhase = (t + w.phase) % 4.2;
  var blink = blinkPhase > 4.0 ? 1 - Math.abs(blinkPhase-4.1)*9 : 0;
  blink = clamp(blink, 0, 1);
  var eyeOff = hr*0.44;
  var eyeFwd = hr*0.28;
  var er = hr*0.42;
  for(var s=-1; s<=1; s+=2){
    var ex = w.x + px*eyeOff*s + Math.cos(a)*eyeFwd;
    var ey = w.y + py*eyeOff*s + Math.sin(a)*eyeFwd;
    ctx.fillStyle = '#f7feff';
    ctx.beginPath(); ctx.ellipse(ex, ey, er, er*(1-blink*0.86), 0, 0, TAU); ctx.fill();
    if(blink < 0.6){
      var cx2 = ex + Math.cos(a)*er*0.3, cy2 = ey + Math.sin(a)*er*0.3;
      ctx.fillStyle = '#0a1220';
      ctx.beginPath(); ctx.arc(cx2, cy2, er*0.56, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(cx2 - er*0.2, cy2 - er*0.24, er*0.2, 0, TAU); ctx.fill();
    }
  }

  // crown for leader
  if(isLeader){
    var bob = Math.sin(t*2.4)*hr*0.14;
    var cy3 = w.y - hr*1.75 + bob;
    ctx.save();
    ctx.translate(w.x, cy3);
    ctx.rotate(Math.sin(t*1.2)*0.08);
    ctx.globalCompositeOperation = 'lighter';
    var cg = ctx.createRadialGradient(0,6,0, 0,6, hr*2.6);
    cg.addColorStop(0, 'rgba(255,215,90,0.6)');
    cg.addColorStop(1, 'rgba(255,180,40,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 6, hr*2.6, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    var cw = hr*1.45, ch = hr*1.15;
    ctx.beginPath();
    ctx.moveTo(-cw, ch*0.42);
    ctx.lineTo(-cw, -ch*0.32);
    ctx.lineTo(-cw*0.45, ch*0.06);
    ctx.lineTo(0, -ch*0.62);
    ctx.lineTo(cw*0.45, ch*0.06);
    ctx.lineTo(cw, -ch*0.32);
    ctx.lineTo(cw, ch*0.42);
    ctx.closePath();
    var grd = ctx.createLinearGradient(0, -ch*0.6, 0, ch*0.5);
    grd.addColorStop(0, '#fff6c2');
    grd.addColorStop(0.5, '#ffcd3c');
    grd.addColorStop(1, '#e08a00');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,210,0.95)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // gems
    ctx.fillStyle = '#6ff0ff';
    ctx.beginPath(); ctx.arc(0, ch*0.1, hr*0.14, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff5d8f';
    ctx.beginPath(); ctx.arc(-cw*0.62, ch*0.2, hr*0.09, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cw*0.62, ch*0.2, hr*0.09, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // name tag: leader only (the rest live in the TOP 5 panel)
  if(!w.isPlayer && isLeader){
    ctx.font = '800 ' + (w.r*1.15).toFixed(1) + 'px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var tw = ctx.measureText(w.name).width;
    var ty = w.y - hr*3.35;
    ctx.fillStyle = 'rgba(6,12,22,0.55)';
    ctx.beginPath();
    var bx = w.x - tw/2 - 6, by = ty - w.r*0.86, bw = tw + 12, bh = w.r*1.72;
    ctx.moveTo(bx + bh/2, by);
    ctx.lineTo(bx + bw - bh/2, by);
    ctx.arc(bx + bw - bh/2, by + bh/2, bh/2, -Math.PI/2, Math.PI/2);
    ctx.lineTo(bx + bh/2, by + bh);
    ctx.arc(bx + bh/2, by + bh/2, bh/2, Math.PI/2, Math.PI*1.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,225,150,0.9)';
    ctx.fillText(w.name, w.x, ty);
  }
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<G.parts.length;i++){
    var p = G.parts[i];
    var k = clamp(p.life / (p.maxLife || 1), 0, 1);
    ctx.fillStyle = rgba(p.c, 0.85*k);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.5+k*0.9), 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(var i=0;i<G.floats.length;i++){
    var f = G.floats[i];
    var k = clamp(f.life/(f.maxLife||1), 0, 1);
    ctx.font = '900 ' + f.size + 'px -apple-system,sans-serif';
    ctx.fillStyle = rgba(f.c, k);
    ctx.fillText(f.t, f.x, f.y);
  }
}

function drawVignette(){
  var g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

/* minimap */
var MM = 92;
function drawMinimap(){
  var w = MM, h = MM;
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mctx.clearRect(0, 0, w, h);
  var cx = w/2, cy = h/2, rad = w*0.44;
  var k = rad / ARENA_R;

  mctx.fillStyle = 'rgba(8,20,38,0.82)';
  mctx.beginPath(); mctx.arc(cx, cy, rad, 0, TAU); mctx.fill();
  mctx.strokeStyle = 'rgba(255,90,130,0.55)';
  mctx.lineWidth = 1;
  mctx.beginPath(); mctx.arc(cx, cy, rad, 0, TAU); mctx.stroke();
  mctx.strokeStyle = 'rgba(80,180,240,0.13)';
  mctx.beginPath(); mctx.arc(cx, cy, rad*0.5, 0, TAU); mctx.stroke();

  // food (sparse)
  mctx.fillStyle = 'rgba(120,220,255,0.32)';
  for(var i=0;i<G.orbs.length;i+=7){
    var f = G.orbs[i];
    mctx.fillRect(cx + f.x*k, cy + f.y*k, f.big?1.6:1, f.big?1.6:1);
  }
  // powerups
  for(var p=0;p<G.pows.length;p++){
    var pw = G.pows[p];
    mctx.fillStyle = pw.type==='magnet' ? '#6fe0ff' : '#ffd45a';
    mctx.beginPath(); mctx.arc(cx+pw.x*k, cy+pw.y*k, 2, 0, TAU); mctx.fill();
  }

  // worms
  var leader = null;
  for(var m=0;m<G.worms.length;m++){
    var ww = G.worms[m];
    if(!ww.alive) continue;
    if(!leader || ww.len > leader.len) leader = ww;
  }
  for(var n=0;n<G.worms.length;n++){
    var x = G.worms[n];
    if(!x.alive || x.isPlayer) continue;
    mctx.fillStyle = rgba(x.c1, 0.75);
    mctx.beginPath(); mctx.arc(cx+x.x*k, cy+x.y*k, 1.7, 0, TAU); mctx.fill();
  }
  // leader star
  if(leader){
    var lx = cx + leader.x*k, ly = cy + leader.y*k;
    mctx.fillStyle = '#ffe066';
    mctx.beginPath();
    for(var s=0;s<10;s++){
      var rr2 = s%2 ? 2.2 : 5.2;
      var aa = -Math.PI/2 + s*Math.PI/5;
      var px2 = lx + Math.cos(aa)*rr2, py2 = ly + Math.sin(aa)*rr2;
      if(s===0) mctx.moveTo(px2,py2); else mctx.lineTo(px2,py2);
    }
    mctx.closePath(); mctx.fill();
  }
  // player
  var pl = G.player;
  if(pl && pl.alive){
    var pxx = cx + pl.x*k, pyy = cy + pl.y*k;
    mctx.strokeStyle = 'rgba(255,255,255,0.95)';
    mctx.lineWidth = 1.6;
    mctx.beginPath(); mctx.arc(pxx, pyy, 3.4, 0, TAU); mctx.stroke();
    mctx.fillStyle = '#fff';
    mctx.beginPath(); mctx.arc(pxx, pyy, 1.7, 0, TAU); mctx.fill();
  }
}

function render(t){
  var cam = G.cam;
  var cx = W/2, cy = H/2;
  var sc = cam.scale;
  var shk = cam.shake;
  var ox = 0, oy = 0;
  if(shk > 0.4){
    ox = rnd(-shk, shk);
    oy = rnd(-shk, shk);
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBack(cam, cx, cy);
  drawStars(cam, cx+ox*0.5, cy+oy*0.5, sc, ox, oy, t);

  var halfW = W/sc/2 + 160, halfH = H/sc/2 + 160;
  view.x0 = cam.x - halfW; view.x1 = cam.x + halfW;
  view.y0 = cam.y - halfH; view.y1 = cam.y + halfH;

  ctx.save();
  ctx.translate(cx+ox, cy+oy);
  ctx.scale(sc, sc);
  ctx.translate(-cam.x, -cam.y);

  drawArenaFloor(t);
  drawOrbs(t);
  drawPows(t);

  // find leader
  var leader = null;
  for(var i=0;i<G.worms.length;i++){
    var w = G.worms[i];
    if(!w.alive) continue;
    if(!leader || w.len > leader.len) leader = w;
  }
  // draw smaller first so player stands out
  var order = [];
  for(var j=0;j<G.worms.length;j++) if(G.worms[j].alive) order.push(G.worms[j]);
  order.sort(function(a,b){
    if(a.isPlayer) return 1;
    if(b.isPlayer) return -1;
    return a.len - b.len;
  });
  for(var k=0;k<order.length;k++){
    drawWorm(order[k], t, order[k] === leader);
  }

  drawParticles();
  drawFloats();
  ctx.restore();

  drawVignette();

  // wall danger warning
  if(G.player && G.player.alive){
    var wd = ARENA_R - Math.hypot(G.player.x, G.player.y);
    if(wd < 140){
      var wk = clamp(1 - wd/140, 0, 1);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,50,80,' + (wk*0.20*(0.55+0.45*Math.sin(G.time*11))).toFixed(3) + ')';
      ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  if(G.flashT > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(120,220,255,' + (G.flashT*0.22).toFixed(3) + ')';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawMinimap();
}

   15. HUD
   ================================================================== */
var rankRows = [];
function buildRankRows(){
  var html = '';
  for(var i=0;i<5;i++){
    html += '<div class="row" data-i="'+i+'"><span class="i">'+(i+1)+'</span><span class="c"></span><span class="n">-</span><span class="v">0</span></div>';
  }
  elRank.innerHTML = html;
  rankRows = [];
  var nodes = elRank.children || [];
  for(var j=0;j<nodes.length;j++) rankRows.push(nodes[j]);
}

function updateHud(force){
  var p = G.player;
  if(p){
  var lenNow = p.alive ? Math.round(p.len) : Math.round(G.lastLen);
  elLen.textContent = lenNow;
  elKills.textContent = G.kills;
  elBest.textContent = Math.max(G.best, p.alive ? Math.round(p.len) : 0);

  // boost button dim when too short
  if(p.alive && (p.len > BOOST_MIN_LEN || p.hyperT > 0)) elBoost.classList.remove('off');
  else elBoost.classList.add('off');

  // buffs
  var html = '';
  if(p.magnetT > 0){
    html += '<div class="buff"><span>🧲 자석</span><span class="bar"><i style="transform:scaleX('+(p.magnetT/5).toFixed(2)+')"></i></span><span>'+p.magnetT.toFixed(1)+'s</span></div>';
  }
  if(p.hyperT > 0){
    html += '<div class="buff hyper"><span>⚡ 하이퍼</span><span class="bar"><i style="transform:scaleX('+(p.hyperT/4).toFixed(2)+')"></i></span><span>'+p.hyperT.toFixed(1)+'s</span></div>';
  }
  elBuffs.innerHTML = html;
  } else {
    elLen.textContent = '0';
    elBest.textContent = Math.max(0, G.best);
    elBoost.classList.add('off');
    elBuffs.innerHTML = '';
  }

  // ranking
  var list = [];
  for(var i=0;i<G.worms.length;i++){
    var w = G.worms[i];
    if(w.alive) list.push(w);
  }
  list.sort(function(a,b){ return b.len - a.len; });
  for(var r=0;r<5;r++){
    var row = rankRows[r];
    if(!row) continue;
    var ww = list[r];
    if(!ww){
      row.className = 'row';
      if(row.children && row.children[2]) row.children[2].textContent = '-';
      if(row.children && row.children[3]) row.children[3].textContent = '';
      if(row.children && row.children[1]) row.children[1].textContent = '';
      continue;
    }
    row.className = 'row' + (ww.isPlayer ? ' me' : '') + (r === 0 ? ' top' : '');
    var cells = row.children || [];
    if(cells[1]) cells[1].textContent = r === 0 ? '👑' : '';
    if(cells[2]) cells[2].textContent = ww.isPlayer ? '나' : ww.name;
    if(cells[3]) cells[3].textContent = String(Math.round(ww.len));
  }
}

/* ==================================================================
   16. menu / skins
   ================================================================== */
function buildSkinCards(){
  var html = '';
  for(var i=0;i<SKINS.length;i++){
    var s = SKINS[i];
    html += '<div class="skin'+(i===G.skinIdx?' on':'')+'" data-skin="'+i+'">'
      + '<div class="sw" style="background:radial-gradient(circle at 34% 30%,'+cssHex(s.b)+','+cssHex(s.a)+' 58%,'+cssHex(dark(s.a,0.42))+' 100%);box-shadow:0 0 16px '+s.css+'99,0 0 30px '+s.css+'55"></div>'
      + '<div class="nm"><b>'+s.name+'</b><i>'+s.tag+'</i></div>'
      + '</div>';
  }
  elSkins.innerHTML = html;
  var cards = elSkins.children || [];
  for(var k=0;k<cards.length;k++){
    (function(card){
      card.addEventListener('click', function(){
        var idx = parseInt(card.getAttribute('data-skin'), 10);
        if(isNaN(idx)) return;
        selectSkin(idx);
      });
    })(cards[k]);
  }
}

function selectSkin(idx){
  G.skinIdx = idx;
  var cards = elSkins.children || [];
  for(var i=0;i<cards.length;i++){
    var on = (i === idx);
    if(on) cards[i].classList.add('on'); else cards[i].classList.remove('on');
  }
  if(G.phase === 'menu' && G.player){
    G.player.c1 = SKINS[idx].a;
    G.player.c2 = SKINS[idx].b;
    G.player.skinId = SKINS[idx].id;
  }
  try{ localStorage.setItem('uj.neonworm.skin', String(idx)); }catch(e){}
}

/* ==================================================================
   17. resize
   ================================================================== */
var W = 390, H = 700, DPR = 1;
function resize(){
  W = Math.max(240, window.innerWidth || 390);
  H = Math.max(320, window.innerHeight || 700);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';

  var mw = mmc.clientWidth || MM;
  MM = Math.max(56, Math.round(mw));
  mmc.width = Math.round(MM*DPR);
  mmc.height = Math.round(MM*DPR);
}

function bindResize(){
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
  if(window.ResizeObserver){
    try{
      var ro = new window.ResizeObserver(function(){ resize(); });
      ro.observe(document.body);
    }catch(e){}
  }
  window.addEventListener('visualViewport', function(){});
}

/* ==================================================================
   18. boot / loop
   ================================================================== */
var lastT = 0;
var acc = 0;
function stepWorld(dt){
  if(G.phase === 'play' || G.phase === 'dead' || G.phase === 'menu'){
    updateWorld(dt);
    updateCamera(dt);
  }
  G.hudT -= dt;
  if(G.hudT <= 0){ G.hudT = 0.1; updateHud(false); }
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  var dt = (ts - lastT)/1000;
  lastT = ts;
  if(!(dt > 0)) dt = 1/60;
  if(dt > 0.05) dt = 0.05;

  stepWorld(dt);
  render(G.time);
}

function boot(){
  resize();
  initStars();
  initNebulas();
  loadBest();
  try{
    var s = localStorage.getItem('uj.neonworm.skin');
    if(s !== null){ var si = parseInt(s,10); if(si >= 0 && si < SKINS.length) G.skinIdx = si; }
  }catch(e){}
  buildSkinCards();
  buildRankRows();
  bindInput();
  bindResize();

  // menu arena (AI only)
  resetArena();
  G.cam.x = 0; G.cam.y = 0;
  G.cam.scale = baseScale()*0.98;

  elStart.addEventListener('click', function(){ startGame(); });
  elAgain.addEventListener('click', function(){ startGame(); });
  elSkinBtn.addEventListener('click', function(){
    G.phase = 'menu';
    elOver.classList.add('hide');
    elMenu.classList.remove('hide');
    resetArena();
  });

  requestAnimationFrame(loop);
}

/* debug handle (harmless in production) */
window.UJSLITHER = {
  G: G, cfg: cfg, SKINS: SKINS, ARENA_R: ARENA_R,
  start: startGame, reset: resetArena, makeWorm: makeWorm, addAI: addAI,
  spawnPlayer: spawnPlayer, killWorm: killWorm, killPlayer: killPlayer,
  setAim: function(a){ if(G.player) G.player.aimA = a; },
  setBoost: function(v){ input.boostTouch = !!v; },
  input: input, seedFood: seedFood,
  debugGrid: buildGrid, debugNearest: nearestNode, debugCollide: collideCheck, headR: headRadius
};

boot();

})();
</script>
