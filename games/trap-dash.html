  function updateCrumbles(dt) {

      var c = S.crumbles[i];
      if (!c.alive) continue;
      if (!c.on && PL.grounded && gdir > 0 &&
          Math.abs(PL.y + PH - c.y) < 4 && PL.x + PW > c.x + 3 && PL.x < c.x + c.w - 3) {
        c.on = true; c.t = 0; sfx('crack'); shake = Math.max(shake, 3);
      }
      if (c.on) {
        c.t += dt;
        if (c.t > 0.26) {
          c.alive = false;
          burst(c.x + c.w / 2, c.y + 6, 8, '190,120,160', 0.7);
        }

    }
  }

  function updatePops(dt) {
    for (var i = 0; i < S.pops.length; i++) {

        if (p.up >= 1) { p.st = 'hold'; p.t = 0; }

        if (p.t >= p.hold) { p.st = 'fall'; p.t = 0; }

  function updateDrops(dt) {

  function updateSprings(dt) {

  function updateShooters(dt) {

  function updateCrushers(dt) {

  function updateDoors(dt) {

  /* ══════════ 위험 판정 ══════════ */
  function touchHazard() {

    }

      }
    }

      r = S.spikes[i];

    }
    for (i = 0; i < S.bullets.length; i++) {
      r = S.bullets[i];

    }
    for (i = 0; i < S.crushers.length; i++) {
      r = S.crushers[i];

  function touchWin() {

  }

  /* ══════════ 물리 ══════════ */
  function physStep(dt) {
    if (!S) return;
    S.t += dt;

    if (state === 'play' || state === 'dead') {
      updateCrumbles(dt); updatePops(dt); updateDrops(dt);
      updateGravs(dt); updateShooters(dt); updateCrushers(dt); updateDoors(dt);
    }

    /* 사망 연출 중에는 플레이어를 멈춤 */
    if (state !== 'play') return;

    updateSprings(dt);
    updateInverts(dt);

    var L = inp.left, R = inp.right;
    if (inv) { var t0 = L; L = R; R = t0; }
    var dir = (R ? 1 : 0) - (L ? 1 : 0);
    if (dir !== 0) {
      PL.vx += dir * ACC * dt;
      PL.face = dir;
    } else {
      var f = FRIC * dt;
      if (PL.vx > f) PL.vx -= f; else if (PL.vx < -f) PL.vx += f; else PL.vx = 0;
    }
    PL.vx = clamp(PL.vx, -RUN, RUN);

    if (jumpBuf > 0) {
      jumpBuf -= dt;
      if (PL.grounded || coyote > 0) {
        PL.vy = -JUMP * gdir;
        jumpBuf = 0; coyote = 0; PL.grounded = false; PL.sq = 1.14;
        sfx('jump');
      }
    }
    if (coyote > 0) coyote -= dt;

    PL.vy += GRAV * gdir * dt;
    if (PL.vy * gdir > MAXFALL) PL.vy = MAXFALL * gdir;

    var list = solidList(), i, s;

    /* X축 */
    PL.x += PL.vx * dt;
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (!hit(PL.x, PL.y, PW, PH, s.x, s.y, s.w, s.h)) continue;
      if (PL.vx > 0) PL.x = s.x - PW;
      else if (PL.vx < 0) PL.x = s.x + s.w;
      else PL.x = (PL.x + PW / 2 < s.x + s.w / 2) ? s.x - PW : s.x + s.w;
      PL.vx = 0;
    }
    PL.x = clamp(PL.x, 0, S.w - PW);

    /* Y축 */
    var wasGrounded = PL.grounded;
    PL.y += PL.vy * dt;
    PL.grounded = false;
    list = solidList();
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (!hit(PL.x + 1, PL.y, PW - 2, PH, s.x, s.y, s.w, s.h)) continue;
      if (PL.vy > 0) {
        PL.y = s.y - PH;
        if (gdir > 0) PL.grounded = true;
      } else if (PL.vy < 0) {
        PL.y = s.y + s.h;
        if (gdir < 0) PL.grounded = true;
      } else {
        PL.y = (PL.y + PH / 2 < s.y + s.h / 2) ? s.y - PH : s.y + s.h;
      }
      PL.vy = 0;
    }
    if (PL.grounded) {
      coyote = 0.09;
      if (!wasGrounded) { PL.sq = 0.74; sfx('land'); }
    }
    PL.sq += (1 - PL.sq) * Math.min(1, dt * 14);

    /* 세계 밖 */
    if (PL.y > DH + 90 || PL.y + PH < -110) { die(); return; }
    if (touchHazard()) { die(); return; }
    if (touchWin()) { stageClear(); return; }
  }

  function updateParts(dt) {

  }

    if (state === 'dead') return;
    var sq = PL.sq, w = PW * (2 - sq) * 0.5 + PW * 0.5, h = PH * sq;
    var x = PL.x + (PW - w) / 2, y = PL.y + (PH - h) * (gdir > 0 ? 1 : 0);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 2, y + h - 3, w, 3);
    ctx.fillStyle = '#ffd9e4'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ff5a7a'; ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = '#241026';
    var ex = PL.face > 0 ? 0.58 : 0.2;
    if (gdir > 0) {
      ctx.fillRect(x + w * ex, y + h * 0.34, 3.2, 5);
      ctx.fillRect(x + w * ex + (PL.face > 0 ? 5 : -5), y + h * 0.34, 3.2, 5);
    } else {
      ctx.fillRect(x + w * ex, y + h * 0.52, 3.2, 5);
      ctx.fillRect(x + w * ex + (PL.face > 0 ? 5 : -5), y + h * 0.52, 3.2, 5);
    }
    ctx.fillStyle = 'rgba(255,90,122,.55)';
    ctx.fillRect(x - 2, y + h * 0.55, 2, h * 0.3);
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], a = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = 'rgba(' + p.rgb + ',' + a.toFixed(2) + ')';
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
  }

  function drawFrame() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    if (!S) { ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H); return; }
    var cam = camX(), sk = shake > 0 ? shake : 0;
    ctx.save();
    ctx.translate(-cam * scale + (sk ? rnd(-sk, sk) : 0), offY + (sk ? rnd(-sk, sk) : 0));
    ctx.scale(scale, scale);
    drawRoom(cam);
    drawSolids();
    drawTraps(tsec);
    for (var i = 0; i < S.doors.length; i++) doorDraw(S.doors[i], tsec);
    drawPlayer(tsec);
    drawParts();
    ctx.restore();
    ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H);
    if (state === 'dead') {
      ctx.fillStyle = 'rgba(255,60,90,' + (0.28 * Math.max(0, 1 - deadT / RESPAWN_T)) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ══════════ 타이머 · 진행 ══════════ */
  function updateTimers(dt) {
    tsec += dt;
    updateParts(dt);
    if (shake > 0) { shake -= dt * 40; if (shake < 0) shake = 0; }
    if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.add('off'); }
    if (bT > 0) { bT -= dt; if (bT <= 0) banner(null); }
    if (state === 'dead') {
      deadT += dt;
      if (deadT >= RESPAWN_T) respawn();
    } else if (state === 'clear') {
      clearT += dt;
      if (clearT >= 1.05) {
        if (stageN >= NST) finishRun(true);
        else {
          loadStage(stageN + 1);
          state = 'play';
          banner('<span>STAGE ' + stageN + '</span><small>' + STAGES[stageN - 1].ko + '</small>', '', 1.3);
        }
      }
    }
  }

  /* ══════════ 루프 ══════════ */
  var lastT = 0, acc = 0, STEP = 1 / 120, raf = 0, fps = 0, fpsN = 0, fpsAcc = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    fpsN++; fpsAcc += dt;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsN = 0; fpsAcc = 0; }
    if (!paused) {
      if (state === 'play' || state === 'dead') {
        acc += dt;
        var guard = 0;
        while (acc >= STEP && guard < 8) {
          physStep(STEP); acc -= STEP; guard++;
          if (state !== 'play' && state !== 'dead') break;
        }
      } else { acc = 0; }
      updateTimers(dt);
    }
    drawFrame();
    paintScore();
  }

  /* ══════════ 버튼 ══════════ */
  $('startBtn').addEventListener('click', function () { startRun(); }, false);
  $('againBtn').addEventListener('click', function () { startRun(); }, false);
  $('pauseBtn').addEventListener('click', function () { togglePause(); }, false);
  $('resumeBtn').addEventListener('click', function () { togglePause(); }, false);
  $('restartBtn').addEventListener('click', function () { startRun(); }, false);
  $('quitBtn').addEventListener('click', function () { paused = false; hideOverlays(); finishRun(false); }, false);
  $('ovHome').addEventListener('click', function () { location.href = '../index.html'; }, false);
  $('mute').addEventListener('click', function () {
    muted = !muted; store('arc-sound', muted ? '0' : '1');
    if (master) master.gain.value = muted ? 0 : 0.8;
    paintMute(); if (!muted) sfx('ui');
  }, false);
  function openRank() { initAudio(); resumeAudio(); if (window.ArcadeRank) { try { ArcadeRank.open({ id: 'trap-dash' }); } catch (e) { } } }
  $('tRank').addEventListener('click', openRank, false);
  $('ovRank').addEventListener('click', openRank, false);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && (state === 'play' || state === 'dead' || state === 'clear') && !paused) {
      paused = true; $('pause').hidden = false;
      inp.left = inp.right = inp.jump = false;
      paintPad('left', false); paintPad('right', false); paintPad('jump', false);
    }
  }, false);

  /* ══════════ 확인용 훅 (?debug=1) ══════════ */
  window.__TD = {
    get state() { return state; },
    get stage() { return stageN; },
    get score() { return Math.round(score); },
    get deaths() { return deaths; },
    get fps() { return fps; },
    get errors() { return ERR.slice(); },
    get paused() { return paused; },
    get view() { return { W: W, H: H, scale: scale, viewW: viewW, viewH: viewH, offY: offY, topPad: topPad, botPad: botPad, dpr: DPR }; },
    get player() { return { x: +PL.x.toFixed(1), y: +PL.y.toFixed(1), vx: +PL.vx.toFixed(1), vy: +PL.vy.toFixed(1), grounded: PL.grounded, gdir: gdir, inv: inv }; },
    stageInfo: function (n) { var d = STAGES[clamp(n, 1, NST) - 1]; return { n: clamp(n, 1, NST), ko: d.ko, w: d.w, doors: d.doors.length }; },
    doors: function () {
      if (!S) return [];
      return S.doors.map(function (d) {
        return { x: Math.round(d.x), y: Math.round(d.y), kind: d.kind, alive: !!d.alive, gone: !!d.gone, st: d.st };
      });
    },
    traps: function () {
      if (!S) return {};
      return { pops: S.pops.length, drops: S.drops.length, crumbles: S.crumbles.length,
               springs: S.springs.length, crushers: S.crushers.length, bullets: S.bullets.length };
    },
    press: function (k, on) { setKey(k, on); },
    go: function (n) { if (!DEBUG) return false; paused = false; hideOverlays(); state = 'play'; loadStage(n); return true; },
    place: function (x, y) { if (!DEBUG) return false; PL.x = x; PL.y = y; PL.vx = 0; PL.vy = 0; return true; },
    start: function () { if (!DEBUG) return false; startRun(); return true; }
  };

  /* ══════════ 시작 ══════════ */
  paintBest();
  loadStage(1);
  state = 'title';
  requestAnimationFrame(frame);
})();
</script>
<script src="home.js"></script>
</body>
